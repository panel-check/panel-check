<style>
  .contenido { max-width: 1100px; margin: 18px auto 60px; padding: 0 20px; }
  .inf-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .inf-barra h2 { font-size: 18px; margin: 0; color: #1f2430; }
  .inf-barra .der { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .inf-pdf { width: 100%; height: calc(100vh - 170px); min-height: 520px; border: 1px solid var(--borde); border-radius: 10px; background: #eef1f5; }
  .inf-caja { background: white; border: 1px solid var(--borde); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .inf-caja h3 { font-size: 14px; margin: 0 0 10px; color: #1f2430; }
  .inf-grid { display: grid; grid-template-columns: 180px 1fr; gap: 6px 14px; font-size: 13px; }
  .inf-grid dt { color: var(--gris); }
  .inf-grid dd { margin: 0; }
  .inf-kpis { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .inf-kpi { background: white; border: 1px solid var(--borde); border-radius: 10px; padding: 10px 14px; min-width: 140px; }
  .inf-kpi b { display: block; font-size: 20px; color: #1f2430; }
  .inf-kpi span { font-size: 12px; color: var(--gris); }
  .inf-caja ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .inf-filtro { margin: 0 0 8px; padding: 6px 9px; border: 1px solid var(--borde-control); border-radius: 6px; font: inherit; font-size: 13px; width: 260px; max-width: 100%; }
  a.cl-btn { text-decoration: none; display: inline-block; }
  .inf-fichas { display: grid; gap: 12px; }
  .inf-ficha { border: 1px solid var(--borde); border-radius: 8px; padding: 12px 14px; background: #fafbfc; }
  .inf-ficha-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
  .inf-ficha-cab strong { font-size: 15px; color: #1f2430; }
  .inf-ficha .inf-grid { margin-bottom: 6px; }
  .inf-largo { font-size: 13px; line-height: 1.5; margin-top: 8px; }
  .inf-largo span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--gris); margin-bottom: 2px; }
  .inf-destacado { background: #fff8e6; border-left: 3px solid #f0b429; padding: 8px 10px; border-radius: 4px; }
  .cl-tabla td { white-space: normal; }
  .inf-obs { white-space: pre-wrap; font-size: 13.5px; line-height: 1.5; margin: 0; }
  @media (max-width: 640px) { .inf-grid { grid-template-columns: 1fr; } .inf-grid dt { margin-top: 6px; } .inf-pdf { height: 75vh; } }
</style>
<script src="/static/sesion.js" defer></script>
