<script>
const LIMIT = 100;
let estado = { offset: 0, total: 0, sort: "lead_score", order: "desc" };
window.alRecargar = () => cargar(estado.offset);
// Al agregar/resolver un comentario desde el popup 💬 de una fila, se
// actualiza solo el contador del encabezado (el globito de la fila ya lo
// repinta el popup, sin recargar la tabla).
window.alCambiarComentarios = actualizarContadorComentarios;

// ── Selector de Boletín ──
// En vez de una lista plana de todos los boletines, agrupa por mes de
// publicación (según boletines.fecha). Cuando ya hay boletines de más de un
// año Y estamos en 2027 o después, suma pestañas por año (automático: no hace
// falta tocar nada al arrancar 2027). El valor real sigue en <select id="f-boletin">.
const MESES_ES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio",
                  "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const bol = { lista: [], tabAnio: null };

function fmtMiles(n) { return Number(n).toLocaleString("es-AR"); }

function iniciarSelectorBoletin(boletines) {
  // fecha viene como "YYYY-MM-DD" (DATE); se parte a mano para no correrla por zona horaria.
  bol.lista = boletines.map(b => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(b.fecha || "");
    return { numero: String(b.numero), total: b.total_marcas,
             anio: m ? Number(m[1]) : null, mes: m ? Number(m[2]) : null, dia: m ? m[3] : null };
  });
  const btn = document.getElementById("bol-btn");
  btn.addEventListener("click", () => {
    const abierto = document.getElementById("bol-pop").hidden;
    abierto ? abrirSelectorBoletin() : cerrarSelectorBoletin();
  });
  document.addEventListener("click", ev => {
    if (!document.getElementById("bol-picker").contains(ev.target)) cerrarSelectorBoletin();
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") cerrarSelectorBoletin(); });
  refrescarBotonBoletin();
}

function cerrarSelectorBoletin() {
  document.getElementById("bol-pop").hidden = true;
  document.getElementById("bol-btn").setAttribute("aria-expanded", "false");
}

function abrirSelectorBoletin() {
  const sel = document.getElementById("f-boletin").value;
  const actual = bol.lista.find(b => b.numero === sel);
  const anios = [...new Set(bol.lista.map(b => b.anio).filter(a => a !== null))].sort((a, b) => b - a);
  // Pestaña inicial: la del año del boletín elegido, o la del año más reciente.
  bol.tabAnio = (actual && actual.anio) || anios[0] || null;
  renderSelectorBoletin();
  document.getElementById("bol-pop").hidden = false;
  document.getElementById("bol-btn").setAttribute("aria-expanded", "true");
}

function elegirBoletin(valor) {
  const sel = document.getElementById("f-boletin");
  sel.value = valor;
  refrescarBotonBoletin();
  cerrarSelectorBoletin();
  sel.dispatchEvent(new Event("change")); // dispara cargar(0), igual que cuando era un <select>
}

// Texto del botón + resaltado "con valor" (se llama también desde marcarFiltrosActivos).
function refrescarBotonBoletin() {
  const sel = document.getElementById("f-boletin");
  const btn = document.getElementById("bol-btn");
  if (!sel || !btn) return;
  const v = sel.value;
  let txt = "Todos";
  if (v === "pre") txt = sel.options[sel.selectedIndex]?.textContent || "🆕 Pre-boletín";
  else if (v) {
    const b = bol.lista.find(x => x.numero === v);
    txt = b && b.dia ? `${v} · ${b.dia}/${String(b.mes).padStart(2, "0")}/${b.anio}` : v;
  }
  document.getElementById("bol-btn-txt").textContent = txt;
  btn.classList.toggle("con-valor", v !== "");
}

function renderSelectorBoletin() {
  const sel = document.getElementById("f-boletin").value;
  const anios = [...new Set(bol.lista.map(b => b.anio).filter(a => a !== null))].sort((a, b) => b - a);
  // Pestañas por año: recién desde 2027, y solo si hay más de un año cargado.
  const usarTabs = new Date().getFullYear() >= 2027 && anios.length > 1;

  const optPre = document.getElementById("f-boletin").querySelector('option[value="pre"]');
  const txtPre = optPre ? optPre.textContent : "🆕 Pre-boletín";
  let html = `<button type="button" class="bol-item bol-fijo${sel === "" ? " sel" : ""}" data-v="">Todos</button>
    <button type="button" class="bol-item bol-fijo${sel === "pre" ? " sel" : ""}" data-v="pre">${_escapeHtml(txtPre)}</button>`;

  if (usarTabs) {
    html += `<div class="bol-tabs" role="tablist">` + anios.map(a =>
      `<button type="button" role="tab" class="bol-tab${a === bol.tabAnio ? " activa" : ""}" data-anio="${a}">${a}</button>`
    ).join("") + `</div>`;
  }

  // Agrupa por año-mes (los más nuevos primero); los que no tienen fecha van al final.
  const visibles = bol.lista.filter(b => !usarTabs || b.anio === bol.tabAnio || b.anio === null);
  const grupos = new Map();
  [...visibles].sort((a, b) =>
    ((b.anio ?? 0) * 100 + (b.mes ?? 0)) - ((a.anio ?? 0) * 100 + (a.mes ?? 0)) ||
    (Number(b.numero) - Number(a.numero))
  ).forEach(b => {
    const k = b.anio ? `${b.anio}-${String(b.mes).padStart(2, "0")}` : "sin-fecha";
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(b);
  });

  let primero = true;
  grupos.forEach((items, k) => {
    const titulo = k === "sin-fecha" ? "Sin fecha" : `${MESES_ES[items[0].mes - 1]} ${items[0].anio}`;
    const marcas = items.reduce((s, b) => s + (Number(b.total) || 0), 0);
    // Abierto: el mes del boletín elegido, o el más reciente si no hay ninguno elegido.
    const abierto = items.some(b => b.numero === sel) || (primero && !bol.lista.some(b => b.numero === sel && visibles.includes(b)));
    primero = false;
    html += `<details class="bol-mes"${abierto ? " open" : ""}>
      <summary><span>${_escapeHtml(titulo)}</span><small>${items.length} ${items.length === 1 ? "boletín" : "boletines"} · ${fmtMiles(marcas)} marcas</small></summary>
      ${items.map(b => `<button type="button" class="bol-item${b.numero === sel ? " sel" : ""}" data-v="${_escapeHtml(b.numero)}">
        <span class="bol-n">${_escapeHtml(b.numero)}</span>
        <span class="bol-f">${b.dia ? `${b.dia}/${String(b.mes).padStart(2, "0")}` : ""}</span>
        <span class="bol-t">${b.total ?? "?"}</span></button>`).join("")}
    </details>`;
  });

  const pop = document.getElementById("bol-pop");
  pop.innerHTML = html;
  pop.querySelectorAll(".bol-item").forEach(el => el.addEventListener("click", () => elegirBoletin(el.dataset.v)));
  pop.querySelectorAll(".bol-tab").forEach(el => el.addEventListener("click", () => {
    bol.tabAnio = Number(el.dataset.anio);
    renderSelectorBoletin();
  }));
}

function qs(params) {
  return Object.entries(params)
    .filter(([, v]) => v !== "" && v !== null && v !== undefined)
    .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
    .join("&");
}

async function cargarFiltrosIniciales() {
  const boletines = await api("/api/boletines");
  const selB = document.getElementById("f-boletin");
  // Opción fija: marcas del escaneo directo que todavía no salieron en un boletín.
  const optPre = document.createElement("option");
  optPre.value = "pre";
  optPre.textContent = "🆕 Pre-boletín";
  selB.appendChild(optPre);
  api("/api/pre-boletin/total")
    .then(r => { optPre.textContent = `🆕 Pre-boletín (${r.total})`; refrescarBotonBoletin(); })
    .catch(() => {});
  boletines.forEach(b => {
    const opt = document.createElement("option");
    opt.value = b.numero;
    opt.textContent = `${b.numero} (${b.total_marcas ?? "?"})`;
    selB.appendChild(opt);
  });
  iniciarSelectorBoletin(boletines);

  const clases = await api("/api/clases");
  ["f-clase", "f-multiclase-a", "f-multiclase-b"].forEach(id => {
    const sel = document.getElementById(id);
    clases.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      sel.appendChild(opt);
    });
  });
}

// ── Filtro avanzado "Misma marca en varias clases" ──
// Muestra solo los campos del modo elegido (mínimo de clases, o par de clases).
function actualizarCamposMulticlase() {
  const modo = document.getElementById("f-multiclase-modo").value;
  document.getElementById("lbl-multiclase-min").hidden = modo !== "min";
  document.getElementById("lbl-multiclase-a").hidden = modo !== "par";
  document.getElementById("lbl-multiclase-b").hidden = modo !== "par";
  document.getElementById("lbl-multiclase-titular").hidden = !modo;
}

function filtrosMulticlase() {
  const modo = document.getElementById("f-multiclase-modo").value;
  const titular = document.getElementById("f-multiclase-titular").value;
  if (modo === "min") {
    return {
      multiclase_min: document.getElementById("f-multiclase-min").value || "2",
      multiclase_titular: titular,
    };
  }
  if (modo === "par") {
    const a = document.getElementById("f-multiclase-a").value;
    const b = document.getElementById("f-multiclase-b").value;
    if (!a || !b || a === b) return {}; // incompleto: no filtra
    return { multiclase_a: a, multiclase_b: b, multiclase_titular: titular };
  }
  return {};
}

function opcionOposicion() {
  return document.getElementById("f-oposicion").value;
}

function filtrosActuales() {
  return {
    boletin: document.getElementById("f-boletin").value,
    clase: document.getElementById("f-clase").value,
    es_lead: document.getElementById("f-lead").value,
    contactado: document.getElementById("f-contactado").value,
    // El desplegable "Oposición" es uno solo; al servidor le llegan dos datos:
    // si tuvo oposición/vista (o no) y, si se eligió, de qué tipo.
    tuvo_oposicion: opcionOposicion() === "sin" ? "false" : (opcionOposicion() ? "true" : ""),
    tipo_oposicion: ["oposicion", "vista"].includes(opcionOposicion()) ? opcionOposicion() : "",
    fecha_desde: document.getElementById("f-fecha-desde").value,
    fecha_hasta: document.getElementById("f-fecha-hasta").value,
    fecha_dias: document.getElementById("f-fecha-dias").value,
    tiene_email: document.getElementById("f-tiene-email").value,
    tiene_titular: document.getElementById("f-tiene-titular").value,
    tiene_clase: document.getElementById("f-tiene-clase").value,
    estado_marca: document.getElementById("f-estado-marca").value,
    ...filtrosMulticlase(),
    q: document.getElementById("f-q").value,
    sort: estado.sort,
    order: estado.order,
    limit: LIMIT,
    offset: estado.offset,
  };
}

  document.getElementById("f-clase").value = "";
  document.getElementById("f-lead").value = "true";
  document.getElementById("f-contactado").value = "false";

  document.getElementById("f-fecha-desde").value = "";
  document.getElementById("f-fecha-hasta").value = "";
  document.getElementById("f-fecha-dias").value = "";
  document.getElementById("f-tiene-email").value = "";
  document.getElementById("f-tiene-titular").value = "";
  document.getElementById("f-tiene-clase").value = "";
  document.getElementById("f-estado-marca").value = "";
  document.getElementById("f-multiclase-modo").value = "";
  document.getElementById("f-multiclase-min").value = "2";
  document.getElementById("f-multiclase-a").value = "";

// ── Fecha Boletín: un solo campo que abre un popover con "desde"/"hasta" ──
// (antes eran dos <input type="date"> sueltos en la barra de filtros).
function toggleRangoFecha(ev) {
  if (ev) ev.stopPropagation();
  document.getElementById("rango-fecha").classList.toggle("abierto");
}

document.addEventListener("click", (ev) => {
  const cont = document.getElementById("rango-fecha");
  if (cont && !cont.contains(ev.target)) cont.classList.remove("abierto");
});

function formatearFechaCorta(iso) {
  if (!iso) return "";
  const [a, m, d] = iso.split("-");
  return `${d}/${m}/${a}`;
}

function actualizarEtiquetaRangoFecha() {
  const desde = document.getElementById("f-fecha-desde").value;
  const hasta = document.getElementById("f-fecha-hasta").value;
  const dias = document.getElementById("f-fecha-dias").value;
  const campo = document.getElementById("campo-rango-fecha");
  document.querySelectorAll("#atajos-fecha button").forEach(b => b.classList.toggle("activo", b.dataset.dias === dias));
  if (dias) {
    campo.textContent = dias === "1" ? "Hoy" : `Últimos ${dias} días`;
    campo.classList.remove("vacio");
  } else if (!desde && !hasta) {
    campo.textContent = "Todas las fechas";
    campo.classList.add("vacio");
  } else if (desde && hasta) {
    campo.textContent = `${formatearFechaCorta(desde)} – ${formatearFechaCorta(hasta)}`;
    campo.classList.remove("vacio");
  } else if (desde) {
    campo.textContent = `Desde ${formatearFechaCorta(desde)}`;
    campo.classList.remove("vacio");
  } else {
    campo.textContent = `Hasta ${formatearFechaCorta(hasta)}`;
    campo.classList.remove("vacio");
  }
}

function aplicarRangoFecha() {
  // Si se escribió un rango a mano, manda el rango (el atajo "últimos N días" se descarta).
  if (document.getElementById("f-fecha-desde").value || document.getElementById("f-fecha-hasta").value) {
    document.getElementById("f-fecha-dias").value = "";
  }
  actualizarEtiquetaRangoFecha();
  document.getElementById("rango-fecha").classList.remove("abierto");
  cargar(0);
}

// "Hoy" / "Últimos N días": se guardan como N, no como fechas fijas, así un
// acceso rápido sigue sirviendo mañana (el servidor lo cuenta desde hoy).
function elegirAtajoFecha(dias) {
  document.getElementById("f-fecha-dias").value = String(dias);
  document.getElementById("f-fecha-desde").value = "";
  document.getElementById("f-fecha-hasta").value = "";
  aplicarRangoFecha();
}

function limpiarRangoFecha() {
  document.getElementById("f-fecha-desde").value = "";
  document.getElementById("f-fecha-hasta").value = "";
  document.getElementById("f-fecha-dias").value = "";
  actualizarEtiquetaRangoFecha();
  document.getElementById("rango-fecha").classList.remove("abierto");
  cargar(0);
}

// ── Filtros avanzados: colapsados por default, para no saturar la barra ──
function toggleFiltrosAvanzados() {
  const panel = document.getElementById("filtros-avanzados");
  const abierto = panel.classList.toggle("abierto");
  const btn = document.getElementById("btn-filtros-avanzados");
  btn.classList.toggle("abierto", abierto);
  btn.setAttribute("aria-expanded", abierto ? "true" : "false");
}

// Resalta los filtros que están recortando resultados y muestra en el
// botón "Avanzados" cuántos filtros avanzados hay aplicados (así se nota
// aunque el panel esté cerrado).
const IDS_AVANZADOS = ["f-tiene-email", "f-tiene-titular", "f-tiene-clase", "f-estado-marca", "f-multiclase-modo"];
function marcarFiltrosActivos() {
  document.querySelectorAll(".filtros select, .filtros input[type=text], .filtros-avanzados select").forEach(el => {
    el.classList.toggle("con-valor", el.value !== "");
  });
  refrescarBotonBoletin();
  const hayFecha = document.getElementById("f-fecha-desde").value || document.getElementById("f-fecha-hasta").value
    || document.getElementById("f-fecha-dias").value;
  document.getElementById("campo-rango-fecha").classList.toggle("con-valor", !!hayFecha);

  document.getElementById("cant-avanzados").textContent = cant ? String(cant) : "";

// Los desplegables filtran solos al cambiar; la búsqueda, al apretar Enter.
function engancharFiltrosAutomaticos() {
  document.querySelectorAll(".filtros select, .filtros-avanzados select, #f-multiclase-min").forEach(el => {
    el.addEventListener("change", () => cargar(0));
  });
  document.getElementById("f-q").addEventListener("keydown", ev => {
    if (ev.key === "Enter") cargar(0);
  });
}

// La URL refleja siempre los filtros/orden/página actuales (se actualiza
// sola en cada cargar(), con replaceState para no ensuciar el historial de
// "atrás/adelante" con cada tecla) — así el link de la barra de direcciones
// ya sirve para compartir exactamente esta búsqueda, sin un paso aparte.
// Para la URL (y para los accesos rápidos) "Todos" en Lead y Contactado se
// escribe como "todos": si no, al abrir el link volverían a los valores de
// siempre (Solo leads / Sin contactar), porque un filtro vacío no se escribe.
function paramsURL() {
  const p = filtrosActuales();
  if (p.es_lead === "") p.es_lead = "todos";
  if (p.contactado === "") p.contactado = "todos";
  return p;
}

// Lo que guarda un acceso rápido: los filtros de ahora, sin la página.
window.consultaParaGuardar = function () {
  const p = paramsURL();
  delete p.limit;
  delete p.offset;
  return qs(p);
};

// Resumen en palabras de los filtros de ahora (para la ventana de guardar).
window.describirFiltrosActuales = function () {
  const partes = [];
  const texto = id => { const el = document.getElementById(id); return el.options[el.selectedIndex]?.textContent.trim() || ""; };
  if (document.getElementById("f-boletin").value) partes.push(`Boletín ${document.getElementById("bol-btn-txt").textContent.trim()}`);
  if (document.getElementById("f-clase").value) partes.push(`Clase ${document.getElementById("f-clase").value}`);
  if (document.getElementById("f-lead").value) partes.push(texto("f-lead"));
  if (document.getElementById("f-contactado").value) partes.push(texto("f-contactado"));
  if (document.getElementById("f-oposicion").value) partes.push(texto("f-oposicion"));
  if (!document.getElementById("campo-rango-fecha").classList.contains("vacio")) {
    partes.push(`Fecha boletín: ${document.getElementById("campo-rango-fecha").textContent.trim()}`);
  }
  [["f-tiene-email", "Email"], ["f-tiene-titular", "Titular"], ["f-tiene-clase", "Clase asignada"],
   ["f-estado-marca", "Estado"], ["f-multiclase-modo", "Misma marca en varias clases"]].forEach(([id, rotulo]) => {
    if (document.getElementById(id).value) partes.push(`${rotulo}: ${texto(id)}`);
  });
  const q = document.getElementById("f-q").value.trim();
  if (q) partes.push(`Búsqueda «${q}»`);
  return partes;
};

// Aplica una búsqueda guardada sin recargar la página (la llama el ⚡ de menu.js).
window.aplicarAccesoRapido = function (consulta) {
  history.replaceState(null, "", `${location.pathname}?${consulta}`);
  filtrosDesdeURL();
  cargar(0);
};

function actualizarURL() {
  const qsActual = qs(paramsURL());
  const nueva = qsActual ? `${location.pathname}?${qsActual}` : location.pathname;
  history.replaceState(null, "", nueva);
}

// Al entrar con un link compartido (?boletin=...&f-lead=... etc.), precarga
// los filtros desde la URL en vez de arrancar siempre con los de siempre.
function filtrosDesdeURL() {
  const p = new URLSearchParams(location.search);
  if (!p.toString()) return false;
  // "todos" = filtro vacío a propósito (ver paramsURL); si el parámetro no
  // viene, Lead y Contactado vuelven a los valores de siempre.
  const leer = (clave, defecto = "") => {
    const v = p.get(clave);
    return v === null ? defecto : (v === "todos" ? "" : v);
  };
  document.getElementById("f-boletin").value = leer("boletin");
  document.getElementById("f-clase").value = leer("clase");
  document.getElementById("f-lead").value = leer("es_lead", "true");
  document.getElementById("f-contactado").value = leer("contactado", "false");
  // Oposición: los links viejos traen solo tuvo_oposicion=true|false.
  const tipoOpo = p.get("tipo_oposicion");
  const tuvoOpo = p.get("tuvo_oposicion");
  document.getElementById("f-oposicion").value =
    (tipoOpo === "oposicion" || tipoOpo === "vista") ? tipoOpo
      : tuvoOpo === "true" ? "con" : tuvoOpo === "false" ? "sin" : "";
  document.getElementById("f-fecha-desde").value = p.get("fecha_desde") ?? "";
  document.getElementById("f-fecha-hasta").value = p.get("fecha_hasta") ?? "";
  document.getElementById("f-fecha-dias").value = /^\d+$/.test(p.get("fecha_dias") ?? "") ? p.get("fecha_dias") : "";
  document.getElementById("f-tiene-email").value = p.get("tiene_email") ?? "";
  document.getElementById("f-tiene-titular").value = p.get("tiene_titular") ?? "";
  document.getElementById("f-tiene-clase").value = p.get("tiene_clase") ?? "";
  document.getElementById("f-estado-marca").value = p.get("estado_marca") ?? "";
  if (p.get("multiclase_min")) {
    document.getElementById("f-multiclase-modo").value = "min";
    document.getElementById("f-multiclase-min").value = p.get("multiclase_min");
  } else if (p.get("multiclase_a") && p.get("multiclase_b")) {
    document.getElementById("f-multiclase-modo").value = "par";
    document.getElementById("f-multiclase-a").value = p.get("multiclase_a");
    document.getElementById("f-multiclase-b").value = p.get("multiclase_b");
  } else {
    document.getElementById("f-multiclase-modo").value = "";
  }
  document.getElementById("f-multiclase-titular").value = p.get("multiclase_titular") ?? "";
  actualizarCamposMulticlase();
  document.getElementById("f-q").value = p.get("q") ?? "";
  estado.sort = p.get("sort") || estado.sort;
  estado.order = p.get("order") || estado.order;
  estado.offset = parseInt(p.get("offset") || "0", 10) || 0;
  actualizarEtiquetaRangoFecha();
  // Si el link trae algún filtro avanzado aplicado, mostrar el panel
  // abierto de entrada — si no, el usuario no se entera de que está filtrado.
  if (p.get("tiene_email") || p.get("tiene_titular") || p.get("tiene_clase") || p.get("estado_marca")
      || p.get("multiclase_min") || p.get("multiclase_a")) {
    if (!document.getElementById("filtros-avanzados").classList.contains("abierto")) toggleFiltrosAvanzados();
  }
  return true;
}

function ordenarPor(col) {
  if (estado.sort === col) {
    estado.order = estado.order === "desc" ? "asc" : "desc";
  } else {
    estado.sort = col;
    estado.order = "desc";
  }
  cargar(estado.offset);
}

function pagina(delta) {
  const nuevo = estado.offset + delta * LIMIT;
  if (nuevo < 0 || nuevo >= estado.total) return;
  cargar(nuevo);
}

function agruparPorTitular(rows) {
  // Junta filas del mismo titular en un solo grupo, conservando el orden
  // en que ya vinieron (por lead_score desc). La clave es el CUIT cuando
  // ya se pudo leer del expediente; si no, el nombre normalizado (ver
  // claveTitular en comun.js).
  const grupos = new Map();
  for (const r of rows) {
    const clave = claveTitular(r) || `__acta_${r.acta}`; // sin nada: no agrupa
    if (!grupos.has(clave)) grupos.set(clave, []);
    grupos.get(clave).push(r);
  }
  return [...grupos.values()];
}

// Con el filtro "Misma marca en varias clases" activo, la API manda en
// clases_misma_marca todas las clases en las que está pedida esa marca.
function celdaOtrasClases(r) {
  if (!Array.isArray(r.clases_misma_marca)) return "";
  const otras = r.clases_misma_marca.filter(c => c !== r.clase);
  if (!otras.length) return "";
  return ` <span class="otras-clases" title="Esta marca también está pedida en clase ${_escapeHtml(otras.join(", "))}">+${_escapeHtml(otras.join(", "))}</span>`;
}

function filaHtml(r, { flecha = false, oculta = false, idGrupo = null, cantidadResto = 0 } = {}) {
  const claseOculta = oculta ? "fila-oculta" : "";
  const atributoGrupo = idGrupo ? `data-grupo="${idGrupo}"` : "";
  const tituLink = linkTitular(r);
  const celdaTitular = flecha
    ? `<button class="flecha-grupo" onclick="toggleGrupo('${idGrupo}', this)" title="Ver ${cantidadResto} marca(s) más de este titular">▸</button> ${tituLink} <span class="cant-grupo">(+${cantidadResto})</span>`
    : tituLink;
  const clave = claveTitular(r);
  const hrefTitular = clave ? `/titular/${encodeURIComponent(clave)}` : "javascript:void(0)";
  // La casilla del titular agrupado selecciona todas sus marcas (también las plegadas);
  // las demás filas tienen su propia casilla.
  const celdaSel = flecha
    ? `<td class="col-sel"><input type="checkbox" class="sel-grupo" data-grupo="${idGrupo}" title="Seleccionar las ${cantidadResto + 1} marcas de este titular" aria-label="Seleccionar las ${cantidadResto + 1} marcas de este titular" /></td>`
    : `<td class="col-sel"><input type="checkbox" class="sel-fila" data-acta="${_idSeguro(r.acta)}" aria-label="Seleccionar la marca del acta ${_escapeHtml(r.acta)}" /></td>`;
  return `
    <tr class="${r.es_lead ? "lead" : ""} ${r.contactado ? "contactado" : ""} ${claseOculta}" ${atributoGrupo} data-acta="${_idSeguro(r.acta)}">
      ${celdaSel}
      <td class="score">${r.lead_score ?? ""}</td>
      <td>${_escapeHtml(r.clase ?? "")}${celdaOtrasClases(r)}</td>
      <td class="denominacion" title="${_escapeHtml(r.denominacion_inpi || r.denominacion || "")}">${_escapeHtml(r.denominacion_inpi || r.denominacion || "") || `<em>${sinNombre(r.tipo)}</em>`}</td>
      <td class="titular" title="${_escapeHtml(r.titular || "")}">${celdaTitular}</td>
      <td>${badgeLead(r)} ${crmSlot(claveTitular(r))} ${badgePreBoletin(r)} ${badgeOposicion(r)} ${badgeRevisionOposicion(r)} ${badgeEstadoTramite(r)}</td>
      <td class="celda-email">${celdaEmailIcono(r)}</td>
      <td>${fechaPublicacionOFallback(r)}</td>
      <td>${fmtFecha(r.fecha_concesion) || "—"}</td>
      <td class="celda-acciones">${botonComentarios(r.acta)} <a class="abrir" href="${hrefTitular}" target="_blank" title="Ver ficha completa del titular (boletín ${_escapeHtml(r.boletin || "sin boletín todavía")}, acta ${_escapeHtml(r.acta)})">Abrir</a></td>
    </tr>
  `;
}

// ── Selección masiva ──────────────────────────────────────────────────────
// Se marcan marcas (por acta) con las casillas; la barra de arriba de la tabla
// ofrece las acciones. La selección sobrevive al cambiar de página u orden y se
// borra al cambiar los filtros. "Seleccionar las N que coinciden con el filtro"
// trae del servidor TODAS las actas del filtro (no solo las 100 de la página).
const seleccion = { actas: new Set(), todoElFiltro: false, firma: null };
let gruposPagina = {};  // idGrupo -> actas del titular agrupado (de la página actual)
let actasPagina = [];   // todas las actas de la página actual
let usuariosAsignar = null;

// Los filtros sin orden ni página: si cambian, cambia la selección posible.
function firmaFiltros() {
  const p = filtrosActuales();
  ["sort", "order", "limit", "offset"].forEach(k => delete p[k]);
  return qs(p);
}

function plural(n, uno, varios) { return `${fmtMiles(n)} ${n === 1 ? uno : varios}`; }

function pintarSeleccion() {
  const n = seleccion.actas.size;
  document.querySelectorAll("#tbody input.sel-fila").forEach(cb => {
    const marcada = seleccion.actas.has(cb.dataset.acta);
    cb.checked = marcada;
    cb.closest("tr").classList.toggle("seleccionada", marcada);
  });
  document.querySelectorAll("#tbody input.sel-grupo").forEach(cb => {
    const actas = gruposPagina[cb.dataset.grupo] || [];
    const cant = actas.filter(a => seleccion.actas.has(a)).length;
    cb.checked = actas.length > 0 && cant === actas.length;
    cb.indeterminate = cant > 0 && cant < actas.length;
    cb.closest("tr").classList.toggle("seleccionada", actas.length > 0 && cant === actas.length);
  });

  const enPagina = actasPagina.filter(a => seleccion.actas.has(a)).length;
  const todo = document.getElementById("sel-todo");
  todo.checked = actasPagina.length > 0 && enPagina === actasPagina.length;
  todo.indeterminate = enPagina > 0 && enPagina < actasPagina.length;

  const barra = document.getElementById("barra-sel");
  barra.hidden = n === 0;
  if (n === 0) return;
  document.getElementById("barra-sel-info").textContent = seleccion.todoElFiltro
    ? `Las ${fmtMiles(n)} marcas que coinciden con el filtro están seleccionadas`
    : `${plural(n, "marca seleccionada", "marcas seleccionadas")}`;
  // Estilo Gmail: con toda la página marcada se ofrece seleccionar todo lo que da el filtro.
  const btnFiltro = document.getElementById("btn-sel-filtro");
  const ofrecer = !seleccion.todoElFiltro && actasPagina.length > 0 && enPagina === actasPagina.length && estado.total > n;
  btnFiltro.hidden = !ofrecer;
  if (ofrecer) btnFiltro.textContent = `Seleccionar las ${fmtMiles(estado.total)} marcas que coinciden con el filtro`;
}

function limpiarSeleccion() {
  seleccion.actas.clear();
  seleccion.todoElFiltro = false;
  pintarSeleccion();
}

async function seleccionarTodasElFiltro() {
  const btn = document.getElementById("btn-sel-filtro");
  btn.disabled = true;
  try {
    const p = filtrosActuales();
    ["sort", "order", "limit", "offset"].forEach(k => delete p[k]);
    const d = await api(`/api/marcas/actas?${qs(p)}`);
    seleccion.actas = new Set(d.actas);
    seleccion.todoElFiltro = true;
    if (d.truncado) mostrarAviso(`Son más de ${fmtMiles(d.total)} marcas: se seleccionaron solo las primeras ${fmtMiles(d.total)}.`, "aviso");
  } catch (e) {
    alert(`No se pudieron seleccionar todas las marcas: ${e.message}`);
  } finally {
    btn.disabled = false;
    pintarSeleccion();
  }
}

function engancharSeleccion() {
  document.getElementById("tbody").addEventListener("change", ev => {
    const cb = ev.target;
    if (cb.classList.contains("sel-fila")) {
      cb.checked ? seleccion.actas.add(cb.dataset.acta) : seleccion.actas.delete(cb.dataset.acta);
    } else if (cb.classList.contains("sel-grupo")) {
      (gruposPagina[cb.dataset.grupo] || []).forEach(a => cb.checked ? seleccion.actas.add(a) : seleccion.actas.delete(a));
    } else {
      return;
    }
    seleccion.todoElFiltro = false; // ya es una selección a mano
    pintarSeleccion();
  });
  document.getElementById("sel-todo").addEventListener("change", ev => {
    actasPagina.forEach(a => ev.target.checked ? seleccion.actas.add(a) : seleccion.actas.delete(a));
    seleccion.todoElFiltro = false;
    pintarSeleccion();
  });
  document.addEventListener("click", ev => {
    if (!ev.target.closest(".menu-sel")) document.querySelectorAll(".menu-sel.abierto").forEach(m => m.classList.remove("abierto"));
  });
  document.getElementById("m-asignar").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-u]");
    if (b) accionAsignar(b.dataset.u);
  });
}

async function toggleMenuSel(ev, id) {
  ev.stopPropagation();
  const menu = document.getElementById(id).closest(".menu-sel");
  const abrir = !menu.classList.contains("abierto");
  document.querySelectorAll(".menu-sel.abierto").forEach(m => m.classList.remove("abierto"));
  menu.classList.toggle("abierto", abrir);
  if (abrir && id === "m-asignar" && !usuariosAsignar) {
    try {
      usuariosAsignar = await api("/api/masivo/opciones");
      const attr = t => String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      document.getElementById("m-asignar").innerHTML =
        `<button type="button" data-u="">Sin asignar</button>` +
        usuariosAsignar.usuarios.map(u =>
          `<button type="button" data-u="${attr(u)}">${_escapeHtml(u)}${u === usuariosAsignar.usuario ? " (yo)" : ""}</button>`).join("");
    } catch (e) {
      document.getElementById("m-asignar").innerHTML = `<button type="button" disabled>No se pudo cargar (${_escapeHtml(e.message)})</button>`;
    }
  }
}

function barraOcupada(ocupada) {
  document.querySelectorAll("#barra-sel .btn-sel").forEach(b => { b.disabled = ocupada; });
}

// Manda la selección a una acción masiva del servidor, avisa el resultado y recarga la tabla.
async function ejecutarMasivo(ruta, cuerpo, textoResultado) {
  if (!seleccion.actas.size) return;
  document.querySelectorAll(".menu-sel.abierto").forEach(m => m.classList.remove("abierto"));
  barraOcupada(true);
  try {
    const r = await apiJson(ruta, "POST", { actas: [...seleccion.actas], ...cuerpo });
    const aviso = textoResultado(r);
    limpiarSeleccion();
    await cargar(estado.offset);
    mostrarAviso(aviso.texto ?? aviso, aviso.tipo || "ok");
  } catch (e) {
    alert(`No se pudo aplicar la acción: ${e.message}`);
  } finally {
    barraOcupada(false);
  }
}

function accionContactado(valor) {
  ejecutarMasivo("/api/masivo/contactado", { contactado: valor }, r =>
    `${plural(r.marcas, "marca marcada", "marcas marcadas")} como ${valor ? "contactadas" : "sin contactar"}` +
    (r.titulares_crm ? ` · ${plural(r.titulares_crm, "titular cambió", "titulares cambiaron")} de etapa en el CRM` : ""));
}

function accionAsignar(usuario) {
  ejecutarMasivo("/api/masivo/asignar", { asignado: usuario }, r =>
    usuario
      ? `${plural(r.titulares, "titular asignado", "titulares asignados")} a ${usuario}`
      : `${plural(r.titulares, "titular quedó", "titulares quedaron")} sin asignar`);
}

function accionAtendida(valor) {
  ejecutarMasivo("/api/marcas/oposicion-atendida", { atendida: valor }, r => {
    if (!r.marcas) return { texto: "Ninguna de las marcas seleccionadas tiene oposición o vista.", tipo: "aviso" };
    return `${plural(r.marcas, "marca con oposición/vista", "marcas con oposición/vista")} ${valor ? "marcadas como atendidas" : "ya no figuran como atendidas"}`;
  });
}

function accionGestor() {
  const n = seleccion.actas.size;
  if (!n) return;
  let fondo = document.getElementById("modal-gestor-masivo");
  if (!fondo) {
    fondo = document.createElement("div");
    fondo.id = "modal-gestor-masivo";
    fondo.className = "modal-fondo";
    fondo.addEventListener("click", ev => { if (ev.target === fondo) fondo.classList.remove("abierto"); });
    document.addEventListener("keydown", ev => { if (ev.key === "Escape") fondo.classList.remove("abierto"); });
    document.body.appendChild(fondo);
  }
  fondo.innerHTML = `
    <div class="modal-caja modal-acceso modal-gestor-masivo" role="dialog" aria-modal="true" aria-label="Marcar tiene gestor o apoderado">
      <button type="button" class="modal-cerrar" aria-label="Cerrar">&times;</button>
      <h3 class="titulo-coment">Marcar «tiene gestor/apoderado»</h3>
      <p style="margin:0;font-size:13.5px;line-height:1.5;">Vas a marcar a los titulares de <strong>${plural(n, "marca", "marcas")}</strong> como que ya tienen gestor o apoderado.
        Dejan de ser leads y salen de esta lista. Se puede deshacer desde la ficha de cada titular.</p>
      <label class="campo">Nombre del gestor (opcional)
        <input type="text" id="gestor-nombre" maxlength="200" autocomplete="off" />
      </label>
      <div class="acciones-modal">
        <button type="button" id="gestor-cancelar">Cancelar</button>
        <button type="button" class="principal" id="gestor-confirmar">Marcar</button>
      </div>
    </div>`;
  fondo.classList.add("abierto");
  const cerrar = () => fondo.classList.remove("abierto");
  fondo.querySelector(".modal-cerrar").addEventListener("click", cerrar);
  fondo.querySelector("#gestor-cancelar").addEventListener("click", cerrar);
  fondo.querySelector("#gestor-confirmar").addEventListener("click", () => {
    const nombre = fondo.querySelector("#gestor-nombre").value;
    cerrar();
    ejecutarMasivo("/api/masivo/con-gestor", { nombre }, r => {
      const base = `${plural(r.titulares, "titular marcado", "titulares marcados")} con gestor/apoderado`;
      return r.saltados
        ? { texto: `${base} · ${plural(r.saltados, "se salteó", "se saltearon")} (sin marcas lead para marcar)`, tipo: "aviso" }
        : base;
    });
  });
  setTimeout(() => fondo.querySelector("#gestor-nombre").focus(), 30);
}

async function accionExportar() {
  const n = seleccion.actas.size;
  if (!n) return;
  const btn = document.getElementById("btn-sel-exportar");
  btn.disabled = true;
  try {
    const r = await fetch("/api/masivo/exportar", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ actas: [...seleccion.actas] }),
    });
    if (r.status === 401 && typeof irAlLogin === "function") irAlLogin();
    if (!r.ok) throw new Error(`${r.status}`);
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url;
    a.download = `marcas-seleccionadas-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    mostrarAviso(`CSV descargado con ${plural(n, "marca", "marcas")}`);
  } catch (e) {
    alert(`No se pudo exportar: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
}

function toggleGrupo(idGrupo, boton) {
  const abierto = boton.classList.toggle("abierta");
  boton.textContent = abierto ? "▾" : "▸";
  document.querySelectorAll(`tr[data-grupo="${idGrupo}"]`).forEach(tr => {
    tr.classList.toggle("fila-oculta", !abierto);
  });
}

async function cargar(offset) {
  estado.offset = offset;
  // Si cambiaron los filtros, la selección ya no corresponde a lo que se ve.
  // (Cambiar de página u orden la conserva: se puede ir juntando marcas.)
  const firma = firmaFiltros();
  if (firma !== seleccion.firma) {
    seleccion.firma = firma;
    seleccion.actas.clear();
    seleccion.todoElFiltro = false;
  }
  document.getElementById("tbody").innerHTML = '<tr><td colspan="10" class="vacio">Cargando...</td></tr>';
  const params = filtrosActuales();
  actualizarURL();
  marcarFiltrosActivos();
  const data = await api(`/api/marcas?${qs(params)}`);
  estado.total = data.total;
  // Después de una acción masiva la página puede quedar vacía (p. ej. al marcar
  // como contactadas con el filtro "Sin contactar"): se vuelve a la última que tenga filas.
  if (data.rows.length === 0 && data.total > 0 && offset > 0) {
    return cargar(Math.floor((data.total - 1) / LIMIT) * LIMIT);
  }

  document.querySelectorAll("th[data-col]").forEach(th => {
    th.classList.toggle("activo", th.dataset.col === estado.sort);
  });

  const tbody = document.getElementById("tbody");
  gruposPagina = {};
  if (data.rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" class="vacio">No hay resultados con estos filtros.</td></tr>';
  } else {
    tbody.innerHTML = agruparPorTitular(data.rows).map((grupo, i) => {
      const idGrupo = `g${estado.offset}_${i}`;
      gruposPagina[idGrupo] = grupo.map(r => r.acta);
      const [principal, ...resto] = grupo;
      const filaPrincipal = filaHtml(principal, {
        flecha: resto.length > 0,
        idGrupo,
        cantidadResto: resto.length,
      });
      const filasResto = resto.map(r => filaHtml(r, { oculta: true, idGrupo })).join("");
      return filaPrincipal + filasResto;
    }).join("");
  }

  actasPagina = data.rows.map(r => r.acta);
  pintarSeleccion();
  cargarContadoresComentarios(data.rows.map(r => r.acta));
  crmPintarEtapas();

  const desde = data.total === 0 ? 0 : estado.offset + 1;
  const hasta = Math.min(estado.offset + LIMIT, data.total);
  document.getElementById("resumen").textContent = `${data.total} resultados`;
  document.getElementById("pag-info").textContent = `${desde}–${hasta} de ${data.total}`;
}

(async function init() {
  await cargarFiltrosIniciales();
  engancharFiltrosAutomaticos();
  engancharSeleccion();
  const vinoDeLink = filtrosDesdeURL();
  if (!vinoDeLink) {
    document.getElementById("f-lead").value = "true";
    document.getElementById("f-contactado").value = "false";
    actualizarEtiquetaRangoFecha();
  }
  await cargar(estado.offset);
})();
</script>
