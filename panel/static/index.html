<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel de leads — Kom Marcas Inpi</title>
<link rel="stylesheet" href="/static/comun.css" />
</head>
<body>

<header>
  <h1>Panel de leads — INPI</h1>
  <span class="sub">Marcas autopresentadas, listas para prospección</span>
  <a class="ayuda" href="/crons" style="margin-left:auto;">⏱ Automatizaciones</a>
  <a class="ayuda" href="/ayuda" style="margin-left:16px;">? Ayuda</a>
</header>

<div class="filtros">
  <label>Boletín
    <select id="f-boletin"><option value="">Todos</option></select>
  </label>
  <label>Clase
    <select id="f-clase"><option value="">Todas</option></select>
  </label>
  <label>Lead
    <select id="f-lead">
      <option value="">Todos</option>
      <option value="true" selected>Solo leads</option>
      <option value="false">Con agente</option>
    </select>
  </label>
  <label>Contactado
    <select id="f-contactado">
      <option value="">Todos</option>
      <option value="false" selected>Sin contactar</option>
      <option value="true">Ya contactados</option>
    </select>
  </label>
  <label>Oposición
    <select id="f-oposicion">
      <option value="" selected>Todos</option>
      <option value="true">Con oposición/vista</option>
      <option value="false">Sin oposición</option>
    </select>
  </label>
  <label>Buscar
    <input type="text" id="f-q" placeholder="titular o marca..." />
  </label>
  <button onclick="cargar(0)">Filtrar</button>
  <button class="secundario" onclick="limpiarFiltros()">Limpiar</button>
</div>

<div class="resumen" id="resumen">Cargando...</div>

<div class="contenedor-tabla">
<table>
  <thead>
    <tr>
      <th data-col="lead_score" onclick="ordenarPor('lead_score')">Score</th>
      <th data-col="clase" onclick="ordenarPor('clase')">Clase</th>
      <th>Marca</th>
      <th data-col="titular" onclick="ordenarPor('titular')">Titular</th>
      <th>Lead</th>
      <th>Email</th>
      <th data-col="fecha_publicacion" onclick="ordenarPor('fecha_publicacion')" title="Fecha de publicación en el boletín (o de presentación, si todavía no se verificó)">Fecha Boletín</th>
      <th data-col="fecha_concesion" onclick="ordenarPor('fecha_concesion')" title="Fecha en que INPI concedió la marca">Fecha Concedida</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="9" class="vacio">Cargando...</td></tr>
  </tbody>
</table>
</div>

<div class="paginado">
  <button onclick="pagina(-1)">&larr; Anterior</button>
  <span id="pag-info"></span>
  <button onclick="pagina(1)">Siguiente &rarr;</button>
</div>

<script src="/static/comun.js"></script>
<script>
const LIMIT = 100;
let estado = { offset: 0, total: 0, sort: "lead_score", order: "desc" };
window.alRecargar = () => cargar(estado.offset);

function qs(params) {
  return Object.entries(params)
    .filter(([, v]) => v !== "" && v !== null && v !== undefined)
    .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
    .join("&");
}

async function cargarFiltrosIniciales() {
  const boletines = await api("/api/boletines");
  const selB = document.getElementById("f-boletin");
  boletines.forEach(b => {
    const opt = document.createElement("option");
    opt.value = b.numero;
    opt.textContent = `${b.numero} (${b.total_marcas ?? "?"})`;
    selB.appendChild(opt);
  });

  const clases = await api("/api/clases");
  const selC = document.getElementById("f-clase");
  clases.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    selC.appendChild(opt);
  });
}

function filtrosActuales() {
  return {
    boletin: document.getElementById("f-boletin").value,
    clase: document.getElementById("f-clase").value,
    es_lead: document.getElementById("f-lead").value,
    contactado: document.getElementById("f-contactado").value,
    tuvo_oposicion: document.getElementById("f-oposicion").value,
    q: document.getElementById("f-q").value,
    sort: estado.sort,
    order: estado.order,
    limit: LIMIT,
    offset: estado.offset,
  };
}

function limpiarFiltros() {
  document.getElementById("f-boletin").value = "";
  document.getElementById("f-clase").value = "";
  document.getElementById("f-lead").value = "true";
  document.getElementById("f-contactado").value = "false";
  document.getElementById("f-oposicion").value = "";
  document.getElementById("f-q").value = "";
  cargar(0);
}

function ordenarPor(col) {
  if (estado.sort === col) {
    estado.order = estado.order === "desc" ? "asc" : "desc";
  } else {
    estado.sort = col;
    estado.order = "desc";
  }
  cargar(estado.offset);
}

function pagina(delta) {
  const nuevo = estado.offset + delta * LIMIT;
  if (nuevo < 0 || nuevo >= estado.total) return;
  cargar(nuevo);
}

function agruparPorTitular(rows) {
  // Junta filas del mismo titular en un solo grupo, conservando el orden
  // en que ya vinieron (por lead_score desc). La clave es el CUIT cuando
  // ya se pudo leer del expediente; si no, el nombre normalizado (ver
  // claveTitular en comun.js).
  const grupos = new Map();
  for (const r of rows) {
    const clave = claveTitular(r) || `__acta_${r.acta}`; // sin nada: no agrupa
    if (!grupos.has(clave)) grupos.set(clave, []);
    grupos.get(clave).push(r);
  }
  return [...grupos.values()];
}

function filaHtml(r, { flecha = false, oculta = false, idGrupo = null, cantidadResto = 0 } = {}) {
  const claseOculta = oculta ? "fila-oculta" : "";
  const atributoGrupo = idGrupo ? `data-grupo="${idGrupo}"` : "";
  const tituLink = linkTitular(r);
  const celdaTitular = flecha
    ? `<button class="flecha-grupo" onclick="toggleGrupo('${idGrupo}', this)" title="Ver ${cantidadResto} marca(s) más de este titular">▸</button> ${tituLink} <span class="cant-grupo">(+${cantidadResto})</span>`
    : tituLink;
  const clave = claveTitular(r);
  const hrefTitular = clave ? `/titular/${encodeURIComponent(clave)}` : "javascript:void(0)";
  return `
    <tr class="${r.es_lead ? "lead" : ""} ${r.contactado ? "contactado" : ""} ${claseOculta}" ${atributoGrupo}>
      <td class="score">${r.lead_score ?? ""}</td>
      <td>${r.clase ?? ""}</td>
      <td class="denominacion" title="${r.denominacion_inpi || r.denominacion || ""}">${r.denominacion_inpi || r.denominacion || "<em>(mixta/fig.)</em>"}</td>
      <td class="titular" title="${r.titular || ""}">${celdaTitular}</td>
      <td>${badgeLead(r)} ${badgeOposicion(r)} ${badgeEstadoTramite(r)}</td>
      <td class="celda-email">${celdaEmailIcono(r)}</td>
      <td>${fechaPublicacionOFallback(r)}</td>
      <td>${fmtFecha(r.fecha_concesion) || "—"}</td>
      <td><a class="abrir" href="${hrefTitular}" target="_blank" title="Ver ficha completa del titular (boletín ${r.boletin}, acta ${r.acta})">Abrir</a></td>
    </tr>
  `;
}

function toggleGrupo(idGrupo, boton) {
  const abierto = boton.classList.toggle("abierta");
  boton.textContent = abierto ? "▾" : "▸";
  document.querySelectorAll(`tr[data-grupo="${idGrupo}"]`).forEach(tr => {
    tr.classList.toggle("fila-oculta", !abierto);
  });
}

async function cargar(offset) {
  estado.offset = offset;
  document.getElementById("tbody").innerHTML = '<tr><td colspan="9" class="vacio">Cargando...</td></tr>';
  const params = filtrosActuales();
  const data = await api(`/api/marcas?${qs(params)}`);
  estado.total = data.total;

  document.querySelectorAll("th[data-col]").forEach(th => {
    th.classList.toggle("activo", th.dataset.col === estado.sort);
  });

  const tbody = document.getElementById("tbody");
  if (data.rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="vacio">No hay resultados con estos filtros.</td></tr>';
  } else {
    tbody.innerHTML = agruparPorTitular(data.rows).map((grupo, i) => {
      const idGrupo = `g${estado.offset}_${i}`;
      const [principal, ...resto] = grupo;
      const filaPrincipal = filaHtml(principal, {
        flecha: resto.length > 0,
        idGrupo,
        cantidadResto: resto.length,
      });
      const filasResto = resto.map(r => filaHtml(r, { oculta: true, idGrupo })).join("");
      return filaPrincipal + filasResto;
    }).join("");
  }

  const desde = data.total === 0 ? 0 : estado.offset + 1;
  const hasta = Math.min(estado.offset + LIMIT, data.total);
  document.getElementById("resumen").textContent = `${data.total} resultados`;
  document.getElementById("pag-info").textContent = `${desde}–${hasta} de ${data.total}`;
}

(async function init() {
  await cargarFiltrosIniciales();
  document.getElementById("f-lead").value = "true";
  document.getElementById("f-contactado").value = "false";
  await cargar(0);
})();
</script>

</body>
</html>
