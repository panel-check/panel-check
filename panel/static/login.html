<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Ingresar — Panel de leads</title>
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<link rel="stylesheet" href="/static/comun.css?v=logo1" />
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: radial-gradient(1200px 600px at 50% -10%, #e8f1fa 0%, var(--fondo) 60%); }
  .login { width: 100%; max-width: 380px; }
  .login-marca { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 22px; }
  .login-marca .logo { width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
                       background: linear-gradient(135deg, var(--azul), var(--azul-oscuro)); color: #fff; font-weight: 700; font-size: 18px; }
  .login-marca span { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .login-caja { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 26px 24px 22px;
                box-shadow: 0 12px 40px rgba(15, 23, 42, 0.06); }
  .login-caja h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .login-caja p.sub { margin: 0 0 20px; color: var(--gris); font-size: 13.5px; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: #374151; }
  .campo input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--borde-control); border-radius: 8px;
                 font: inherit; font-size: 14px; background: #fff; color: var(--texto); }
  .campo input:focus { outline: none; border-color: var(--azul); box-shadow: var(--foco); }
  .clave-wrap { position: relative; }
  .clave-wrap input { padding-right: 64px; }
  .ver-clave { position: absolute; right: 6px; top: 6px; height: 28px; padding: 0 8px; border: 0; background: none;
               color: var(--azul); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; }
  .ver-clave:hover { background: var(--azul-claro); }
  .recordar { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #374151; margin: 4px 0 18px; cursor: pointer; }
  .recordar input { margin-top: 2px; accent-color: var(--azul); }
  .recordar small { display: block; color: var(--gris); font-size: 12px; margin-top: 2px; }
  .btn-entrar { width: 100%; height: 42px; border: 0; border-radius: 8px; background: var(--azul); color: #fff;
                font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .btn-entrar:hover { background: var(--azul-oscuro); }
  .btn-entrar:focus-visible { outline: none; box-shadow: var(--foco); }
  .btn-entrar[disabled] { opacity: .7; cursor: wait; }
  .error { display: none; margin-bottom: 14px; padding: 9px 12px; border-radius: 8px; background: #fdecea; color: #8a1f14;
           font-size: 13px; border: 1px solid #f5c6c0; }
  .error.visible { display: block; }
  .pie { text-align: center; color: var(--gris); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main class="login">
  <div class="login-marca"><span class="logo">®</span><span>Panel de leads</span></div>
  <form class="login-caja" id="form" autocomplete="on" novalidate>
    <h1>Ingresar</h1>
    <p class="sub">Usá tu usuario personal del panel.</p>
    <div class="error" id="error" role="alert"></div>
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
    </div>
    <div class="campo">
      <label for="clave">Clave</label>
      <div class="clave-wrap">
        <input id="clave" name="password" type="password" autocomplete="current-password" required />
        <button type="button" class="ver-clave" id="ver-clave" aria-label="Mostrar clave">Ver</button>
      </div>
    </div>
    <label class="recordar">
      <input type="checkbox" id="recordar" />
      <span>Mantener la sesión iniciada<small>30 días en este dispositivo. No lo tildes en una compu compartida.</small></span>
    </label>
    <button class="btn-entrar" id="entrar" type="submit">Ingresar</button>
  </form>
  <p class="pie">¿Te olvidaste la clave? Pedile a un administrador que te la resetee.</p>
</main>
<script>
  const params = new URLSearchParams(location.search);
  function destino() {
    const n = params.get("next") || "/";
    return n.startsWith("/") && !n.startsWith("//") && !n.includes("\\") ? n : "/";
  }
  const err = document.getElementById("error");
  function mostrarError(t) { err.textContent = t; err.classList.add("visible"); }

  document.getElementById("ver-clave").addEventListener("click", (e) => {
    const c = document.getElementById("clave");
    const ver = c.type === "password";
    c.type = ver ? "text" : "password";
    e.target.textContent = ver ? "Ocultar" : "Ver";
    e.target.setAttribute("aria-label", ver ? "Ocultar clave" : "Mostrar clave");
  });

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("visible");
    const usuario = document.getElementById("usuario").value.trim();
    const clave = document.getElementById("clave").value;
    if (!usuario || !clave) return mostrarError("Completá usuario y clave.");
    const btn = document.getElementById("entrar");
    btn.disabled = true; btn.textContent = "Ingresando…";
    try {
      const r = await fetch("/api/login", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario, clave, recordar: document.getElementById("recordar").checked }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        mostrarError(d.detail || "No se pudo ingresar.");
        document.getElementById("clave").value = "";
        document.getElementById("clave").focus();
        return;
      }
      location.href = d.debe_cambiar_clave ? "/cuenta?cambiar=1" : destino();
    } catch (_) {
      mostrarError("No hay conexión con el panel. Probá de nuevo.");
    } finally {
      btn.disabled = false; btn.textContent = "Ingresar";
    }
  });
</script>
</body>
</html>
