  <nav class="nav">
    <a href="/" title="Leads"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h12"/></svg><span class="nav-txt">Leads</span></a>
    <a href="/seguimientos" class="activa" aria-current="page" title="Seguimientos"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M7 11l2 2 4-4M7 17h10"/></svg><span class="nav-txt">Seguimientos</span></a>
    <a href="/clientes" title="Clientes"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15 4.6a3.5 3.5 0 0 1 0 6.8"/></svg><span class="nav-txt">Clientes</span></a>
    <a href="/calendario" title="Calendario"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="nav-txt">Calendario</span></a>
    <div class="nav-grupo">
      <button type="button" class="nav-boton" aria-haspopup="true" aria-expanded="false" title="Más"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><span class="nav-txt">Más</span><svg class="nav-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="nav-sub nav-sub-der" role="menu">
        <div class="nav-sub-grupo">
          <button type="button" class="nav-sub-boton" aria-haspopup="true" aria-expanded="false" title="Automatizaciones"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-sub-txt">Automatizaciones</span><svg class="nav-chev nav-chev-lado" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
          <div class="nav-sub-2" role="menu">
            <a href="/boletines" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M19 8h1a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2"/><path d="M8 8h7M8 12h7M8 16h4"/></svg><span class="nav-sub-txt">Boletines</span></a>
            <a href="/crons" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-sub-txt">Crons</span></a>
          </div>
        </div>
        <a href="/consultas-web" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span class="nav-sub-txt">Consultas web</span></a>
        <a href="/informes" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span class="nav-sub-txt">Informes</span></a>
        <a href="/mails" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="nav-sub-txt">Mails</span></a>
        <a href="/ayuda#seguimientos" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg><span class="nav-sub-txt">Ayuda</span></a>
      </div>
    </div>
    <button type="button" class="nav-boton nav-coment" id="link-comentarios" title="Chat" aria-label="Chat" aria-expanded="false"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-badge"></span></button>
  </nav>
</header>

<main class="sg">
  <section class="sg-top">
    <div class="sg-resumen" id="resumen"></div>
    <div class="sg-acciones">
      <input type="search" id="buscar" placeholder="Buscar marca, cliente o acta…" aria-label="Buscar" />
      <div class="sg-estado" role="tablist" aria-label="Qué trabajos ver">
        <button type="button" data-estado="activo" class="activa">Activos</button>
        <button type="button" data-estado="cerrado">Cerrados</button>
        <button type="button" data-estado="todos">Todos</button>
      </div>
      <a class="sg-btn sg-btn-suave" id="link-procesos" href="#" target="_blank" rel="noopener" title="Procesos y plantillas de mails en Notion">📋 Procesos</a>
      <button type="button" class="sg-btn" id="btn-nuevo">＋ Nuevo trabajo</button>
    </div>
  </section>
  <section class="sg-tablero" id="tablero" aria-live="polite"><p class="sg-cargando">Cargando…</p></section>
</main>

<div class="sg-velo" id="velo" hidden></div>
<aside class="sg-ficha" id="ficha" aria-hidden="true" aria-label="Ficha del trabajo"></aside>

<dialog class="sg-modal" id="modal-nuevo">
  <form method="dialog" id="form-nuevo">
    <h2>Nuevo trabajo</h2>
    <label>Cliente
      <input type="text" id="n-cliente" list="n-clientes" placeholder="Escribí el nombre, CUIT o una marca del cliente" autocomplete="off" required />
      <datalist id="n-clientes"></datalist>
      <small class="sg-ayuda-campo" id="n-cliente-ayuda">Tiene que ser un cliente de Clientes. Si no existe, crealo primero ahí.</small>
    </label>
    <label>Marca <input type="text" id="n-marca" required placeholder="Ej.: TIMBEROS" /></label>
    <label>Servicio <select id="n-servicio" required></select></label>
    <div class="sg-fila2">
      <label>Contratación <input type="date" id="n-contratacion" /></label>
      <label id="n-notif-label">Notificación <input type="date" id="n-notificacion" /></label>
    </div>
    <label>Acta (si ya se presentó) <input type="text" id="n-acta" inputmode="numeric" placeholder="Opcional" /></label>
    <label>Carpeta de Drive <input type="url" id="n-drive" placeholder="https://drive.google.com/…" /></label>
    <label>Notas <textarea id="n-notas" rows="2"></textarea></label>
    <p class="sg-error" id="n-error" hidden></p>
    <div class="sg-modal-botones">
      <button type="button" class="sg-btn sg-btn-suave" id="n-cancelar">Cancelar</button>
      <button type="submit" class="sg-btn" id="n-guardar">Crear trabajo</button>
    </div>
  </form>
</dialog>

<script src="/static/comun.js?v=nc1"></script>
<script src="/static/seguimientos.js?v=sg18"></script>
</body>
</html>
