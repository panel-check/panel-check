<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boletines — Kom Marcas Inpi</title>
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<link rel="stylesheet" href="/static/comun.css?v=logo2" />
<style>
  .contenido { max-width: 1040px; margin: 24px auto 60px; padding: 0 20px; }
  .aviso-boletines {
    margin-bottom: 16px;
    padding: 8px 12px;
    background: #eef0f2;
    border-radius: 6px;
    font-size: 12px;
    color: var(--gris);
  }
  table.tabla-boletines { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  table.tabla-boletines th, table.tabla-boletines td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--borde); white-space: normal; }
  table.tabla-boletines th { background: #fafbfc; color: var(--gris); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  table.tabla-boletines tr:last-child td { border-bottom: none; }
  a.link-boletin { color: var(--azul); text-decoration: none; font-weight: 600; }
  a.link-boletin:hover { text-decoration: underline; }
  .estado-badge-b { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .estado-badge-b.importado { background: #e6f4ea; color: var(--verde); }
  .estado-badge-b.no-importado { background: #eef0f2; color: var(--gris); }
  .estado-badge-b.plazo-abierto { background: #fff4e0; color: #b26a00; }
  .estado-badge-b.plazo-cerrado { background: #eef0f2; color: var(--gris); }
  .ultima-busqueda { font-size: 11px; color: var(--gris); margin-top: 3px; }
  td.num, th.num { text-align: right !important; }
  .estado-badge-b.error { background: #fde8e8; color: var(--rojo); }
  button.importar-boletin, button.buscar-opo {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--azul);
    background: white;
    color: var(--azul);
    font-size: 12px;
    cursor: pointer;
  }
  button.importar-boletin:hover, button.buscar-opo:hover { background: var(--azul-claro); }
  button.importar-boletin:disabled, button.buscar-opo:disabled { border-color: var(--borde); color: var(--gris); cursor: default; background: #fafbfc; }
</style>
<script src="/static/sesion.js" defer></script>
<script src="/static/menu.js?v=tel2" defer></script>
</head>
<body>

<header class="app-header">
  <a class="marca" href="/" title="Volver al panel de leads"><img class="marca-img" src="/static/logo-smarties-header.png" alt="Smarties Consultora" width="90" height="40" /><span class="marca-nombre">Panel de leads</span></a>
  <span class="marca-sep">/</span>
  <h1>Boletines</h1>
  <nav class="nav">
    <a href="/" title="Leads"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h12"/></svg><span class="nav-txt">Leads</span></a>
    <a href="/crm" title="CRM"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span class="nav-txt">CRM</span></a>
    <a href="/clientes" title="Clientes"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15 4.6a3.5 3.5 0 0 1 0 6.8"/></svg><span class="nav-txt">Clientes</span></a>
    <a href="/calendario" title="Calendario"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="nav-txt">Calendario</span></a>
    <a href="/tareas" title="Tareas (Kan)"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></svg><span class="nav-txt">Tareas</span></a>
    <div class="nav-grupo">
      <button type="button" class="nav-boton activa" aria-haspopup="true" aria-expanded="false" title="Más"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><span class="nav-txt">Más</span><svg class="nav-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="nav-sub nav-sub-der" role="menu">
        <div class="nav-sub-grupo activa">
          <button type="button" class="nav-sub-boton" aria-haspopup="true" aria-expanded="false" title="Automatizaciones"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-sub-txt">Automatizaciones</span><svg class="nav-chev nav-chev-lado" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
          <div class="nav-sub-2" role="menu">
            <a href="/boletines" role="menuitem" class="activa" aria-current="page"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M19 8h1a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2"/><path d="M8 8h7M8 12h7M8 16h4"/></svg><span class="nav-sub-txt">Boletines</span></a>
            <a href="/crons" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-sub-txt">Crons</span></a>
          </div>
        </div>
        <a href="/mails" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="nav-sub-txt">Mails</span></a>
        <a href="/ayuda" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg><span class="nav-sub-txt">Ayuda</span></a>
      </div>
    </div>
    <button type="button" class="nav-boton nav-coment" id="link-comentarios" title="Chat" aria-label="Chat" aria-expanded="false"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-badge"></span></button>
  </nav>
</header>

<div class="contenido" id="contenido">
  <p style="color:var(--gris);font-size:13px;">Cargando...</p>
</div>

<script src="/static/comun.js?v=sec1"></script>
<script>
function formatFecha(f) {
  if (!f) return "—";
  // fecha de INPI viene DD/MM/AAAA; fecha de nuestra base viene ISO.
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(f)) return f;
  return (f.split("T")[0] || f);
}

function filaBoletin(b) {
  const badge = b.importado
    ? '<span class="estado-badge-b importado">✓ Importado</span>'
    : (b.estado === "error"
        ? '<span class="estado-badge-b error">✗ Error</span>'
        : '<span class="estado-badge-b no-importado">No importado</span>');
  const link = b.importado
    ? `<a class="link-boletin" href="/?boletin=${encodeURIComponent(b.numero)}">${_escapeHtml(b.numero)}</a>`
    : `<strong>${_escapeHtml(b.numero)}</strong>`;
  const total = b.total_marcas != null ? b.total_marcas : "—";
  const d = b.dias_plazo_oposicion;
  let plazo = "—";
  if (b.importado && d != null) {
    plazo = d <= 0
      ? '<span class="estado-badge-b plazo-cerrado" title="Pasaron 30 días desde la publicación: ya no recibe oposiciones">🔒 Plazo cerrado</span>'
      : `<span class="estado-badge-b plazo-abierto" title="Todavía puede recibir oposiciones">Abierto · ${d} ${d === 1 ? "día" : "días"}</span>`;
  }
  const leads = b.importado && b.leads != null ? b.leads : "—";
  const conAgente = b.importado && b.con_agente != null ? b.con_agente : "—";
  let ultima = "";
  if (b.oposiciones_buscadas_en) {
    const f = new Date(b.oposiciones_buscadas_en);
    if (!isNaN(f)) {
      const txt = f.toLocaleString("es-AR", { timeZone: "America/Argentina/Buenos_Aires", day: "2-digit", month: "2-digit", year: "numeric" });
      ultima = `<div class="ultima-busqueda" title="Última vez que se buscó con el botón">Última búsqueda: ${txt}</div>`;
    }
  }
  const accion = b.importado
    ? `<button type="button" class="buscar-opo" data-numero="${_escapeHtml(b.numero)}" title="Revisa en INPI si los leads de este boletín tienen oposición (también sirve si ya venció el plazo de 30 días)">Buscar oposiciones</button>${ultima}`
    : `<button type="button" class="importar-boletin" data-numero="${_escapeHtml(b.numero)}">Importar</button>`;
  return `
    <tr>
      <td>${link}</td>
      <td>${formatFecha(b.fecha)}</td>
      <td>${badge}</td>
      <td class="num">${total}</td>
      <td class="num">${leads}</td>
      <td class="num">${conAgente}</td>
      <td>${plazo}</td>
      <td>${accion}</td>
    </tr>
  `;
}

async function cargar() {
  const contenido = document.getElementById("contenido");
  try {
    const data = await api("/api/boletines/completo");
    const aviso = data.aviso ? `<div class="aviso-boletines">${_escapeHtml(data.aviso)}</div>` : "";
    contenido.innerHTML = `
      ${aviso}
      <table class="tabla-boletines">
        <thead>
          <tr><th>Número</th><th>Fecha</th><th>Estado</th><th class="num">Marcas</th><th class="num" title="Sin agente ni apoderado">Leads</th><th class="num">Con agente</th><th>Plazo de oposición</th><th></th></tr>
        </thead>
        <tbody>${data.boletines.map(filaBoletin).join("")}</tbody>
      </table>
    `;
    contenido.querySelectorAll(".importar-boletin").forEach((b) => {
      b.addEventListener("click", () => importar(b));
    });
    contenido.querySelectorAll(".buscar-opo").forEach((b) => {
      b.addEventListener("click", () => buscarOposiciones(b));
    });
  } catch (e) {
    contenido.innerHTML = `<p style="color:var(--rojo);">No se pudo cargar (${e.message}).</p>`;
  }
}

async function buscarOposiciones(boton) {
  const numero = boton.dataset.numero;
  if (!confirm(`¿Buscar oposiciones en los leads del boletín ${numero}? Tarda unos 12 segundos por lead; los avisos por mail salen a las 07:30.`)) return;
  boton.disabled = true;
  boton.textContent = "Disparando…";
  try {
    await api(`/api/boletines/${encodeURIComponent(numero)}/buscar-oposiciones`, { method: "POST" });
    boton.textContent = "Disparado ✓";
    boton.insertAdjacentHTML("afterend", ' <a class="ayuda" href="/crons" style="font-size:12px;">ver progreso ↗</a>');
  } catch (e) {
    boton.disabled = false;
    boton.textContent = "Buscar oposiciones";
    alert(`No se pudo disparar: ${e.message}`);
  }
}

async function importar(boton) {
  const numero = boton.dataset.numero;
  boton.disabled = true;
  boton.textContent = "Disparando…";
  try {
    await api(`/api/boletines/${encodeURIComponent(numero)}/importar`, { method: "POST" });
    boton.textContent = "Disparado ✓";
    // El pipeline tarda varios minutos en terminar (Apify + parseo + carga) —
    // no tiene sentido refrescar en unos segundos como en /crons, así que
    // dejamos el botón en "Disparado" y sugerimos revisar Automatizaciones.
    boton.insertAdjacentHTML("afterend", ' <a class="ayuda" href="/crons" style="font-size:12px;">ver progreso ↗</a>');
  } catch (e) {
    boton.disabled = false;
    boton.textContent = "Importar";
    alert(`No se pudo disparar: ${e.message}`);
  }
}

cargar();
</script>

</body>
</html>
