<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Detalle de titular — Kom Marcas Inpi</title>
<link rel="stylesheet" href="/static/comun.css" />
<script src="/static/sesion.js" defer></script>
</head>
<body>

<header class="app-header">
  <a class="marca" href="/" title="Volver al panel de leads"><span class="marca-logo">®</span><span class="marca-nombre">Panel de leads</span></a>
  <span class="marca-sep">/</span>
  <h1 id="titulo-titular">Cargando...</h1>
  <nav class="nav">
    <a href="/" title="Leads"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h12"/></svg><span class="nav-txt">Leads</span></a>
    <a href="/crm" title="CRM"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span class="nav-txt">CRM</span></a>
    <a href="/clientes" title="Clientes"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15 4.6a3.5 3.5 0 0 1 0 6.8"/></svg><span class="nav-txt">Clientes</span></a>
    <a href="/comentarios" id="link-comentarios" title="Comentarios"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-txt">Comentarios</span><span class="nav-badge"></span></a>
    <a href="/boletines" title="Boletines"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M19 8h1a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2"/><path d="M8 8h7M8 12h7M8 16h4"/></svg><span class="nav-txt">Boletines</span></a>
    <a href="/crons" title="Automatizaciones"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-txt">Automatizaciones</span></a>
    <a href="/ayuda" title="Ayuda"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg><span class="nav-txt">Ayuda</span></a>
  </nav>
</header>

<div class="ficha-titular" id="ficha-titular"></div>

<div class="crm-box" id="crm-box" hidden>
  <div class="crm-box-titulo">📋 Seguimiento comercial (CRM)</div>
  <div id="crm-ficha"></div>
</div>

<div class="contenedor-tabla">
<table>
  <thead>
    <tr>
      <th>Score</th>
      <th>Boletín</th>
      <th>Acta</th>
      <th>Clase</th>
      <th>Tipo</th>
      <th>Marca</th>
      <th>Lead</th>
      <th>Email</th>
      <th>Fecha Boletín</th>
      <th>Fecha Concedida</th>
      <th>Estado</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="12" class="vacio">Cargando...</td></tr>
  </tbody>
</table>
</div>

<script src="/static/comun.js"></script>
<script src="/static/crm.js"></script>
<script>
// "Marcar contactado" también mueve la etapa del CRM: se recargan tabla y ficha.
window.alRecargar = () => cargar({ conCRM: true });
window.alCambiarComentarios = actualizarContadorComentarios;

function claveDesdeUrl() {
  // /titular/<clave> — la clave puede ser un CUIT o un nombre normalizado,
  // ya viene codificada en la URL.
  const partes = window.location.pathname.split("/").filter(Boolean);
  return decodeURIComponent(partes[partes.length - 1] || "");
}

function filaHtml(r) {
  return `
    <tr class="${r.es_lead ? "lead" : ""} ${r.contactado ? "contactado" : ""}">
      <td class="score">${r.lead_score ?? ""}</td>
      <td>${badgeBoletin(r)}</td>
      <td><a class="link-acta" href="javascript:void(0)" onclick="abrirActa('${r.acta}')">${r.acta}</a></td>
      <td>${r.clase ?? ""}</td>
      <td>${tipoLegible(r.tipo)}</td>
      <td class="denominacion" title="${r.denominacion_inpi || r.denominacion || ""}">${r.denominacion_inpi || r.denominacion || `<em>${sinNombre(r.tipo)}</em>`}</td>
      <td>${badgeLead(r)} ${badgeOposicion(r)}</td>
      <td>${celdaEmail(r)}</td>
      <td>${fechaPublicacionOFallback(r)}</td>
      <td>${fmtFecha(r.fecha_concesion) || "—"}</td>
      <td>${badgeEstadoTramite(r, true)}</td>
      <td class="celda-acciones">${botonComentarios(r.acta)} <button class="contactar ${r.contactado ? "marcado" : ""}" onclick="marcarContactado('${r.acta}', ${!!r.contactado})">
        ${r.contactado ? "✓ Contactado" : "Marcar"}
      </button></td>
    </tr>
  `;
}

async function cargar({ conCRM = true } = {}) {
  const clave = claveDesdeUrl();
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = '<tr><td colspan="12" class="vacio">Cargando...</td></tr>';
  try {
    const data = await api(`/api/titular/${encodeURIComponent(clave)}`);
    document.getElementById("titulo-titular").textContent = data.titular || clave;

    const contactadas = data.rows.filter(r => r.contactado).length;
    document.getElementById("ficha-titular").innerHTML = `
      <span class="dato">CUIT: <strong>${data.cuit || "no identificado todavía"}</strong></span>
      <span class="dato">Marcas: <strong>${data.rows.length}</strong></span>
      <span class="dato">Contactadas: <strong>${contactadas} / ${data.rows.length}</strong></span>
    `;

    tbody.innerHTML = data.rows.length
      ? data.rows.map(filaHtml).join("")
      : '<tr><td colspan="12" class="vacio">Sin marcas para este titular.</td></tr>';
    cargarContadoresComentarios(data.rows.map(r => r.acta));

    // Bloque del CRM: la ficha del lead (etapa, asignado, gestiones, plazos).
    // Si el titular todavía no tiene una clave estable (sin CUIT ni nombre
    // usable), no se puede seguir en el CRM.
    const box = document.getElementById("crm-box");
    if (conCRM) {
      box.hidden = false;
      const cont = document.getElementById("crm-ficha");
      if (data.clave_crm) {
        crmRenderFicha(cont, data.clave_crm, { enModal: false, alCambiar: () => cargar({ conCRM: false }) });
      } else {
        cont.innerHTML = '<p class="crm-gris">Este titular todavía no tiene CUIT ni un nombre identificable, así que no se puede seguir en el CRM desde esta ficha. Cada una de sus marcas aparece por separado en el <a href="/crm">CRM</a>.</p>';
      }
    }
  } catch (e) {
    document.getElementById("titulo-titular").textContent = "No encontrado";
    tbody.innerHTML = `<tr><td colspan="12" class="vacio">No se pudo cargar (${e.message}).</td></tr>`;
  }
}

cargar();
</script>

</body>
</html>
