<style>
  .contenido { max-width: 900px; margin: 24px auto 60px; padding: 0 20px; }

  /* Franja de estado general */
  .franja-estado {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-radius: 10px; margin-bottom: 26px;
    font-size: 14px; font-weight: 600;
  }
  .franja-estado .icono { font-size: 20px; }
  .franja-estado .detalle { font-weight: 400; font-size: 13px; }
  .franja-estado a { color: inherit; }
  .franja-estado.ok { background: #e6f4ea; color: var(--verde); }
  .franja-estado.atencion { background: #fff3cd; color: #7a5d06; }
  .franja-estado.error { background: #fde8e8; color: var(--rojo); }

  /* Grupos */
  .grupo { margin-bottom: 28px; }
  .grupo > h2, .grupo > summary {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--gris); margin: 0 0 2px; font-weight: 700;
  }
  .grupo > summary { cursor: pointer; list-style: none; }
  .grupo > summary::-webkit-details-marker { display: none; }
  .grupo > summary::before { content: "▸ "; }
  .grupo[open] > summary::before { content: "▾ "; }
  .grupo .subtitulo { font-size: 12px; color: var(--gris); margin: 0 0 12px; }

  /* Tarjetas */
  .tarjeta-cron {
    background: white; border: 1px solid var(--borde); border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05); padding: 16px 20px; margin-bottom: 12px;
  }
  .tarjeta-cron.con-error { border-color: #f1b5b0; }
  .tarjeta-cron.con-atencion { border-color: #f0d98a; }
  .cabecera-tarjeta { display: flex; align-items: center; gap: 10px; }
  .cabecera-tarjeta h3 { font-size: 15px; margin: 0; color: #1f2430; }
  .cabecera-tarjeta .estado-badge { margin-left: auto; }
  .tarjeta-cron .descripcion { font-size: 13px; color: var(--gris); margin: 4px 0 12px; line-height: 1.45; }

  .metricas { display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 12px; }
  .metrica .valor { font-size: 22px; font-weight: 700; color: #1f2430; line-height: 1.1; }
  .metrica.secundaria .valor { font-size: 15px; font-weight: 600; color: #3b4150; }
  .metrica .etiqueta { font-size: 12px; color: var(--gris); }

  .pie-tarjeta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    font-size: 12px; color: var(--gris); border-top: 1px solid #f0f2f5; padding-top: 10px;
  }
  .pie-tarjeta .acciones { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  .subprocesos { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 4px; }
  .subprocesos td { padding: 7px 6px; border-top: 1px solid #f0f2f5; vertical-align: middle; }
  .subprocesos td.num { font-weight: 700; font-size: 15px; color: #1f2430; text-align: right; width: 60px; }
  .subprocesos td.acciones { text-align: right; white-space: nowrap; }
  .subprocesos .chico { font-size: 11px; color: var(--gris); }

  .estado-badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .estado-badge.success { background: #e6f4ea; color: var(--verde); }
  .estado-badge.failure { background: #fde8e8; color: var(--rojo); }
  .estado-badge.atencion { background: #fff3cd; color: #7a5d06; }
  .estado-badge.desconocido { background: #eef0f2; color: var(--gris); }
  .estado-badge.en-curso { background: #e8f1fa; color: var(--azul); }

  .error-cron, .aviso-cron {
    margin-top: 10px; padding: 8px 12px; border-radius: 6px; font-size: 12px; line-height: 1.5; white-space: pre-wrap;
  }
  .error-cron { background: #fde8e8; color: var(--rojo); }
  .aviso-cron { background: #eef0f2; color: var(--gris); }

  a.ver-run { font-size: 12px; color: var(--gris); text-decoration: none; }
  a.ver-run:hover { text-decoration: underline; color: var(--azul); }
  button.correr-ahora {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--azul);
    background: white; color: var(--azul); font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  button.correr-ahora:hover { background: var(--azul-claro); }
  button.correr-ahora:disabled { border-color: var(--borde); color: var(--gris); cursor: default; background: #fafbfc; }

  /* Botón "+" de reporte */
  button.btn-reporte {
    width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--borde);
    background: #f4f6f9; color: var(--azul); font-size: 14px; font-weight: 700; line-height: 1;
    cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  }
  button.btn-reporte:hover { background: var(--azul-claro); border-color: var(--azul); }

  /* Ventana del reporte */
  .modal-fondo {
    position: fixed; inset: 0; background: rgba(20, 24, 33, .45); z-index: 50;
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto;
  }
  .modal {
    background: white; border-radius: 12px; width: 100%; max-width: 860px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2); padding: 20px 22px 24px;
  }
  .modal-cabecera { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .modal-cabecera h2 { font-size: 17px; margin: 0; color: #1f2430; }
  .modal-cabecera .cerrar { margin-left: auto; border: none; background: none; font-size: 22px; cursor: pointer; color: var(--gris); }
  .modal .ayuda-modal { font-size: 12px; color: var(--gris); margin: 0 0 14px; }
  .selector-periodo { display: inline-flex; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
  .selector-periodo button { border: none; background: white; padding: 5px 12px; font-size: 12px; cursor: pointer; color: #3b4150; }
  .selector-periodo button.activo { background: var(--azul); color: white; }
  .bloque-reporte { margin-top: 18px; }
  .bloque-reporte h3 { font-size: 14px; margin: 0 0 4px; color: #1f2430; display: flex; align-items: center; gap: 10px; }
  .bloque-reporte h3 .descargar { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--azul); cursor: pointer; background: none; border: none; }
  .resumen-reporte { font-size: 13px; color: #3b4150; margin: 0 0 8px; }
  .resumen-reporte strong { font-size: 15px; }
  .tabla-scroll { overflow-x: auto; }
  table.reporte { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.reporte th { text-align: right; font-weight: 600; color: var(--gris); font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  table.reporte th:first-child, table.reporte td:first-child { text-align: left; }
  table.reporte td { text-align: right; padding: 5px 8px; border-bottom: 1px solid #f0f2f5; white-space: nowrap; }
  table.reporte td.principal { font-weight: 700; color: #1f2430; }
  table.reporte td .barra { display: inline-block; height: 8px; background: #bcd4ec; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  table.reporte tr.cero td { color: #b0b6c0; }
  table.reporte tr.estimado td { font-style: italic; }
  table.reporte tr.total td { font-weight: 700; border-top: 2px solid var(--borde); border-bottom: none; color: #1f2430; }
  .nota-estimado { font-size: 11px; color: var(--gris); margin-top: 6px; }

  @media (max-width: 600px) {
    .pie-tarjeta .acciones { margin-left: 0; }
    .subprocesos td.horario { display: none; }
    .subprocesos td.acciones .ver-run { display: none; }
    .subprocesos td { padding: 7px 3px; }
    .subprocesos td.num { width: 40px; }
    .subprocesos button.correr-ahora { padding: 4px 7px; }
    .subprocesos .txt-correr { display: none; }
    .modal-fondo { padding: 12px 8px; }
    .modal { padding: 16px 14px 20px; }
    .modal-cabecera { flex-wrap: wrap; }
    .modal-cabecera h2 { flex: 1; font-size: 16px; }
    .selector-periodo { order: 3; width: 100%; }
    .selector-periodo button { flex: 1; }
  }
</style>

<script>
// ---- Formato de fechas en lenguaje simple ------------------------------
function haceCuanto(iso) {
  if (!iso) return "nunca";
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return "recién";
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? "ayer" : `hace ${d} días`;
}

function cuando(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const hoy = new Date();
  const manana = new Date(); manana.setDate(hoy.getDate() + 1);
  const hora = d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === hoy.toDateString()) return `hoy ${hora}`;
  if (d.toDateString() === manana.toDateString()) return `mañana ${hora}`;
  return d.toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" }) + ` ${hora}`;
}

// ---- Estado de un proceso / de una tarjeta ------------------------------
// "error" = la última corrida falló. "atencion" = cancelada o sin datos
// de GitHub. "corriendo" = en curso. "ok" = todo bien.
function estadoProceso(p) {
  if (p.estado === "in_progress" || p.estado === "queued") return "corriendo";
  if (p.conclusion === "failure") return "error";
  if (p.conclusion === "success") return "ok";
  if (p.conclusion === "cancelled" || p.conclusion === "timed_out") return "atencion";
  if (p.aviso) return "atencion";
  return "ok";
}

function estadoTarjeta(t) {
  const estados = t.procesos.map(estadoProceso);
  if (estados.includes("error")) return "error";
  if (estados.includes("atencion")) return "atencion";
  if (estados.includes("corriendo")) return "corriendo";
  return "ok";
}

function badge(estado, p) {
  if (estado === "corriendo") return '<span class="estado-badge en-curso">⟳ corriendo ahora</span>';
  if (estado === "error") return '<span class="estado-badge failure">✗ falló</span>';
  if (estado === "atencion") {
    const txt = p && p.conclusion === "cancelled" ? "cancelada"
      : p && p.conclusion === "timed_out" ? "se pasó de tiempo" : "revisar";
    return `<span class="estado-badge atencion">⚠ ${txt}</span>`;
  }
  return '<span class="estado-badge success">✓ OK</span>';
}

// ---- Piezas de la tarjeta ------------------------------------------------
function valorMetrica(v) {
  if (v === null || v === undefined) return "—";
  if (typeof v === "object" && v.error) return `<span title="${v.error}">?</span>`;
  return typeof v === "number" ? v.toLocaleString("es-AR") : v;
}

function botonCorrer(p) {
  const corriendo = estadoProceso(p) === "corriendo";
  return `<button class="correr-ahora" data-workflow="${p.workflow_file}" ${corriendo ? "disabled" : ""}>
    ${corriendo ? "Corriendo…" : '▶<span class="txt-correr"> Correr ahora</span>'}</button>`;
}

function linkDetalle(p) {
  return p.url ? `<a class="ver-run" href="${p.url}" target="_blank" title="Ver la última corrida en GitHub">detalle ↗</a>` : "";
}

function mensajes(p) {
  let html = "";
  if (p.error) html += `<div class="error-cron">${p.etiqueta ? p.etiqueta + ": " : ""}${p.error}</div>`;
  if (p.aviso) html += `<div class="aviso-cron">${p.etiqueta ? p.etiqueta + ": " : ""}${p.aviso}</div>`;
  return html;
}

function tarjeta(t, idx) {
  const est = estadoTarjeta(t);
  const clase = est === "error" ? "con-error" : est === "atencion" ? "con-atencion" : "";
  const metricas = t.metricas.length ? `<div class="metricas">${t.metricas.map((m) => `
      <div class="metrica ${m.destacada ? "" : "secundaria"}">
        <div class="valor">${valorMetrica(m.valor)}</div>
        <div class="etiqueta">${m.etiqueta}</div>
      </div>`).join("")}</div>` : "";

  let cuerpo;
  if (t.procesos.length === 1) {
    const p = t.procesos[0];
    cuerpo = `
      <div class="pie-tarjeta">
        <span>🕒 ${t.horario}</span>
        <span>Última: <strong>${haceCuanto(p.fecha)}</strong></span>
        <span>Próxima: ${cuando(p.proxima_ejecucion)}</span>
        <span class="acciones">${linkDetalle(p)} ${botonCorrer(p)}</span>
      </div>${mensajes(p)}`;
  } else {
    // Varios procesos en una tarjeta: una fila por proceso, cada uno con
    // su propio botón (nunca se disparan juntos).
    cuerpo = `
      <table class="subprocesos"><tbody>${t.procesos.map((p) => `
        <tr>
          <td class="num">${valorMetrica(p.pendientes)}</td>
          <td><strong>${p.etiqueta}</strong><br><span class="chico">pendientes</span></td>
          <td class="horario chico">${p.horario || ""}<br>última ${haceCuanto(p.fecha)}</td>
          <td>${badge(estadoProceso(p), p)}</td>
          <td class="acciones">${linkDetalle(p)} ${botonCorrer(p)}</td>
        </tr>`).join("")}
      </tbody></table>${t.procesos.map(mensajes).join("")}`;
  }

  const pUnico = t.procesos.length === 1 ? t.procesos[0] : null;
  const conReporte = t.procesos.some((p) => p.tiene_reporte);
  const botonReporte = conReporte
    ? `<button class="btn-reporte" data-tarjeta="${idx}" title="Ver qué hizo, día por día">+</button>` : "";
  return `
    <div class="tarjeta-cron ${clase}" id="tarjeta-${idx}">
      <div class="cabecera-tarjeta">
        <h3>${t.nombre}</h3>${botonReporte}
        ${badge(est, pUnico)}
      </div>
      <p class="descripcion">${t.descripcion}</p>
      ${metricas}
      ${cuerpo}
    </div>`;
}

// ---- Página ---------------------------------------------------------------
// Recordamos si el usuario abrió/cerró a mano un grupo plegable, para que el
// refresco automático (cada 20 s) no se lo vuelva a cerrar.
const gruposAbiertosAMano = {};
let ultimasTarjetas = [];

function franja(problemas, corriendo) {
  if (!problemas.length) {
    const extra = corriendo.length ? ` <span class="detalle">· Corriendo ahora: ${corriendo.join(", ")}</span>` : "";
    return `<div class="franja-estado ok"><span class="icono">✓</span> Todo funcionando${extra}</div>`;
  }
  const hayError = problemas.some((x) => x.estado === "error");
  const links = problemas.map((x) => `<a href="#${x.id}">${x.nombre}</a>`).join(", ");
  const texto = problemas.length === 1 ? "1 proceso necesita atención" : `${problemas.length} procesos necesitan atención`;
  return `<div class="franja-estado ${hayError ? "error" : "atencion"}">
      <span class="icono">${hayError ? "✗" : "⚠"}</span> ${texto}
      <span class="detalle">— ${links}</span></div>`;
}

async function cargar() {
  const contenido = document.getElementById("contenido");
  try {
    const grupos = await api("/api/crons");
    let idx = 0;
    const problemas = [];
    const corriendo = [];
    const html = grupos.map((g) => {
      let grupoConProblema = false;
      const tarjetas = g.tarjetas.map((t) => {
        const id = `tarjeta-${idx}`;
        const est = estadoTarjeta(t);
        if (est === "error" || est === "atencion") {
          problemas.push({ id, nombre: t.nombre, estado: est });
          grupoConProblema = true;
        }
        if (est === "corriendo") corriendo.push(t.nombre);
        return tarjeta(t, idx++);
      }).join("");

      const encabezado = `<p class="subtitulo">${g.subtitulo}</p>${tarjetas}`;
      if (!g.plegado) {
        return `<section class="grupo"><h2>${g.titulo}</h2>${encabezado}</section>`;
      }
      const abierto = g.id in gruposAbiertosAMano ? gruposAbiertosAMano[g.id] : grupoConProblema;
      return `<details class="grupo" data-grupo="${g.id}" ${abierto ? "open" : ""}>
          <summary>${g.titulo}${grupoConProblema ? " ⚠" : ""}</summary>${encabezado}</details>`;
    }).join("");

    ultimasTarjetas = grupos.flatMap((g) => g.tarjetas);
    contenido.innerHTML = franja(problemas, corriendo) + html;
    contenido.querySelectorAll(".btn-reporte").forEach((b) => {
      b.addEventListener("click", () => abrirReporte(ultimasTarjetas[Number(b.dataset.tarjeta)]));
    });
    contenido.querySelectorAll("details.grupo").forEach((d) => {
      d.querySelector("summary").addEventListener("click", () => {
        gruposAbiertosAMano[d.dataset.grupo] = !d.open;
      });
    });
    contenido.querySelectorAll(".franja-estado a").forEach((a) => {
      a.addEventListener("click", () => {
        const t = document.querySelector(a.getAttribute("href"));
        const d = t && t.closest("details");
        if (d) { d.open = true; gruposAbiertosAMano[d.dataset.grupo] = true; }
      });
    });
    contenido.querySelectorAll(".correr-ahora").forEach((b) => {
      b.addEventListener("click", () => correrAhora(b));
    });
  } catch (e) {
    contenido.innerHTML = `<p style="color:var(--rojo);">No se pudo cargar (${e.message}).</p>`;
  }
}

async function correrAhora(boton) {
  const workflow = boton.dataset.workflow;
  boton.disabled = true;
  boton.textContent = "Disparando…";
  try {
    await api(`/api/crons/correr?workflow_file=${encodeURIComponent(workflow)}`, { method: "POST" });
    boton.textContent = "Disparado ✓";
    // GitHub tarda unos segundos en pasar la corrida a "en curso".
    setTimeout(cargar, 4000);
  } catch (e) {
    boton.disabled = false;
    boton.innerHTML = '▶<span class="txt-correr"> Correr ahora</span>';
    alert(`No se pudo disparar: ${e.message}`);
  }
}

// ---- Reporte por día (botón "+") ---------------------------------------
const reporteEstado = { tarjeta: null, dias: 30, datos: {} };

function diaLegible(iso) {
  const d = new Date(iso + "T12:00:00");
  const hoy = new Date();
  const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
  if (d.toDateString() === hoy.toDateString()) return "Hoy";
  if (d.toDateString() === ayer.toDateString()) return "Ayer";
  return d.toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
}

function num(v) {
  if (v === null || v === undefined || v === "") return "—";
  return typeof v === "number" ? v.toLocaleString("es-AR") : v;
}

function frasePeriodo(dias) {
  return dias === 7 ? "la última semana" : `los últimos ${dias} días`;
}

function tablaReporte(p, r) {
  const cols = r.columnas;
  const principal = cols.find((c) => c.modo === "suma");
  const maximo = Math.max(1, ...r.dias.map((d) => Number(d.valores[principal?.clave]) || 0));
  const hayEstimados = r.dias.some((d) => d.estimado);

  const filas = r.dias.map((d) => {
    const vacio = !Object.keys(d.valores).length;
    const celdas = cols.map((c, i) => {
      const v = d.valores[c.clave];
      if (c === principal) {
        const ancho = Math.round(((Number(v) || 0) / maximo) * 60);
        return `<td class="principal"><span class="barra" style="width:${ancho}px"></span>${vacio ? 0 : num(v ?? 0)}</td>`;
      }
      // En días estimados, una columna que no se puede reconstruir desde la
      // base va como "—" (no se sabe), no como 0 (no pasó nada).
      if (d.estimado && v === undefined) return "<td>—</td>";
      return `<td>${vacio ? (c.modo === "suma" ? 0 : "—") : num(v ?? (c.modo === "suma" ? 0 : null))}</td>`;
    }).join("");
    const corridas = d.estimado ? "≈" : (d.corridas ?? 0);
    const cls = [vacio ? "cero" : "", d.estimado ? "estimado" : ""].join(" ");
    return `<tr class="${cls}"><td>${diaLegible(d.dia)}</td>${celdas}<td>${corridas}</td></tr>`;
  }).join("");

  const totales = cols.map((c) => {
    const v = r.totales[c.clave];
    if (c.modo === "lista") return `<td>${num(v)} boletín${v === 1 ? "" : "es"}</td>`;
    if (c.modo === "ultimo") return `<td>${num(v)} <span style="font-weight:400;color:var(--gris)">(hoy)</span></td>`;
    return `<td>${num(v)}</td>`;
  }).join("");

  const resumen = principal
    ? `<p class="resumen-reporte">En ${frasePeriodo(reporteEstado.dias)}: <strong>${num(r.totales[principal.clave])}</strong> ${principal.etiqueta.toLowerCase()}${
        cols.filter((c) => c.modo === "suma" && c !== principal).slice(0, 2)
          .map((c) => ` · ${num(r.totales[c.clave])} ${c.etiqueta.toLowerCase()}`).join("")}</p>`
    : "";

  return `
    <div class="bloque-reporte">
      <h3>${p.etiqueta || ""}
        <button class="descargar" data-workflow="${p.workflow_file}">⬇ Descargar (Excel/CSV)</button></h3>
      ${resumen}
      <div class="tabla-scroll"><table class="reporte">
        <thead><tr><th>Día</th>${cols.map((c) => `<th>${c.etiqueta}</th>`).join("")}<th title="Cuántas veces corrió ese día">Corridas</th></tr></thead>
        <tbody>${filas || `<tr><td colspan="${cols.length + 2}" style="text-align:center;color:var(--gris)">Todavía no hay datos.</td></tr>`}</tbody>
        <tfoot><tr class="total"><td>Total</td>${totales}<td>${r.dias.reduce((a, d) => a + (d.corridas || 0), 0)}</td></tr></tfoot>
      </table></div>
      ${hayEstimados ? `<p class="nota-estimado">Los días en <em>cursiva</em> (≈) son anteriores al registro de corridas (arrancó el ${r.registro_desde ? diaLegible(r.registro_desde) : "hoy"}) y están reconstruidos desde los datos de la base: pueden no ser exactos.</p>` : ""}
    </div>`;
}

function descargarCsv(p, r) {
  const cols = r.columnas;
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lineas = [["Día", ...cols.map((c) => c.etiqueta), "Corridas", "Estimado"].map(esc).join(";")];
  r.dias.forEach((d) => {
    lineas.push([d.dia, ...cols.map((c) => d.valores[c.clave] ?? (c.modo === "suma" ? 0 : "")),
      d.estimado ? "" : (d.corridas ?? 0), d.estimado ? "sí" : ""].map(esc).join(";"));
  });
  const nombre = `${(reporteEstado.tarjeta.nombre + (p.etiqueta ? " - " + p.etiqueta : "")).replace(/[^\wáéíóúñ -]/gi, "")} - ${reporteEstado.dias} dias.csv`;
  const blob = new Blob(["\ufeff" + lineas.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function pintarReporte() {
  const t = reporteEstado.tarjeta;
  const cuerpo = document.getElementById("modal-cuerpo");
  document.querySelectorAll(".selector-periodo button").forEach((b) => {
    b.classList.toggle("activo", Number(b.dataset.dias) === reporteEstado.dias);
  });
  cuerpo.innerHTML = '<p style="color:var(--gris);font-size:13px;">Cargando…</p>';
  const procesos = t.procesos.filter((p) => p.tiene_reporte);
  try {
    const resultados = await Promise.all(procesos.map((p) =>
      api(`/api/crons/reporte?workflow_file=${encodeURIComponent(p.workflow_file)}&dias=${reporteEstado.dias}`)));
    reporteEstado.datos = {};
    procesos.forEach((p, i) => { reporteEstado.datos[p.workflow_file] = resultados[i]; });
    cuerpo.innerHTML = procesos.map((p, i) => tablaReporte(p, resultados[i])).join("");
    cuerpo.querySelectorAll(".descargar").forEach((b) => {
      const p = procesos.find((x) => x.workflow_file === b.dataset.workflow);
      b.addEventListener("click", () => descargarCsv(p, reporteEstado.datos[p.workflow_file]));
    });
  } catch (e) {
    cuerpo.innerHTML = `<p style="color:var(--rojo);">No se pudo cargar el reporte (${e.message}).</p>`;
  }
}

function abrirReporte(t) {
  reporteEstado.tarjeta = t;
  const fondo = document.createElement("div");
  fondo.className = "modal-fondo";
  fondo.innerHTML = `
    <div class="modal" role="dialog" aria-label="Reporte de ${t.nombre}">
      <div class="modal-cabecera">
        <h2>${t.nombre} — día por día</h2>
        <div class="selector-periodo">
          <button data-dias="7">7 días</button><button data-dias="30">30 días</button><button data-dias="90">90 días</button>
        </div>
        <button class="cerrar" title="Cerrar">×</button>
      </div>
      <p class="ayuda-modal">Qué hizo este proceso cada día (hora Argentina). Se puede descargar para abrir en Excel.</p>
      <div id="modal-cuerpo"></div>
    </div>`;
  document.body.appendChild(fondo);
  const cerrar = () => { fondo.remove(); document.removeEventListener("keydown", porEsc); };
  const porEsc = (e) => { if (e.key === "Escape") cerrar(); };
  document.addEventListener("keydown", porEsc);
  fondo.addEventListener("click", (e) => { if (e.target === fondo) cerrar(); });
  fondo.querySelector(".cerrar").addEventListener("click", cerrar);
  fondo.querySelectorAll(".selector-periodo button").forEach((b) => {
    b.addEventListener("click", () => { reporteEstado.dias = Number(b.dataset.dias); pintarReporte(); });
  });
  pintarReporte();
}

cargar();
setInterval(cargar, 20000);
</script>
