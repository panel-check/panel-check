<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendario — Kom Marcas Inpi</title>
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<link rel="stylesheet" href="/static/comun.css?v=logo2" />
<link rel="stylesheet" href="/static/calendario.css?v=9" />
<script src="/static/sesion.js" defer></script>
<script>
  // Dentro del panel lateral de 📞 (menu.js, pestaña «Disponibilidad»): sin barra de arriba, sin el estado de la
  // conexión ni los botones de vista, y con los links abriendo en la ventana principal.
  if (new URLSearchParams(location.search).get("embebido") === "1") {
    document.documentElement.classList.add("embebido");
    document.write('<base target="_top">');
  } else {
    document.write('<script src="/static/menu.js?v=tel2" defer><\/script>');
  }
</script>
<style>
  html.embebido .app-header, html.embebido #cal-estado, html.embebido #cal-aviso, html.embebido #cal-barra { display: none !important; }
  html.embebido .cal-pagina { padding: 10px 10px 24px; max-width: none; }
</style>
</head>
<body>

<header class="app-header">
  <a class="marca" href="/"><img class="marca-img" src="/static/logo-smarties-header.png" alt="Smarties Consultora" width="90" height="40" /><h1 class="marca-nombre">Panel de leads</h1></a>
  <nav class="nav">
    <a href="/" title="Leads"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h12"/></svg><span class="nav-txt">Leads</span></a>
    <a href="/crm" title="CRM"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span class="nav-txt">CRM</span></a>
    <a href="/clientes" title="Clientes"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15 4.6a3.5 3.5 0 0 1 0 6.8"/></svg><span class="nav-txt">Clientes</span></a>
    <a href="/calendario" class="activa" aria-current="page" title="Calendario"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="nav-txt">Calendario</span></a>
    <a href="/tareas" title="Tareas (Kan)"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></svg><span class="nav-txt">Tareas</span></a>
    <div class="nav-grupo">
      <button type="button" class="nav-boton" aria-haspopup="true" aria-expanded="false" title="Más"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><span class="nav-txt">Más</span><svg class="nav-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="nav-sub nav-sub-der" role="menu">
        <div class="nav-sub-grupo">
          <button type="button" class="nav-sub-boton" aria-haspopup="true" aria-expanded="false" title="Automatizaciones"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-sub-txt">Automatizaciones</span><svg class="nav-chev nav-chev-lado" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
          <div class="nav-sub-2" role="menu">
            <a href="/boletines" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M19 8h1a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2"/><path d="M8 8h7M8 12h7M8 16h4"/></svg><span class="nav-sub-txt">Boletines</span></a>
            <a href="/crons" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-sub-txt">Crons</span></a>
          </div>
        </div>
        <a href="/mails" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span class="nav-sub-txt">Mails</span></a>
        <a href="/ayuda" role="menuitem"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg><span class="nav-sub-txt">Ayuda</span></a>
      </div>
    </div>
    <button type="button" class="nav-boton nav-coment" id="link-comentarios" title="Chat" aria-label="Chat" aria-expanded="false"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-badge"></span></button>
  </nav>
</header>

<main class="cal-pagina">
  <div class="cal-estado" id="cal-estado"></div>
  <div id="cal-aviso"></div>

  <div class="cal-barra" id="cal-barra" hidden>
    <div class="cal-grupo">
      <button type="button" class="cal-btn" id="cal-ant" aria-label="Mes anterior" title="Mes anterior">‹</button>
      <button type="button" class="cal-btn" id="cal-hoy">Hoy</button>
      <button type="button" class="cal-btn" id="cal-sig" aria-label="Mes siguiente" title="Mes siguiente">›</button>
    </div>
    <h2 id="cal-titulo"></h2>
    <span class="cal-espacio"></span>
    <div class="cal-grupo" role="group" aria-label="Vista">
      <button type="button" class="cal-btn" id="cal-v-mes">Mes</button>
      <button type="button" class="cal-btn" id="cal-v-agenda">Agenda</button>
      <button type="button" class="cal-btn" id="cal-v-disp" title="Cargar los horarios en que está libre la agente y ver cuántas reuniones entran">Disponibilidad</button>
    </div>
    <button type="button" class="cal-btn" id="cal-sync" title="Pedirle a Google lo último ahora">↻ Sincronizar</button>
    <button type="button" class="cal-btn" id="cal-agenda-mail" title="Manda ahora el mail AGENDA con las reuniones y llamadas de mañana (el mismo que sale solo a las 20 hs)">✉ Agenda de mañana</button>
    <button type="button" class="cal-btn" id="cal-nuevo-seg" title="Un recordatorio para hacer un seguimiento: queda en el calendario (y en Google) en naranja">🔔 Recordatorio</button>
    <button type="button" class="cal-btn principal" id="cal-nuevo">＋ Nuevo evento</button>
  </div>

  <div id="cal-vista"></div>
  <div class="cal-leyenda" id="cal-leyenda" hidden>
    <span class="l-lead">Vinculado a un lead</span>
    <span class="l-cliente">Vinculado a un cliente</span>
    <span class="l-sin">Acta que no está en la base</span>
    <span class="l-seg">🔔 Recordatorio</span>
    <span>Sin acta</span>
  </div>
  <div class="cal-detalle" id="cal-detalle"></div>
</main>

<script src="/static/comun.js?v=sec1"></script>
<script src="/static/calendario_comun.js?v=8"></script>
<script src="/static/calendario.js?v=9"></script>
</body>
</html>
