<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clientes y vigilancia — Kom Marcas Inpi</title>
<link rel="stylesheet" href="/static/comun.css" />
</head>
<body>

<header class="app-header">
  <a class="marca" href="/" title="Volver al panel de leads"><span class="marca-logo">®</span><span class="marca-nombre">Panel de leads</span></a>
  <span class="marca-sep">/</span>
  <h1>Clientes y vigilancia</h1>
  <nav class="nav">
    <a href="/" title="Leads"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h12"/></svg><span class="nav-txt">Leads</span></a>
    <a href="/crm" title="CRM"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span class="nav-txt">CRM</span></a>
    <a href="/clientes" class="activa" aria-current="page" title="Clientes"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15 4.6a3.5 3.5 0 0 1 0 6.8"/></svg><span class="nav-txt">Clientes</span></a>
    <a href="/comentarios" id="link-comentarios" title="Comentarios"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-txt">Comentarios</span><span class="nav-badge"></span></a>
    <a href="/boletines" title="Boletines"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M19 8h1a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2"/><path d="M8 8h7M8 12h7M8 16h4"/></svg><span class="nav-txt">Boletines</span></a>
    <a href="/crons" title="Automatizaciones"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nav-txt">Automatizaciones</span></a>
    <a href="/ayuda#crm" title="Ayuda"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg><span class="nav-txt">Ayuda</span></a>
  </nav>
</header>

<div class="crm-pestanas" id="pestanas">
  <button type="button" data-vista="clientes" class="activa">👥 Clientes</button>
  <button type="button" data-vista="marcas">™ Marcas</button>
  <button type="button" data-vista="vigilancia">🔎 Vigilancia <span class="cl-badge" id="badge-vigilancia"></span></button>
  <button type="button" data-vista="vencimientos">📅 Vencimientos</button>
  <button type="button" data-vista="matricula">🏷 Por matrícula <span class="cl-badge" id="badge-matricula"></span></button>
  <button type="button" data-vista="ajustes">⚙ Ajustes</button>
</div>

<div class="crm-resumen" id="resumen"></div>

<div id="vista-clientes" class="crm-vista"></div>
<div id="vista-marcas" class="crm-vista" hidden></div>
<div id="vista-vigilancia" class="crm-vista" hidden></div>
<div id="vista-vencimientos" class="crm-vista" hidden></div>
<div id="vista-matricula" class="crm-vista" hidden></div>
<div id="vista-ajustes" class="crm-vista" hidden></div>

<div class="modal-fondo" id="modal-cliente">
  <div class="modal-caja modal-cliente" onclick="event.stopPropagation()">
    <button type="button" class="modal-cerrar" title="Cerrar">&times;</button>
    <div id="modal-cliente-contenido"></div>
  </div>
</div>

<script src="/static/comun.js"></script>
<script src="/static/crm.js"></script>
<script src="/static/clientes.js"></script>
</body>
</html>
