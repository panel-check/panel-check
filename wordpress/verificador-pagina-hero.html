<!--
  Parte de arriba de la página del verificador (título + bajada). No se pega sola: scripts/armar_pagina_verificador.py
  la une con verificador-buscador.html (la herramienta) y verificador-pagina-contenido.html (los textos) en
  wordpress/verificador-pagina-completa.html, que es el archivo que se pega en WordPress.
  El marcador HERRAMIENTA es donde el script mete la herramienta.
-->
<div id="smh" class="smh">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Outfit:wght@600;800;900&display=swap">
  <style>
    .smh, .smh * { box-sizing: border-box; }
    .smh { width: 100vw; max-width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
      padding: 150px 24px 64px; /* arriba deja lugar al menú del sitio, que flota sobre la página */
      background: linear-gradient(160deg, #161250 0%, #2a2580 100%); text-align: center; overflow: hidden; }
    body:has(#smh) { overflow-x: clip; }
    .smh .smh-caja { max-width: 820px; margin: 0 auto; }
    .smh .smh-h1 { margin: 0 0 16px; font: 900 clamp(30px, 5.4vw, 52px)/1.08 "Outfit", "Roboto", "Segoe UI", sans-serif; text-transform: uppercase; color: #fff; letter-spacing: 0; }
    .smh .smh-h1 em { font-style: normal; color: #5cffe1; }
    .smh .smh-intro { margin: 0 auto 30px; max-width: 640px; font: 400 18px/1.55 "Mulish", "Roboto", "Segoe UI", sans-serif; color: #dfe3ff; }
  </style>
  <div class="smh-caja">
    <h1 class="smh-h1">Consulta de marcas INPI: <em>verificá si tu nombre está disponible</em></h1>
    <p class="smh-intro">Escribí el nombre de tu marca y mirá qué marcas iguales o parecidas hay en INPI, en qué estado está cada una y si coinciden con tus clases. Es gratis y no te pedimos tus datos.</p>
    <!--HERRAMIENTA-->
  </div>
</div>
