<!--
  Presentación de oposición para las llamadas con clientes — página PRIVADA de smartiesconsultora.com.ar

  PARA QUÉ ES: en la llamada con un cliente que recibió una oposición, se abre esta página, se escribe el número de acta
  y el panel consulta el expediente en el INPI y arma la presentación con los datos reales de su marca: quién se opuso
  (y con qué marca), las fechas de publicación, cierre de oposiciones, notificación y vencimiento de los 3 meses, en qué
  etapa está hoy y, si ya está cargado en el panel, el Informe Oposición IA (chances, palancas y caminos). Se pasa slide
  por slide con las flechas del teclado y se comparte esa pestaña en el Meet. Sin acta muestra la versión general.
  NO es para mandarle al cliente: es solo para usarla en la llamada.

  CÓMO PONERLA (WordPress + Elementor):
    1. Páginas → Añadir nueva → un título que no se adivine (por ejemplo «Presentación P7K»; la dirección queda
       /presentacion-p7k/). No la agregues a ningún menú.
    2. Plantilla: «Elementor lienzo» (Ajustes de página → Diseño) si está; si no, «Elementor ancho completo».
       La presentación tapa igual el header y el footer del sitio.
    3. Editar con Elementor → widget «HTML» → pegar TODO este archivo. Publicar.
    4. En el SEO de la página: «no indexar». Si el plugin de caché lo permite, excluir la página de la caché.
    5. En Railway (servicio del panel) cargar la variable PRESENTACION_CLAVE con una clave larga. Es la que pide la
       página la primera vez (se puede recordar en esa computadora).

  QUÉ PIDE AL PANEL: POST https://panel.registrodemimarca.com.ar/api/publico/presentacion/consulta con {acta} y la
  clave en la cabecera X-Presentacion-Clave (ver panel/presentacion_api.py). Nunca muestra el fundamento de la
  oposición, el CUIT ni el mail del titular.

  Estilo: manual de marca (azul #161250, celeste #0095FF, turquesa #5CFFE1, gris #606060).
  Tipografías: Outfit y Mulish (gratis) en lugar de Azor Sans Black / Avenir Next (pagas).
-->
<div id="smp" class="smp">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=Outfit:wght@600;800;900&display=swap">
  <style>
    body:has(#smp) { overflow: hidden !important; }
    #smp, #smp * { box-sizing: border-box; }
    #smp {
      --azul: #161250; --celeste: #0095ff; --turq: #5cffe1; --gris: #606060; --fondo: #f4f6fb; --linea: #dce1ee;
      --suave: #55597a; --apagado: #a3a8c3;
      --tit: "Outfit", "Segoe UI", sans-serif; --txt: "Mulish", "Segoe UI", sans-serif;
      position: fixed; inset: 0; z-index: 2147483000; background: var(--fondo); color: var(--azul);
      font-family: var(--txt); font-size: 18px; line-height: 1.45; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased; text-align: left;
    }
    #smp h1, #smp h2, #smp h3, #smp p { margin: 0; padding: 0; color: inherit; letter-spacing: 0; text-transform: none; }
    #smp h1, #smp h2, #smp h3 { font-family: var(--tit); font-weight: 900; line-height: 1.08; }
    #smp button { font-family: var(--txt); cursor: pointer; border: 0; background: none; color: inherit; margin: 0;
      text-transform: none; letter-spacing: 0; box-shadow: none; line-height: 1.2; }
    #smp [hidden] { display: none !important; }
    #smp img { max-width: 100%; }

    /* barra de arriba */
    #smp .barra { background: var(--azul); color: #fff; display: flex; align-items: center; gap: 22px; padding: 12px clamp(18px, 3vw, 44px);
      position: relative; overflow: hidden; flex: none; }
    #smp .barra img.logo { height: 46px; width: auto; display: block; position: relative; z-index: 1; }
    #smp .barra .titulo { flex: 1; font-family: var(--tit); font-weight: 800; font-size: clamp(17px, 1.6vw, 24px); position: relative; z-index: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #smp .barra .titulo small { font-family: var(--txt); font-weight: 600; color: #c8cae6; font-size: .72em; margin-left: 10px; }
    #smp .barra .acciones { display: flex; gap: 8px; position: relative; z-index: 1; }
    #smp .barra .acciones button { background: #2a2670; color: #fff; padding: 9px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
    #smp .barra .acciones button:hover { background: #3a35a0; }
    #smp .trama { position: absolute; right: 0; top: 0; display: grid; grid-template-columns: repeat(10, 18px); grid-auto-rows: 18px; opacity: .45; pointer-events: none; }

    /* pantallas */
    #smp .pantalla { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #smp .centro { flex: 1; display: grid; place-items: center; padding: 24px; overflow: auto; }
    #smp .tarjeta { background: #fff; border-radius: 28px; padding: clamp(28px, 4vw, 48px); width: min(560px, 100%);
      box-shadow: 0 24px 60px -36px rgba(22, 18, 80, .45); }
    #smp .tarjeta h1 { font-size: clamp(30px, 3vw, 40px); margin-bottom: 8px; }
    #smp .tarjeta p.sub { color: var(--suave); margin-bottom: 26px; }
    #smp label.campo { display: block; font-weight: 800; font-size: 15px; margin-bottom: 18px; color: var(--azul); }
    #smp label.campo input[type=text], #smp label.campo input[type=password] { display: block; width: 100%; margin-top: 8px;
      font: 600 22px var(--txt); color: var(--azul); padding: 14px 16px; border: 2px solid var(--linea); border-radius: 14px; background: #fff; outline: none; }
    #smp label.campo input:focus { border-color: var(--celeste); }
    #smp label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--suave); margin: -8px 0 22px; font-weight: 600; }
    #smp .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 28px;
      border-radius: 999px; font-weight: 800; font-size: 18px; transition: transform .15s, background .15s; }
    #smp .btn:hover { transform: translateY(-1px); }
    #smp .btn.pri { background: var(--turq); color: var(--azul); width: 100%; }
    #smp .btn.sec { color: var(--celeste); font-size: 15px; min-height: 40px; padding: 0 6px; margin-top: 10px; }
    #smp .error { background: #ffeef0; color: #a3112e; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 15px; margin-bottom: 18px; }
    #smp .aviso { background: #fff7e0; color: #7a5600; border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
    #smp .cargando { text-align: center; }
    #smp .cargando h2 { font-size: clamp(26px, 2.6vw, 36px); margin: 22px 0 8px; }
    #smp .cargando p { color: var(--suave); }
    #smp .spin { width: 64px; height: 64px; border-radius: 50%; border: 6px solid var(--linea); border-top-color: var(--celeste);
      margin: 0 auto; animation: smp-giro 1s linear infinite; }
    @keyframes smp-giro { to { transform: rotate(360deg); } }

    /* slides */
    #smp .escenario { flex: 1; min-height: 0; padding: clamp(16px, 3vh, 34px) clamp(18px, 4vw, 72px) 0; display: flex; flex-direction: column; }
    #smp .slide { flex: 1; min-height: 0; background: #fff; border-radius: 28px; padding: clamp(24px, 3.4vw, 54px);
      box-shadow: 0 24px 60px -40px rgba(22, 18, 80, .45); display: flex; flex-direction: column; overflow: auto; position: relative; }
    #smp .slide.anim { animation: smp-entra .45s cubic-bezier(.3, .7, .2, 1); }
    @keyframes smp-entra { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    #smp .k { font-weight: 800; color: var(--celeste); letter-spacing: 2px; text-transform: uppercase; font-size: 14px; margin-bottom: 10px; }
    #smp .slide h2 { font-size: clamp(30px, 3.3vw, 52px); margin-bottom: 16px; }
    #smp .slide p.lead { font-size: clamp(18px, 1.55vw, 24px); color: var(--suave); max-width: 900px; }
    #smp .dos { flex: 1; display: grid; grid-template-columns: minmax(240px, .8fr) 1.4fr; gap: clamp(24px, 4vw, 60px); align-items: center; }
    #smp .grande { background: var(--azul); color: #fff; border-radius: 24px; min-height: clamp(220px, 36vh, 340px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px; }
    #smp .grande .n { font-family: var(--tit); font-weight: 900; font-size: clamp(84px, 9vw, 150px); line-height: .95; color: var(--turq); }
    #smp .grande .n.txt { font-size: clamp(40px, 4.2vw, 68px); line-height: 1.05; }
    #smp .grande .u { font-weight: 800; font-size: clamp(17px, 1.6vw, 24px); margin-top: 10px; }
    #smp .grande .f { color: #c8cae6; font-weight: 700; font-size: 15px; margin-top: 12px; }
    #smp .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    #smp .chip { background: #eaf6ff; color: var(--azul); font-weight: 800; padding: 11px 16px; border-radius: 14px; font-size: clamp(15px, 1.2vw, 18px);
      opacity: 0; transform: translateY(8px); animation: smp-in .45s forwards; }
    #smp .chip.t { background: var(--turq); }
    #smp .chip.b { background: #fff; border: 2px solid var(--celeste); }
    #smp .flecha { color: var(--celeste); font-weight: 900; font-size: 22px; opacity: 0; animation: smp-in .45s forwards; }
    @keyframes smp-in { to { opacity: 1; transform: none; } }
    #smp .fork { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    #smp .fork button { padding: 15px 24px; border-radius: 16px; font-weight: 800; font-size: clamp(15px, 1.3vw, 19px); border: 3px solid var(--azul); transition: transform .15s; }
    #smp .fork button:hover { transform: translateY(-2px); }
    #smp .fork .a { background: var(--turq); border-color: var(--turq); color: var(--azul); }
    #smp .fork .b { background: var(--azul); color: #fff; }
    #smp .fork button.sel { box-shadow: 0 0 0 5px rgba(0, 149, 255, .25); }
    #smp .salida { margin-top: 18px; padding: 16px 20px; border-radius: 16px; font-size: clamp(16px, 1.4vw, 21px); font-weight: 700;
      display: flex; align-items: center; gap: 14px; animation: smp-entra .35s; }
    #smp .salida.ok { background: #e3fff9; border-left: 8px solid #12c7a4; }
    #smp .salida.go { background: #eaf0ff; border-left: 8px solid var(--azul); }
    #smp .salida button { margin-left: auto; background: var(--azul); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 800; white-space: nowrap; font-size: 15px; }

    /* portada */
    #smp .portada { flex: 1; display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: center; }
    #smp .portada h1 { font-size: clamp(44px, 5.6vw, 92px); word-break: break-word; }
    #smp .portada .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    #smp .portada .meta span { background: var(--fondo); border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: clamp(14px, 1.15vw, 17px); }
    #smp .portada .estado { margin-top: 22px; color: var(--suave); font-size: clamp(16px, 1.3vw, 20px); }
    #smp .logomarca { background: var(--fondo); border-radius: 28px; min-height: clamp(220px, 40vh, 380px); display: grid; place-items: center; padding: 28px; }
    #smp .logomarca img { max-height: clamp(180px, 34vh, 320px); object-fit: contain; }
    #smp .logomarca .sinlogo { font-family: var(--tit); font-weight: 900; color: var(--azul); font-size: clamp(34px, 3.6vw, 60px); text-align: center; word-break: break-word; }

    /* línea de tiempo */
    #smp .track { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); margin: auto 0; padding: 40px 0; }
    #smp .rail { position: absolute; left: 8.33%; right: 8.33%; top: 34px; height: 8px; border-radius: 8px; background: var(--linea); }
    #smp .rail b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: linear-gradient(90deg, var(--celeste), var(--turq)); width: 0; transition: width .8s cubic-bezier(.6, .1, .2, 1); }
    #smp .etapa { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; position: relative; z-index: 1; padding: 0 4px; }
    #smp .etapa .dot { width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 4px solid var(--linea); display: grid; place-items: center;
      font-family: var(--tit); font-weight: 900; font-size: 30px; color: var(--apagado); transition: .35s; }
    #smp .etapa .lbl { font-family: var(--tit); font-weight: 900; font-size: clamp(15px, 1.4vw, 21px); color: var(--apagado); line-height: 1.15; }
    #smp .etapa .fe { font-weight: 800; font-size: clamp(13px, 1.05vw, 16px); color: var(--apagado); }
    #smp .etapa.hecha .dot { background: var(--celeste); border-color: var(--celeste); color: #fff; }
    #smp .etapa.hecha .lbl, #smp .etapa.hecha .fe { color: var(--azul); }
    #smp .etapa.hoy .dot { background: var(--azul); border-color: var(--azul); color: var(--turq); transform: scale(1.14); box-shadow: 0 0 0 10px rgba(0, 149, 255, .15); }
    #smp .etapa.hoy .lbl { color: var(--azul); }
    #smp .etapa.hoy .fe { color: var(--celeste); }
    #smp .etapa:hover .dot { transform: scale(1.08); }
    #smp .etapa.hoy:hover .dot { transform: scale(1.14); }
    #smp .etapa .badge { position: absolute; top: -32px; background: var(--turq); color: var(--azul); font-weight: 900; font-size: 13px; letter-spacing: 1px;
      text-transform: uppercase; padding: 3px 10px; border-radius: 999px; display: none; }
    #smp .etapa.hoy .badge { display: block; }
    #smp .hoytxt { background: var(--fondo); border-radius: 18px; padding: 18px 22px; font-size: clamp(16px, 1.4vw, 21px); font-weight: 700; }
    #smp .hoytxt b { color: var(--celeste); }

    /* oposiciones */
    #smp .opos { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 12px; }
    #smp .opo { border: 2px solid var(--linea); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    #smp .opo h3 { font-size: clamp(22px, 2vw, 30px); }
    #smp .opo .dato { color: var(--suave); font-weight: 700; font-size: 16px; }
    #smp .opo .dato b { color: var(--azul); }
    #smp .opo .marcaop { display: flex; align-items: center; gap: 16px; background: var(--fondo); border-radius: 16px; padding: 14px; }
    #smp .opo .marcaop .im { width: 84px; height: 84px; border-radius: 12px; background: #fff; display: grid; place-items: center; flex: none; overflow: hidden; }
    #smp .opo .marcaop .im img { max-width: 76px; max-height: 76px; object-fit: contain; }
    #smp .opo .marcaop .im span { font-family: var(--tit); font-weight: 900; font-size: 30px; color: var(--apagado); }
    #smp .opo .marcaop .nm { font-family: var(--tit); font-weight: 900; font-size: clamp(19px, 1.6vw, 24px); }
    #smp .opo .marcaop .cl { color: var(--suave); font-weight: 700; font-size: 15px; }
    #smp .tag { display: inline-block; background: #e3fff9; color: #0b7a64; font-weight: 900; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; }

    /* análisis */
    #smp .medidor { display: flex; gap: 6px; margin: 18px 0 8px; width: 100%; }
    #smp .medidor i { flex: 1; height: 16px; border-radius: 6px; background: rgba(255, 255, 255, .15); }
    #smp .medidor i.on { background: var(--turq); }
    #smp .palancas { display: grid; gap: 12px; margin-top: 18px; }
    #smp .palanca { background: var(--fondo); border-radius: 16px; padding: 14px 18px; opacity: 0; transform: translateY(8px); animation: smp-in .45s forwards; }
    #smp .palanca b { display: block; font-size: clamp(16px, 1.35vw, 20px); }
    #smp .palanca span { color: var(--suave); font-size: clamp(14px, 1.15vw, 17px); }
    #smp .camino { margin-top: 18px; border-left: 8px solid var(--turq); padding: 6px 0 6px 18px; font-weight: 800; font-size: clamp(17px, 1.5vw, 22px); }

    /* caminos */
    #smp .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 18px; align-items: stretch; }
    #smp .card { background: var(--fondo); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: translateY(10px); animation: smp-in .45s forwards; }
    #smp .card h3 { font-size: clamp(24px, 2.2vw, 34px); }
    #smp .card p { color: var(--suave); font-size: clamp(16px, 1.3vw, 20px); }
    #smp .card.rec { background: var(--azul); color: #fff; }
    #smp .card.rec p { color: #c8cae6; }
    #smp .card .tag { align-self: flex-start; background: var(--turq); color: var(--azul); }

    /* navegación */
    #smp .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px clamp(18px, 4vw, 72px) 16px; flex: none; }
    #smp .puntos { display: flex; gap: 8px; align-items: center; }
    #smp .puntos button { width: 12px; height: 12px; border-radius: 50%; background: var(--linea); padding: 0; }
    #smp .puntos button.on { background: var(--celeste); width: 30px; border-radius: 8px; }
    #smp .flechas { display: flex; gap: 10px; align-items: center; }
    #smp .flechas span { color: var(--apagado); font-weight: 700; font-size: 14px; margin-right: 6px; }
    #smp .flechas button { width: 54px; height: 54px; border-radius: 50%; background: #fff; border: 2px solid var(--linea); font-size: 22px; font-weight: 900; color: var(--azul); }
    #smp .flechas button.sig { background: var(--celeste); border-color: var(--celeste); color: #fff; }
    #smp .flechas button:disabled { opacity: .3; cursor: default; }
    @media (max-width: 900px) {
      #smp .dos, #smp .portada { grid-template-columns: 1fr; }
      #smp .etapa .fe { display: none; }
      #smp .etapa .dot { width: 50px; height: 50px; font-size: 20px; }
      #smp .rail { top: 21px; }
      #smp .barra .acciones button span { display: none; }
    }
  </style>

    <div class="titulo" data-r="titulo">¿Cómo funciona una oposición?</div>
    <div class="acciones">
      <button type="button" data-a="actualizar" hidden title="Volver a consultar el INPI">⟳ <span>Actualizar</span></button>
      <button type="button" data-a="pantalla" title="Pantalla completa (F)">⛶ <span>Pantalla completa</span></button>
      <button type="button" data-a="inicio" hidden title="Otra acta">✕ <span>Otra acta</span></button>
    </div>
  </header>

  <!-- 1) Pedir la clave y el acta -->
  <section class="pantalla" data-p="inicio">
    <div class="centro">
      <form class="tarjeta" data-r="form" autocomplete="off">
        <h1>Presentación de oposición</h1>
        <p class="sub">Escribí el número de acta: consultamos el expediente en el INPI y armamos la presentación con los datos de la marca.</p>
        <div class="error" data-r="error" hidden></div>
        <label class="campo" data-r="campoClave">Clave
          <input type="password" data-r="clave" autocomplete="current-password">
        </label>
        <label class="check" data-r="campoRecordar"><input type="checkbox" data-r="recordar" checked> Recordar la clave en esta computadora</label>
        <label class="campo">Número de acta
          <input type="text" data-r="acta" inputmode="numeric" placeholder="Ej.: 4793580">
        </label>
        <button class="btn pri" type="submit">Armar presentación →</button>
        <div style="text-align:center">
          <button class="btn sec" type="button" data-a="general">Ver la versión general, sin acta</button>
          <button class="btn sec" type="button" data-a="olvidar" data-r="olvidar" hidden>Cambiar la clave guardada</button>
        </div>
      </form>
    </div>
  </section>

  <!-- 2) Consultando -->
  <section class="pantalla" data-p="cargando" hidden>
    <div class="centro">
      <div class="cargando">
        <div class="spin"></div>
        <h2>Consultando el expediente en el INPI…</h2>
        <p data-r="cargandoTxt">Puede tardar hasta un minuto si el INPI está lento.</p>
      </div>
    </div>
  </section>

  <!-- 3) Presentación -->
  <section class="pantalla" data-p="slides" hidden>
    <div class="escenario"><div class="slide" data-r="slide"></div></div>
    <div class="nav">
      <div class="puntos" data-r="puntos"></div>
      <div class="flechas">
        <span data-r="aviso"></span>
        <span data-r="contador"></span>
        <button type="button" data-a="ant" aria-label="Anterior">←</button>
        <button type="button" class="sig" data-a="sig" aria-label="Siguiente">→</button>
      </div>
    </div>
  </section>

  <script>
  (function () {
    var API = "https://panel.registrodemimarca.com.ar/api/publico/presentacion/consulta";
    var CLAVE_LS = "smp-presentacion-clave";
    var raiz = document.getElementById("smp");
    if (raiz.parentNode !== document.body) document.body.appendChild(raiz);   // que nada del tema la recorte
    function q(sel) { return raiz.querySelector(sel); }
    function r(nombre) { return q('[data-r="' + nombre + '"]'); }
    function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
    function fecha(iso) { if (!iso) return ""; var p = String(iso).slice(0, 10).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : ""; }
    function dia(iso) { if (!iso) return null; var p = String(iso).slice(0, 10).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function hoy() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
    function diasHasta(iso) { var d = dia(iso); return d ? Math.round((d - hoy()) / 864e5) : null; }

    // trama decorativa (manual de marca)
    (function () {
      var t = q(".trama"), cols = ["#0095ff", "#5cffe1", "#3b4bb8", "#0095ff"];
      for (var f = 0; f < 4; f++) for (var c = 0; c < 10; c++) {
        var i = document.createElement("i"); i.style.display = "block";
        i.style.background = Math.random() < (c + 1) / 10 * (1 - f / 5) ? cols[Math.floor(Math.random() * 4)] : "transparent";
        t.appendChild(i);
      }
    })();

    function pantalla(n) {
      raiz.querySelectorAll("[data-p]").forEach(function (p) { p.hidden = p.getAttribute("data-p") !== n; });
      q('[data-a="actualizar"]').hidden = !(n === "slides" && datos);
      q('[data-a="inicio"]').hidden = n !== "slides";
    }

    // ── Inicio ──────────────────────────────────────────────────────────────
    var datos = null, slides = [], actual = 0;
    function prepararInicio(msg) {
      var guardada = ls(CLAVE_LS);
      r("campoClave").hidden = !!guardada; r("campoRecordar").hidden = !!guardada; r("olvidar").hidden = !guardada;
      r("error").hidden = !msg; r("error").textContent = msg || "";
      r("titulo").innerHTML = "¿Cómo funciona una oposición?";
      pantalla("inicio");
      setTimeout(function () { (guardada ? r("acta") : r("clave")).focus(); }, 50);
    }
    r("form").addEventListener("submit", function (e) { e.preventDefault(); consultar(false); });

    function consultar(actualizar) {
      var clave = ls(CLAVE_LS) || r("clave").value.trim();
      var acta = (actualizar && datos ? datos.acta : r("acta").value).replace(/[\s.]/g, "");
      if (!clave) return prepararInicio("Escribí la clave.");
      if (!/^\d{5,9}$/.test(acta)) return prepararInicio("Escribí un número de acta válido (solo números).");
      pantalla("cargando");
      var lento = setTimeout(function () { r("cargandoTxt").textContent = "El INPI está tardando… seguimos esperando la respuesta."; }, 15000);
      fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "X-Presentacion-Clave": clave },
                   body: JSON.stringify({ acta: acta, actualizar: !!actualizar }) })
        .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { return { ok: res.ok, status: res.status, j: j }; }); })
        .then(function (x) {
          clearTimeout(lento); r("cargandoTxt").textContent = "Puede tardar hasta un minuto si el INPI está lento.";
          if (x.status === 401) { ls(CLAVE_LS, null); r("clave").value = ""; return prepararInicio("La clave no es correcta."); }
          if (!x.ok) return prepararInicio(x.j.detail || "No se pudo armar la presentación. Probá de nuevo.");
          if (!ls(CLAVE_LS) && r("recordar").checked) ls(CLAVE_LS, clave);
          iniciar(x.j);
        })
        .catch(function () { clearTimeout(lento); prepararInicio("No hubo respuesta del panel. Revisá la conexión y probá de nuevo."); });
    }

    raiz.addEventListener("click", function (e) {
      var b = e.target.closest("[data-a]"); if (!b || !raiz.contains(b)) return;
      var a = b.getAttribute("data-a");
      if (a === "general") iniciar(null);
      else if (a === "olvidar") { ls(CLAVE_LS, null); prepararInicio(); }
      else if (a === "inicio") { datos = null; r("acta").value = ""; prepararInicio(); }
      else if (a === "actualizar") consultar(true);
      else if (a === "pantalla") pantallaCompleta();
      else if (a === "ant") ir(actual - 1);
      else if (a === "sig") ir(actual + 1);
      else if (a === "ir") ir(+b.getAttribute("data-i"));
      else if (a === "etapa") ir(indice(b.getAttribute("data-s")));
      else if (a === "fork") {
        var caja = b.closest("[data-fork]");
        caja.querySelectorAll("button").forEach(function (x) { x.classList.toggle("sel", x === b); });
        var sal = caja.parentNode.querySelector(".salida-" + caja.getAttribute("data-fork"));
        sal.outerHTML = salidaHtml(caja.getAttribute("data-fork"), +b.getAttribute("data-o"));
      }
    });
    function pantallaCompleta() {
      try { if (document.fullscreenElement) document.exitFullscreen(); else (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz); } catch (e) {}
    }
    document.addEventListener("keydown", function (e) {
      if (q('[data-p="slides"]').hidden || /INPUT|TEXTAREA/.test((e.target || {}).tagName || "")) return;
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); ir(actual + 1); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); ir(actual - 1); }
      else if (e.key === "f" || e.key === "F") pantallaCompleta();
      else if (e.key === "Home") ir(0);
    });

    // ── Etapas y "hoy" ──────────────────────────────────────────────────────
    var ETAPAS = [
      { s: "portada", l: "Solicitud" }, { s: "publicacion", l: "Publicación" }, { s: "analisis", l: "Análisis" },
      { s: "negociacion", l: "Negociación" }, { s: "ratificacion", l: "Ratificación" }, { s: "instancia", l: "Instancia administrativa" }
    ];
    function vigentes() { return datos ? datos.oposiciones.filter(function (o) { return !o.levantamiento; }) : []; }
    function etapaHoy() {   // 0..5, o -1 si no se sabe (versión general)
      if (!datos) return -1;
      var p = datos.plazos, est = (datos.marca.estado_tramite || "").toLowerCase();
      if (/conced|deneg/.test(est)) return -1;
      if (!p.publicacion) return 0;
      if (vigentes().length) {
        if (!p.notificacion) return 2;
        if (p.vencimiento_negociacion && diasHasta(p.vencimiento_negociacion) < 0) return 4;
        return 3;
      }
      return 1;
    }
    function fechaEtapa(i) {
      if (!datos) return ["Presentás la marca", "30 días corridos", "Informe de la oposición", "3 meses", "15 días hábiles", "El INPI decide"][i];
      var p = datos.plazos, op = vigentes()[0];
      if (i === 0) return datos.marca.fecha_presentacion ? fecha(datos.marca.fecha_presentacion) : "Presentada";
      if (i === 1) return p.publicacion ? fecha(p.publicacion) + " → " + fecha(p.cierre_oposiciones) : "Sin publicar";
      if (i === 2) return op && op.presentacion ? "Oposición " + fecha(op.presentacion) : (datos.oposiciones.length ? "Oposición levantada" : "Sin oposiciones");
      if (i === 3) return p.vencimiento_negociacion ? "Vence " + fecha(p.vencimiento_negociacion) : (op ? "Falta notificar" : "3 meses");
      if (i === 4) return "15 días hábiles";
      return "Si ratifica";
    }
    function textoHoy(i) {
      var p = datos.plazos, n = vigentes().length, d;
      if (/conced/i.test(datos.marca.estado_tramite || "")) return "La marca ya figura <b>concedida</b> en el INPI.";
      if (/deneg/i.test(datos.marca.estado_tramite || "")) return "La marca figura <b>denegada</b> en el INPI.";
      if (i === 0) return "La marca todavía <b>no se publicó</b> en el Boletín de Marcas.";
      if (i === 1) { d = diasHasta(p.cierre_oposiciones);
        return d >= 0 ? "Está en el plazo de oposición: quedan <b>" + d + " días</b> (hasta el " + fecha(p.cierre_oposiciones) + ")."
                      : "El plazo de oposición cerró el " + fecha(p.cierre_oposiciones) + " <b>sin oposiciones</b>."; }
      if (i === 2) return "Recibió <b>" + n + (n === 1 ? " oposición" : " oposiciones") + "</b>. El INPI todavía no la notificó: es el momento de analizarla.";
      if (i === 3) { d = diasHasta(p.vencimiento_negociacion);
        return "Estamos en la negociación: quedan <b>" + d + " días</b> para llegar a un acuerdo (vence el " + fecha(p.vencimiento_negociacion) + ")."; }
      return "Los 3 meses para negociar vencieron el " + fecha(p.vencimiento_negociacion) + ": el INPI <b>intima al opositor</b> a ratificar.";
    }

    // ── Slides ──────────────────────────────────────────────────────────────
    function indice(id) { for (var i = 0; i < slides.length; i++) if (slides[i].id === id) return i; return 0; }
    function chips(lista, clase) { return '<div class="chips">' + lista.map(function (c, j) {
      return '<span class="chip ' + (clase || "") + '" style="animation-delay:' + (.2 + j * .12) + 's">' + esc(c) + "</span>"; }).join("") + "</div>"; }
    var FORKS = {
      pub: { b: [["Sin oposiciones", "a"], ["Con oposiciones", "b"]],
             o: [["ok", "✓ Tu marca sigue su trámite hacia la concesión."], ["go", "El INPI te notifica y analizamos la oposición.", "analisis", "Ver análisis →"]] },
      ana: { b: [["Hay argumentos", "a"], ["Es inviable", "b"]],
             o: [["ok", "Negociamos con fundamentos para sostener tu marca.", "negociacion", "Ver negociación →"], ["go", "Recomendamos presentar una marca nueva y evitar un conflicto largo y caro."]] },
      rat: { b: [["No ratifica", "a"], ["Ratifica", "b"]],
             o: [["ok", "✓ La oposición se cae y tu marca sigue su trámite."], ["go", "Se abre la instancia administrativa.", "instancia", "Ver etapa 6 →"]] }
    };
    function forkHtml(k, sel) {
      return '<div class="fork" data-fork="' + k + '">' + FORKS[k].b.map(function (b, j) {
        return '<button type="button" class="' + b[1] + (sel === j ? " sel" : "") + '" data-a="fork" data-o="' + j + '">' + b[0] + "</button>"; }).join("") +
        "</div>" + salidaHtml(k, sel);
    }
    function salidaHtml(k, j) {
      if (j == null || j < 0) return '<div class="salida-' + k + '"></div>';
      var o = FORKS[k].o[j];
      if (k === "pub" && j === 1 && datos && vigentes().length) o = ["go", "Recibió " + vigentes().length + (vigentes().length === 1 ? " oposición." : " oposiciones."), "quien", "Ver quién se opuso →"];
      return '<div class="salida salida-' + k + " " + o[0] + '">' + esc(o[1]) +
        (o[2] ? ' <button type="button" data-a="etapa" data-s="' + o[2] + '">' + esc(o[3]) + "</button>" : "") + "</div>";
    }
    function grande(n, u, f, txt) {
      return '<div class="grande"><div class="n' + (txt ? " txt" : "") + '">' + esc(n) + '</div><div class="u">' + esc(u) + "</div>" +
        (f ? '<div class="f">' + f + "</div>" : "") + "</div>";
    }
    function dos(izq, k, h, p, extra) {
      return '<div class="dos">' + izq + '<div><div class="k">' + esc(k) + "</div><h2>" + esc(h) + '</h2><p class="lead">' + esc(p) + "</p>" + (extra || "") + "</div></div>";
    }

    function slidePortada() {
      if (!datos) return '<div class="portada"><div><div class="k">Smarties Consultora</div><h1>¿Cómo funciona una oposición a tu marca?</h1>' +
        '<p class="estado">Los plazos y las etapas, desde que presentás la solicitud hasta que el INPI decide.</p></div>' +
        '<div class="logomarca"><div class="sinlogo">Paso a paso</div></div></div>';
      var m = datos.marca, meta = [];
      if (m.clase) meta.push("Clase " + m.clase);
      meta.push("Acta " + datos.acta);
      if (m.tipo) meta.push(m.tipo);
      var est = datos.plazos.publicacion ? "Publicada en el Boletín de Marcas" + (datos.publicacion.numero ? " N° " + esc(datos.publicacion.numero) : "") +
        " el " + fecha(datos.plazos.publicacion) + "." : "Todavía sin publicar en el Boletín de Marcas.";
      if (m.titular) est = "Titular: " + esc(m.titular) + "<br>" + est;
      return '<div class="portada"><div><div class="k">Tu marca</div><h1>' + esc(m.denominacion || "Acta " + datos.acta) + "</h1>" +
        '<div class="meta">' + meta.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" +
        '<p class="estado">' + est + "</p></div>" +
        '<div class="logomarca">' + (m.logo ? '<img alt="Logo de la marca" src="' + esc(m.logo) + '">' : '<div class="sinlogo">' + esc(m.denominacion || "") + "</div>") + "</div></div>";
    }
    function slideRecorrido() {
      var h = etapaHoy(), pasos = ETAPAS.map(function (e, i) {
        var cls = h < 0 ? "" : i < h ? "hecha" : i === h ? "hoy" : "";
        return '<button type="button" class="etapa ' + cls + '" data-a="etapa" data-s="' + e.s + '"><span class="badge">Hoy</span><span class="dot">' + (i + 1) +
          '</span><span class="lbl">' + esc(e.l) + '</span><span class="fe">' + esc(fechaEtapa(i)) + "</span></button>";
      }).join("");
      var hoyHtml = datos ? '<div class="hoytxt">' + textoHoy(h) + "</div>" : '<div class="hoytxt">Hacé clic en cada etapa para ver qué pasa y cuánto dura.</div>';
      setTimeout(function () { var b = q(".rail b"); if (b) b.style.width = (h < 0 ? (datos ? 100 : 0) : h / 5 * 100) + "%"; }, 60);
      return '<div class="k">El recorrido</div><h2>' + (datos ? "Dónde está tu marca hoy" : "Seis etapas, con plazos fijos") + "</h2>" +
        '<div class="track"><div class="rail"><b></b></div>' + pasos + "</div>" + hoyHtml;
    }
    function slidePublicacion() {
      var p = datos && datos.plazos, f = p && p.publicacion ? "Publicada el " + fecha(p.publicacion) + "<br>Plazo hasta el " + fecha(p.cierre_oposiciones) : "";
      var sel = !datos ? -1 : (datos.oposiciones.length ? 1 : (p.publicacion && diasHasta(p.cierre_oposiciones) < 0 ? 0 : -1));
      return dos(grande("30", "días corridos", f), "Etapa 2 · Publicación", "Se publica en el Boletín de Marcas",
        "Durante 30 días, cualquier titular de una marca anterior puede oponerse si cree que la tuya se parece a la suya.", forkHtml("pub", sel));
    }
    function slideQuien() {
      var cards = datos.oposiciones.map(function (o, j) {
        var marcas = o.marcas.map(function (mk) {
          return '<div class="marcaop"><div class="im">' + (mk.logo ? '<img alt="" src="' + esc(mk.logo) + '">' : "<span>®</span>") + "</div><div>" +
            '<div class="nm">' + esc(mk.denominacion || "Acta " + mk.acta) + '</div><div class="cl">' + (mk.clase ? "Clase " + esc(mk.clase) + " · " : "") + "Acta " + esc(mk.acta) + "</div></div></div>";
        }).join("");
        if (!marcas && o.citada) marcas = '<div class="marcaop"><div class="im"><span>®</span></div><div><div class="nm">' + esc(o.citada) + "</div></div></div>";
        return '<div class="opo card" style="animation-delay:' + (.15 + j * .15) + 's;background:#fff">' + (o.levantamiento ? '<span class="tag">Levantada el ' + fecha(o.levantamiento) + "</span>" : "") +
          "<h3>" + esc(o.oponente || "Oponente") + "</h3>" +
          '<div class="dato">Presentó la oposición el <b>' + (fecha(o.presentacion) || "—") + "</b></div>" +
          '<div class="dato">' + (o.agente_oponente ? "Con agente: <b>" + esc(o.agente_oponente) + "</b>" : "Sin agente de propiedad industrial") + "</div>" +
          (marcas ? '<div class="dato">Se opone con su marca:</div>' + marcas : "") + "</div>";
      }).join("");
      var n = datos.oposiciones.length;
      return '<div class="k">La oposición</div><h2>' + (n === 1 ? "¿Quién se opuso?" : "¿Quiénes se opusieron? (" + n + ")") + '</h2><div class="opos">' + cards + "</div>";
    }
    function slideAnalisis() {
      var inf = datos && datos.informe;
      if (!inf) return dos(grande("Informe", "de la oposición", "", true), "Etapa 3 · Análisis", "Analizamos si tu marca se puede defender",
        "Comparamos las dos marcas y buscamos argumentos para sostener la tuya.",
        chips(["Parecido de los nombres", "Productos y servicios", "Otras marcas que conviven", "Perfil del opositor"]) + forkHtml("ana", -1));
      var nivel = inf.niveles.indexOf(inf.chances), med = inf.niveles.map(function (x, i) { return '<i class="' + (nivel >= 0 && i <= nivel ? "on" : "") + '"></i>'; }).join("");
      var izq = '<div class="grande"><div class="u" style="margin:0">Chances de defender la marca</div><div class="medidor">' + med + '</div><div class="n txt">' +
        esc(inf.chances ? inf.chances.charAt(0).toUpperCase() + inf.chances.slice(1) : "A definir") + "</div>" + (inf.fecha ? '<div class="f">Análisis del ' + esc(inf.fecha) + "</div>" : "") + "</div>";
      var pal = inf.palancas.map(function (p, j) { return '<div class="palanca" style="animation-delay:' + (.2 + j * .15) + 's"><b>' + esc(p.palanca) + "</b>" + (p.detalle ? "<span>" + esc(p.detalle) + "</span>" : "") + "</div>"; }).join("");
      return dos(izq, "Etapa 3 · Análisis", "Lo que encontramos", inf.motivo || inf.signos || "",
        (pal ? '<div class="palancas">' + pal + "</div>" : "") + (inf.camino ? '<div class="camino">Camino sugerido: ' + esc(inf.camino) + "</div>" : ""));
    }
    function slideNegociacion() {
      var p = datos && datos.plazos, izq, txt = "Desde que el INPI notifica la oposición, hay 3 meses para llegar a un acuerdo con el opositor. Es la vía más rápida y económica.";
      if (p && p.vencimiento_negociacion) {
        var d = diasHasta(p.vencimiento_negociacion);
        izq = d >= 0 ? grande(String(d), d === 1 ? "día para negociar" : "días para negociar", "Notificada el " + fecha(p.notificacion) + "<br>Vence el " + fecha(p.vencimiento_negociacion))
                     : grande("Venció", "el plazo para negociar", "Venció el " + fecha(p.vencimiento_negociacion), true);
      } else {
        izq = grande("3", "meses para negociar", datos && vigentes().length ? "Corren desde que el INPI la notifique" : "");
        if (datos && vigentes().length) txt = "La oposición todavía no fue notificada. Cuando el INPI la notifique en su portal, empiezan a correr los 3 meses para negociar.";
      }
      return dos(izq, "Etapa 4 · Negociación", "Se abre la negociación", txt, chips(["Retiro de la oposición", "Acuerdo de coexistencia", "Carta compromiso"]));
    }
    function slideRatificacion() {
      return dos(grande("15", "días hábiles"), "Etapa 5 · Ratificación", "Sin acuerdo, el opositor debe ratificar",
        "El INPI intima al opositor: tiene que mantener la oposición, pagar el arancel y ampliar sus fundamentos.", forkHtml("rat", -1));
    }
    function slideInstancia() {
      var pasos = ["Contestación", "Pruebas", "Alegatos", "Resolución"], h = '<div class="chips" style="align-items:center">';
      pasos.forEach(function (c, j) { if (j) h += '<span class="flecha" style="animation-delay:' + (.2 + j * .15) + 's">→</span>';
        h += '<span class="chip b" style="animation-delay:' + (.25 + j * .15) + 's">' + c + "</span>"; });
      return dos(grande("INPI", "resuelve el conflicto", "", true), "Etapa 6 · Instancia administrativa", "El INPI decide quién tiene razón",
        "Es la etapa más larga y más costosa, y el resultado es incierto. Tenés 15 días hábiles para contestar.", h + "</div>");
    }
    function slideCaminos() {
      var c = datos && datos.informe && datos.informe.caminos.length ? datos.informe.caminos : [
        { titulo: "Negociar", detalle: "Buscamos un acuerdo con el opositor dentro de los 3 meses. Rápido, económico y con resultado cierto.", recomendado: false },
        { titulo: "Esperar", detalle: "No negociamos y vemos si el opositor ratifica. Si no lo hace, la marca sigue; si lo hace, vamos a la instancia administrativa.", recomendado: false },
        { titulo: "Marca nueva", detalle: "Si el riesgo es alto o la marca es nueva, puede convenir presentar una distinta y evitar el conflicto.", recomendado: false }];
      return '<div class="k">Próximo paso</div><h2>¿Qué hacemos?</h2><div class="cards">' + c.map(function (x, j) {
        return '<div class="card' + (x.recomendado ? " rec" : "") + '" style="animation-delay:' + (.15 + j * .15) + 's">' + (x.recomendado ? '<span class="tag">Recomendado</span>' : "") +
          "<h3>" + esc(x.titulo) + "</h3><p>" + esc(x.detalle) + "</p></div>"; }).join("") + "</div>";
    }

    function iniciar(d) {
      datos = d;
      slides = [{ id: "portada", f: slidePortada }, { id: "recorrido", f: slideRecorrido }, { id: "publicacion", f: slidePublicacion }];
      if (datos && datos.oposiciones.length) slides.push({ id: "quien", f: slideQuien });
      slides.push({ id: "analisis", f: slideAnalisis }, { id: "negociacion", f: slideNegociacion }, { id: "ratificacion", f: slideRatificacion },
                  { id: "instancia", f: slideInstancia }, { id: "caminos", f: slideCaminos });
      r("titulo").innerHTML = datos ? esc(datos.marca.denominacion || "Acta " + datos.acta) + "<small>Acta " + esc(datos.acta) + (datos.marca.clase ? " · Clase " + esc(datos.marca.clase) : "") + "</small>"
                                    : "¿Cómo funciona una oposición?";
      r("aviso").innerHTML = datos && datos.aviso ? '<span class="aviso">' + esc(datos.aviso) + "</span>" : "";
      r("puntos").innerHTML = slides.map(function (s, i) { return '<button type="button" data-a="ir" data-i="' + i + '" aria-label="Slide ' + (i + 1) + '"></button>'; }).join("");
      pantalla("slides");
      actual = -1; ir(0);
    }
    function ir(i) {
      if (i < 0 || i >= slides.length || i === actual) return;
      actual = i;
      var el = r("slide");
      el.innerHTML = slides[i].f();
      el.classList.remove("anim"); void el.offsetWidth; el.classList.add("anim"); el.scrollTop = 0;
      r("puntos").querySelectorAll("button").forEach(function (b, j) { b.classList.toggle("on", j === i); });
      r("contador").textContent = (i + 1) + " / " + slides.length;
      q('[data-a="ant"]').disabled = i === 0;
      q('[data-a="sig"]').disabled = i === slides.length - 1;
    }

    prepararInicio();
  })();
  </script>
</div>
