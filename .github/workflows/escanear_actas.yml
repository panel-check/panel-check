name: Escanear actas nuevas

on:
  schedule:
    # 3 veces por día, corrido en horas distintas a los demás crons contra
    # INPI para no acumular consultas al mismo tiempo (ver comentarios en
    # reintentar_sin_email.yml y reintentar_sin_verificar.yml).
    - cron: "0 7,13,19 * * *"
  workflow_dispatch:
    inputs:
      tope:
        description: "Máximo de números de acta a probar en esta corrida"
        required: false
        default: "300"
      consecutivos_para_frenar:
        description: "Si esta cantidad de actas seguidas no existe todavía, corta la corrida"
        required: false
        default: "8"
      desde:
        description: "Punto de partida (solo aplica la primera vez, si todavía no hay estado guardado)"
        required: false
        default: "4797000"

permissions:
  contents: read

jobs:
  escanear:
    runs-on: ubuntu-latest
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar los siguientes números de acta contra INPI
        run: |
          cd scripts
          TOPE="${{ inputs.tope }}"
          CONSECUTIVOS="${{ inputs.consecutivos_para_frenar }}"
          DESDE="${{ inputs.desde }}"
          python3 escanear_actas_nuevas.py \
            --tope "${TOPE:-300}" \
            --consecutivos-para-frenar "${CONSECUTIVOS:-8}" \
            --desde "${DESDE:-4797000}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

      - name: Completar nombres que quedaron pendientes (mixta/fig.)
        # Si alguna acta nueva quedó guardada sin nombre (ficha y Formulario
        # sin texto, webservice todavía sin la marca), se reintenta en el
        # momento. Si no quedó ninguna pendiente, termina al instante sin
        # consultar INPI. No marca el escaneo en rojo si falla: el proceso
        # programado "Completar nombres" lo vuelve a intentar.
        if: always()
        continue-on-error: true
        run: |
          cd scripts
          python3 backfill_denominacion.py --limit 60
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
