name: "Solicitudes nuevas del día (escaneo de actas)"

on:
  schedule:
    # Horario en UTC (Argentina = UTC-3). GitHub arranca los crons ~15 min tarde.
    # Una sola corrida diaria, 18:00 ART (21:00 UTC) — decidido el 15/10/2026:
    # antes corría en 4 tandas (turnos A/B de noche + 2 sondeos diurnos), con
    # el turno A recortado los martes y el turno B salteado los miércoles para
    # dejarle el carril libre al pipeline de boletines, que arrancaba a las
    # 00:05. Ese pipeline ya no tiene disparo automático (ver pipeline.yml),
    # así que esa coordinación dejó de hacer falta y se simplificó a una
    # corrida por día, todos los días (miércoles incluido). "Vigilancia
    # marcaria" (vigilancia.yml) se dispara sola apenas termina esta corrida.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Minutos máximos de escaneo en esta corrida"
        required: false
        default: "150"
      tope:
        description: "Tope de seguridad de números de acta a probar"
        required: false
        default: "3000"
      consecutivos_para_frenar:
        description: "Si esta cantidad de actas seguidas no existe todavía, corta la corrida"
        required: false
        default: "8"
      desde:
        description: "Punto de partida (solo aplica la primera vez, si todavía no hay estado guardado)"
        required: false
        default: "4797000"

permissions:
  contents: read

# Un solo carril contra INPI: dos procesos que consultan INPI nunca corren a la
# vez (INPI pidió una sola tanda, máx. 100 conexiones). Si hay uno corriendo, el
# siguiente espera su turno. GitHub guarda UNA sola corrida en espera por grupo.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar los siguientes números de acta contra INPI
        run: |
          cd scripts
          # Presupuesto de tiempo: 150 min por defecto (una sola corrida diaria,
          # ya no hace falta distinguir por horario), salvo que lo pisen a mano.
          MAXMIN="${{ inputs.max_minutes }}"
          if [ -z "$MAXMIN" ]; then
            MAXMIN=150
          fi
          echo "Presupuesto de escaneo: $MAXMIN min"
          TOPE="${{ inputs.tope }}"
          CONSECUTIVOS="${{ inputs.consecutivos_para_frenar }}"
          DESDE="${{ inputs.desde }}"
          python3 escanear_actas_nuevas.py \
            --tope "${TOPE:-3000}" \
            --max-minutes "$MAXMIN" \
            --consecutivos-para-frenar "${CONSECUTIVOS:-8}" \
            --desde "${DESDE:-4797000}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

      - name: Completar nombres que quedaron pendientes (mixta/fig.)
        # Si alguna acta nueva quedó guardada sin nombre (ficha y Formulario
        # sin texto, webservice todavía sin la marca), se reintenta en el
        # momento. Si no quedó ninguna pendiente, termina al instante sin
        # consultar INPI. No marca el escaneo en rojo si falla: el proceso
        # programado "Completar nombres" lo vuelve a intentar.
        if: always()
        continue-on-error: true
        run: |
          cd scripts
          python3 backfill_denominacion.py --limit 60 --max-minutes 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
