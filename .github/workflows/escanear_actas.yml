name: "Solicitudes nuevas del día (escaneo de actas)"

on:
  schedule:
    # Horarios en UTC (Argentina = UTC-3). GitHub arranca los crons ~15 min tarde.
    # Turno A, 19:35 ART: escaneo largo (150 min; los martes 120, porque a las
    # 00:05 del miércoles el carril tiene que quedar libre para los boletines).
    - cron: "35 22 * * *"
    # Turno B, 01:40 ART: escaneo largo (150 min). NO corre la madrugada del
    # martes al miércoles (UTC miércoles): ahí el carril es de los boletines.
    - cron: "40 4 * * 0,1,2,4,5,6"
    # Sondeo diurno, 10:05 y 16:05 ART: 15 min, solo para no dejar acumular
    # atraso y que la vigilancia vea lo nuevo del día.
    - cron: "5 13 * * *"
    - cron: "5 19 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Minutos máximos de escaneo en esta corrida"
        required: false
        default: "150"
      tope:
        description: "Tope de seguridad de números de acta a probar"
        required: false
        default: "3000"
      consecutivos_para_frenar:
        description: "Si esta cantidad de actas seguidas no existe todavía, corta la corrida"
        required: false
        default: "8"
      desde:
        description: "Punto de partida (solo aplica la primera vez, si todavía no hay estado guardado)"
        required: false
        default: "4797000"

permissions:
  contents: read

# Un solo carril contra INPI: dos procesos que consultan INPI nunca corren a la
# vez (INPI pidió una sola tanda, máx. 100 conexiones). Si hay uno corriendo, el
# siguiente espera su turno. GitHub guarda UNA sola corrida en espera por grupo.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar los siguientes números de acta contra INPI
        run: |
          cd scripts
          # Presupuesto de tiempo según qué horario disparó la corrida.
          MAXMIN="${{ inputs.max_minutes }}"
          if [ -z "$MAXMIN" ]; then
            case "${{ github.event.schedule }}" in
              "35 22 * * *") MAXMIN=150; [ "$(date -u +%u)" = "2" ] && MAXMIN=120 ;;  # martes: recortado
              "40 4 * * 0,1,2,4,5,6") MAXMIN=150 ;;
              "") MAXMIN=150 ;;  # disparo manual sin indicar minutos
              *) MAXMIN=15 ;;  # sondeo diurno
            esac
          fi
          echo "Presupuesto de escaneo: $MAXMIN min"
          TOPE="${{ inputs.tope }}"
          CONSECUTIVOS="${{ inputs.consecutivos_para_frenar }}"
          DESDE="${{ inputs.desde }}"
          python3 escanear_actas_nuevas.py \
            --tope "${TOPE:-3000}" \
            --max-minutes "$MAXMIN" \
            --consecutivos-para-frenar "${CONSECUTIVOS:-8}" \
            --desde "${DESDE:-4797000}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

      - name: Completar nombres que quedaron pendientes (mixta/fig.)
        # Si alguna acta nueva quedó guardada sin nombre (ficha y Formulario
        # sin texto, webservice todavía sin la marca), se reintenta en el
        # momento. Si no quedó ninguna pendiente, termina al instante sin
        # consultar INPI. No marca el escaneo en rojo si falla: el proceso
        # programado "Completar nombres" lo vuelve a intentar.
        if: always()
        continue-on-error: true
        run: |
          cd scripts
          python3 backfill_denominacion.py --limit 60 --max-minutes 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
