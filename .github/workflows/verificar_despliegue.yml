name: "Panel actualizado (verificación del despliegue)"

on:
  schedule:
    # Cada hora (antes cada 15 min) — GitHub Actions factura por minuto
    # SIEMPRE redondeando para arriba, así que aunque esta corrida tarde
    # ~15s, cada una cuesta 1 minuto facturado igual. A cada 15 min salía
    # ~2.880 min/mes solo este workflow (96 corridas/día x 1 min), más de
    # lo que da el plan free de un repo privado (2.000 min/mes). A cada
    # hora sigue detectando un deploy atascado el mismo día (24
    # corridas/día, ~720 min/mes), solo que en vez de enterarnos en 15 min
    # tardamos hasta 1 hora — aceptable para algo que no es urgente al
    # segundo. Ver 29/09/2026.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Comparar commit desplegado vs. main
        run: python3 scripts/verificar_despliegue.py
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
