name: "Completar datos faltantes - Sin nombre"

on:
  schedule:
    # Una vez por noche, 08:50 UTC (05:50 ART, turno B), con tope de 20 min. No
    # corre la madrugada del martes al miércoles (UTC miércoles).
    - cron: "50 8 * * 0,1,2,4,5,6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Tope de marcas a revisar en esta corrida (dejar vacío = todas)"
        required: false
        default: ""
      incluir_no_leads:
        description: "Incluir también marcas con apoderado (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

# Un solo carril contra INPI: dos procesos que consultan INPI nunca corren a la
# vez (INPI pidió una sola tanda, máx. 100 conexiones). Si hay uno corriendo, el
# siguiente espera su turno. GitHub guarda UNA sola corrida en espera por grupo.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Completar el nombre de las marcas que figuran como (mixta/fig.)
        run: |
          cd scripts
          args=""
          LIMIT="${{ inputs.limit }}"
          # corrida programada: tope de 150 para no alargarla
          if [ -z "$LIMIT" ] && [ "${{ github.event_name }}" = "schedule" ]; then LIMIT=150; fi
          if [ -n "$LIMIT" ]; then args="$args --limit $LIMIT"; fi
          args="$args --max-minutes 20"
          if [ "${{ inputs.incluir_no_leads }}" = "true" ]; then args="$args --incluir-no-leads"; fi
          python3 backfill_denominacion.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
