name: Corregir fecha de presentación pre-boletín (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = solo mostrar los cambios, sin guardar. Para corregir de verdad, dejar en false"
        required: false
        default: "false"
      max_minutes:
        description: "Minutos que corre cada tanda (después se vuelve a lanzar sola con las marcas que faltan)"
        required: false
        default: "110"
      desde_acta:
        description: "Normalmente dejar vacío: sigue solo desde la última marca revisada. Poner 0 para empezar de nuevo desde el principio"
        required: false
        default: ""
      limit:
        description: "Tope de marcas a revisar en esta corrida (dejar vacío = todas)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # para volver a lanzarse sola con las marcas que faltan

# Un solo carril contra INPI: si hay otro proceso de INPI corriendo, este espera su turno.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Poner la fecha de presentación real (ficha del acta) en las marcas pre-boletín
        run: |
          set -o pipefail
          cd scripts
          args=""
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.desde_acta }}" ]; then args="$args --desde-acta ${{ inputs.desde_acta }}"; fi
          if [ -n "${{ inputs.max_minutes }}" ]; then args="$args --max-minutes ${{ inputs.max_minutes }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          python3 backfill_fecha_presentacion.py $args 2>&1 | tee ../salida.log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

      # Si la tanda se cortó por tiempo y quedan marcas, se vuelve a lanzar sola (el script
      # recuerda hasta qué acta llegó), hasta terminar todas.
      - name: Seguir con la próxima tanda (automático)
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          if grep -q '^QUEDAN_MARCAS' salida.log; then
            echo "Lanzando la próxima tanda"
            gh workflow run backfill_fecha_presentacion.yml -f dry_run=false -f max_minutes="${{ inputs.max_minutes }}"
          else
            echo "No quedan marcas por revisar (o no se pudo leer INPI): no se lanza otra tanda."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
