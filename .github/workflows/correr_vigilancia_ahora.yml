name: Correr vigilancia ahora (temporal)

# Temporal (12/11/2026): corre la vigilancia con el juez con IA recién publicado, verifica la
# versión desplegada del panel y mide las alertas antes/después. Solo cantidades en el resultado.
on:
  push:
    branches: [claude/correr-vigilancia]

permissions:
  contents: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Versión desplegada del panel
        run: (curl -sS -m 20 "${PANEL_URL%/}/api/version" || echo "sin respuesta") | head -c 400 > /tmp/version.txt; cat /tmp/version.txt
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
      - name: Medir antes
        run: cd scripts && python3 medir_vigilancia.py --dias 30 --salida /tmp/antes.md
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
      - name: Correr la vigilancia
        run: cd scripts && python3 vigilancia.py 2>&1 | grep -v "^\[juez\] un par" | tee /tmp/todo.txt | grep -E "^\[juez\] ([0-9]+ de|se acab|reevaluando)|mantenimiento" ; tail -30 /tmp/todo.txt > /tmp/corrida.txt; cat /tmp/corrida.txt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIGILANCIA_CONSULTAR_INPI: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PYTHONUNBUFFERED: "1"
      - name: Medir después
        run: |
          cd scripts && python3 medir_vigilancia.py --dias 30 --salida /tmp/despues.md
          python3 - <<'PY'
          import os, psycopg2
          c = psycopg2.connect(os.environ["DATABASE_URL"]); c.set_session(readonly=True); cur = c.cursor()
          cur.execute("SELECT estado, ia_veredicto, COUNT(*) FROM vigilancia_alertas WHERE tipo='similitud' GROUP BY 1,2 ORDER BY 1,2")
          open("/tmp/estados.md","w").write("\n".join(f"- {e} / {v}: {n}" for e, v, n in cur.fetchall()) + "\n")
          PY
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
      - name: Guardar resultado
        if: always()
        run: |
          { echo "# Versión del panel"; cat /tmp/version.txt 2>/dev/null; echo; echo "# Corrida"; cat /tmp/corrida.txt 2>/dev/null; echo;
            echo "# Antes"; cat /tmp/antes.md 2>/dev/null; echo "# Después"; cat /tmp/despues.md 2>/dev/null; echo "# Estados y veredictos"; cat /tmp/estados.md 2>/dev/null; } > /tmp/r.md
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan resultado-vigilancia; git rm -rf --quiet . || true
          cp /tmp/r.md resultado.md; git add resultado.md; git commit -m "Corrida ${{ github.run_id }}"; git push -f origin resultado-vigilancia
