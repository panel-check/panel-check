name: Terminar backend de Postgres

on:
  workflow_dispatch:
    inputs:
      pids:
        description: "pids a terminar, separados por espacio"
        required: true

permissions:
  contents: read

jobs:
  terminar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Terminar
        run: |
          cd scripts
          python3 terminar_backend.py ${{ inputs.pids }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
