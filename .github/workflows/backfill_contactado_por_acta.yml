name: "Contactado por acta: deshacer las marcas de rebote (una sola vez / manual)"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = solo mostrar qué actas se desmarcarían, sin guardar (recomendado la primera vez). Para aplicar de verdad, poner false"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: backfill-contactado-por-acta
  cancel-in-progress: false

env:
  # Pedidos al INPI por el hosting de la web en Argentina (panel/inpi_relay.py, wordpress/inpi-relay.php).
  # Sin los secrets INPI_RELAY_URL / INPI_RELAY_CLAVE no cambia nada.
  INPI_RELAY_URL: ${{ secrets.INPI_RELAY_URL }}
  INPI_RELAY_CLAVE: ${{ secrets.INPI_RELAY_CLAVE }}
  PYTHONPATH: ${{ github.workspace }}/panel/relay_site

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Desmarca «contactado» en las actas que quedaron marcadas solo porque se le escribió al titular por
      # OTRA clase (antes el panel marcaba todas las actas del titular). Ver scripts/backfill_contactado_por_acta.py
      - name: Deshacer «contactado» de rebote
        run: |
          cd scripts
          args=""
          if [ "${{ inputs.dry_run }}" != "false" ]; then args="--dry-run"; fi
          python3 backfill_contactado_por_acta.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
