name: Corregir oposiciones viejas (una sola vez)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Tope de actas a re-chequear en esta corrida (dejar vacío = todas)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Re-chequear marcas con oposición/vista marcada
        run: |
          cd scripts
          args=""
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          python3 corregir_oposiciones_viejas.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
