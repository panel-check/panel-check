name: Notificaciones INPI (campanita del panel)

# Trae las notificaciones del INPI a Pame (webservice de Autogestión, ConsultaNotificacionesAdjunto), guarda
# las nuevas con su PDF en la base y avisa por Telegram los títulos, vistas y vistas a la oposición.
# Lo lanza el panel (panel/programador.py, cron UTC «20 11,16,22 * * *» = 08:20, 13:20 y 19:20 ART) y el botón
# «Actualizar» de la campanita. No usa el carril de INPI: es una sola consulta al webservice (1-2 s) más la
# descarga de los PDF nuevos, así no queda esperando detrás de las corridas largas de la noche.

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás a consultar (la primera vez carga el último año)"
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: notificaciones-inpi
  cancel-in-progress: false

env:
  INPI_RELAY_URL: ${{ secrets.INPI_RELAY_URL }}
  INPI_RELAY_CLAVE: ${{ secrets.INPI_RELAY_CLAVE }}
  PYTHONPATH: ${{ github.workspace }}/panel/relay_site

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer notificaciones y PDF
        run: |
          cd scripts
          python3 sincronizar_notificaciones_inpi.py --dias "${{ inputs.dias || '15' }}"
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          INPI_HASH_DELEGACION: ${{ secrets.INPI_HASH_DELEGACION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
