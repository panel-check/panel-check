name: DIAG busqueda denominacion (descartable)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: cd scripts && python3 _diag_busqueda_denominacion.py
        env:
          PYTHONUNBUFFERED: "1"
