name: Medir vigilancia (solo lectura)

# Mide cuántas alertas de parecido genera la vigilancia por día y qué regla las
# dispara. Solo lee la base (sesión readonly) y solo publica cantidades, sin
# nombres. El resultado queda en la rama medicion-vigilancia (medicion.md).
on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Cuántos días hacia atrás medir"
        required: false
        default: "30"
  push:
    branches: [claude/medir-vigilancia]

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Medir
        run: |
          cd scripts
          python3 medir_vigilancia.py --dias "${{ inputs.dias || '30' }}" --salida /tmp/medicion.md
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

      - name: Guardar el resultado en la rama medicion-vigilancia
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan medicion-vigilancia
          git rm -rf --quiet . || true
          cp /tmp/medicion.md medicion.md
          git add medicion.md
          git commit -m "Medición de la vigilancia ${{ github.run_id }}"
          git push -f origin medicion-vigilancia
