name: Corregir titular de actas escaneadas

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar los cambios, sin guardar (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

# Un solo carril contra INPI: si hay otro proceso de INPI corriendo, este espera su turno.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  corregir:
    runs-on: ubuntu-latest
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Corregir titulares
        run: |
          cd scripts
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 corregir_titular_escaneo.py --dry-run
          else
            python3 corregir_titular_escaneo.py
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
