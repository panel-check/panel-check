name: Validar GrillaMarcasAvanzada (Argonut)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install httpx

      - name: Validar
        run: |
          cd scripts
          python3 validar_grilla_avanzada.py
        env:
          PYTHONUNBUFFERED: "1"
