name: Diagnóstico de ubicaciones del expediente (manual)

# Vigilancia de expediente (13/11/2026): arma la lista real de sectores de «UBICACIÓN ACTUAL».
# Solo lee (sesión de base readonly). El log es público: no imprime titulares ni denominaciones.

on:
  workflow_dispatch:
    inputs:
      pre:
        description: "Cuántas marcas pre-boletín mirar (al azar, últimos 4 meses)"
        required: false
        default: "60"
      publicadas:
        description: "Cuántas marcas publicadas mirar (al azar, últimos 12 meses)"
        required: false
        default: "60"

permissions:
  contents: read

# Un solo carril contra INPI: si hay otro proceso de INPI corriendo, este espera su turno.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

env:
  # Pedidos al INPI por el hosting de la web en Argentina (panel/inpi_relay.py, wordpress/inpi-relay.php).
  INPI_RELAY_URL: ${{ secrets.INPI_RELAY_URL }}
  INPI_RELAY_CLAVE: ${{ secrets.INPI_RELAY_CLAVE }}
  PYTHONPATH: ${{ github.workspace }}/panel/relay_site

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Contar las ubicaciones del expediente
        run: |
          cd scripts
          python3 diagnostico_ubicaciones.py --pre "${{ inputs.pre }}" --publicadas "${{ inputs.publicadas }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
