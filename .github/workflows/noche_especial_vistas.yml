name: "Noche especial: vistas hasta terminar y después boletines"

# Disparo a mano (18/11/2026, pedido de KOM). Toda la noche en UNA corrida del carril de INPI, para que el
# programador del panel no meta nada en el medio (está en CARRIL_INPI): oposiciones, cartera y sin verificar esa noche
# no corren (vencen sus horarios mientras esto ocupa el carril).
#   1) Vistas, en dos tandas seguidas (el tope de un job de GitHub es de 6 horas), con «hoy» fijo en la fecha de
#      inicio: cada acta pendiente se mira una sola vez aunque se pase la medianoche. Corta a «vistas_hasta».
#   2) Al terminar, dispara la importación de los boletines nuevos (pipeline.yml, autodetecta), que queda
#      primera en el carril.
on:
  workflow_dispatch:
    inputs:
      hoy:
        description: "Fecha (AAAA-MM-DD) que cuenta como hoy para la revisión de vistas"
        required: true
      vistas_hasta:
        description: "Hora de Argentina (HH:MM) a la que se cortan las vistas para dejar lugar a los boletines"
        required: false
        default: "05:30"
      importar_boletines:
        description: "Al terminar, importar los boletines nuevos (true/false)"
        required: false
        default: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: inpi-lane
  cancel-in-progress: false

env:
  INPI_RELAY_URL: ${{ secrets.INPI_RELAY_URL }}
  INPI_RELAY_CLAVE: ${{ secrets.INPI_RELAY_CLAVE }}
  PYTHONPATH: ${{ github.workspace }}/panel/relay_site

jobs:
  vistas_1:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Vistas (primera tanda)
        run: |
          cd scripts
          python3 probar_vistas_preboletin.py --guardar --dias-minimos 3 --limite 9000 --max-minutes 345 \
            --hoy "${{ inputs.hoy }}" --hasta-hora "${{ inputs.vistas_hasta }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

  vistas_2:
    needs: vistas_1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Vistas (lo que quedó pendiente)
        run: |
          cd scripts
          python3 probar_vistas_preboletin.py --guardar --dias-minimos 3 --limite 9000 --max-minutes 345 \
            --hoy "${{ inputs.hoy }}" --hasta-hora "${{ inputs.vistas_hasta }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

  boletines:
    needs: vistas_2
    if: always() && inputs.importar_boletines == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar la importación de los boletines nuevos (queda primera en el carril)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --repo "${{ github.repository }}" --ref main
