name: "Concesiones y vencimientos"

on:
  # Sin horario de GitHub (27/10/2026): GitHub dispara los `schedule:` con 3 a 6 horas de atraso o los saltea.
  # Lo lanza el panel a su hora exacta (panel/programador.py, cron UTC «20 7 * * 1») con este mismo workflow_dispatch,
  # esperando turno si el carril de INPI está ocupado. Se puede lanzar a mano igual.
    # Una vez por semana, lunes 07:20 UTC (04:20 ART, turno B) — la Resolución de
    # un expediente demora meses, no hace falta revisar todos los días.
  workflow_dispatch:
    inputs:
      limit:
        description: "Tope de actas a revisar en esta corrida (dejar vacío = todas)"
        required: false
        default: ""
      max_minutes:
        description: "Minutos máximos de esta corrida (default 30)"
        required: false
        default: "30"

permissions:
  contents: read

# Un solo carril contra INPI: dos procesos que consultan INPI nunca corren a la
# vez (INPI pidió una sola tanda, máx. 100 conexiones). Si hay uno corriendo, el
# siguiente espera su turno. GitHub guarda UNA sola corrida en espera por grupo.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar RESOLUCIÓN de marcas sin estado firme
        run: |
          cd scripts
          args="--max-minutes ${{ inputs.max_minutes || '30' }}"
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          python3 revisar_estado.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
