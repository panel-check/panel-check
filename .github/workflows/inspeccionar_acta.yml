name: Inspeccionar acta (diagnóstico puntual)

on:
  workflow_dispatch:
    inputs:
      acta:
        description: "Número de acta a inspeccionar"
        required: true

permissions:
  contents: read

# Un solo carril contra INPI: si hay otro proceso de INPI corriendo, este espera su turno.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Volcar secciones del expediente
        run: |
          cd scripts
          python3 inspeccionar_acta.py "${{ inputs.acta }}"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Resumen final (paso separado por el límite de 10 annotations por step)
        run: |
          cd scripts
          python3 resumen_final_acta.py "${{ inputs.acta }}"
        env:
          PYTHONUNBUFFERED: "1"
