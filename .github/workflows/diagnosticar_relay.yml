name: Diagnosticar reenvío al INPI

# Mide cada pedido al INPI por el reenvío del hosting (scripts/diagnosticar_relay.py). Solo lectura.
on:
  workflow_dispatch:
    inputs:
      actas:
        description: "Actas a revisar (separadas por espacio)"
        required: false
        default: "4822137 4822138"

permissions:
  contents: read

concurrency:
  group: inpi-lane
  cancel-in-progress: false

env:
  # Pedidos al INPI por el hosting de la web en Argentina (panel/inpi_relay.py, wordpress/inpi-relay.php).
  # Sin los secrets INPI_RELAY_URL / INPI_RELAY_CLAVE no cambia nada.
  INPI_RELAY_URL: ${{ secrets.INPI_RELAY_URL }}
  INPI_RELAY_CLAVE: ${{ secrets.INPI_RELAY_CLAVE }}
  PYTHONPATH: ${{ github.workspace }}/panel/relay_site

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Medir pedidos al INPI
        run: |
          cd scripts
          python3 diagnosticar_relay.py ${{ inputs.actas }}
        env:
          PYTHONUNBUFFERED: "1"
