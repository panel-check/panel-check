name: Revisar vistas en pre-boletín

on:
  # Todos los días lo lanza el panel (panel/programador.py, 18:05 ART): espera a que el escaneo de actas libere el
  # carril de INPI (entre las 18:20 y las 20:10) y se corta solo a las 22:40 (o a los 100 minutos) para no pisar a
  # los procesos de las 23:00. Antes se encadenaba al escaneo con workflow_run; los horarios de GitHub se atrasan
  # horas, por eso ahora lo dispara el panel. Una marca revisada hoy no se vuelve a revisar hoy, así que repetir la
  # corrida el mismo día no repite nada.
  workflow_dispatch:
    inputs:
      dias_minimos:
        description: "Solo leads pre-boletín presentados hace N días o más"
        required: false
        default: "3"
      limite:
        description: "Tope de marcas a consultar en esta corrida (las que se revisaron hace más tiempo primero). Unas 20 por minuto: 600 ≈ 30 min, 2400 ≈ 2 h"
        required: false
        default: "600"
      max_minutes:
        description: "Minutos máximos de la corrida"
        required: false
        default: "90"
      hasta_hora:
        description: "Hora de Argentina (HH:MM) a la que se corta la corrida, por ejemplo 22:40 (vacío = sin hora de corte)"
        required: false
        default: ""
      actas:
        description: "Revisar SOLO estas actas (separadas por coma; vacío = los leads pre-boletín de siempre). Lee el PDF de la vista aunque ya esté resuelta."
        required: false
        default: ""
      reinterpretar:
        description: "No consulta a INPI: vuelve a interpretar el texto ya guardado de las vistas con el lector actual y corrige tipo, artículo, motivo, plazo y vencimiento."
        type: boolean
        required: false
        default: false
      guardar:
        description: "Guardar el resultado en el panel (columnas de vista de cada marca). Sin tildar, solo lee."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# Un solo carril contra INPI: si hay otro proceso de INPI corriendo, este espera su turno.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    # Una tanda de 600 marcas tarda ~30 min; con "limite" alto (una pasada de varios miles) puede llegar
    # a 2-3 h. El corte "prolijo" lo hace max_minutes; este es solo el tope duro del trabajo.
    timeout-minutes: 240
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Mirar la Grilla de los leads pre-boletín y buscar vistas
        run: |
          cd scripts
          args="--dias-minimos ${{ inputs.dias_minimos }} --limite ${{ inputs.limite }} --max-minutes ${{ inputs.max_minutes }}"
          if [ -n "${{ inputs.hasta_hora }}" ]; then args="$args --hasta-hora ${{ inputs.hasta_hora }}"; fi
          if [ "${{ inputs.guardar }}" = "true" ]; then args="$args --guardar"; fi
          if [ -n "${{ inputs.actas }}" ]; then args="$args --actas ${{ inputs.actas }}"; fi
          if [ "${{ inputs.reinterpretar }}" = "true" ]; then args="--reinterpretar"; fi
          python3 probar_vistas_preboletin.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
