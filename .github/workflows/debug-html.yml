name: Debug — dump HTML de un expediente INPI

on:
  workflow_dispatch:
    inputs:
      acta:
        description: "Número de acta a inspeccionar (sin agente)"
        required: true
        default: "4616749"
      acta_con_agente:
        description: "Número de acta a inspeccionar (con agente/apoderado)"
        required: true
        default: "4565634"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Probar con sesión (cookies) y comparar acta con/sin agente
        run: |
          mkdir -p data/debug_html
          {
          python3 - "${{ inputs.acta }}" "${{ inputs.acta_con_agente }}" << 'PYEOF'
          import sys, requests, time

          acta_sin, acta_con = sys.argv[1], sys.argv[2]
          BASE = "https://portaltramites.inpi.gob.ar"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "es-AR,es;q=0.9",
          }

          s = requests.Session()
          s.headers.update(HEADERS)

          # 1) visitar Grilla primero para tener cookies de sesion, como haria un browser real
          try:
              r = s.get(f"{BASE}/MarcasConsultas/Grilla", timeout=30)
              print(f"[grilla inicial] status={r.status_code} len={len(r.text)} cookies={list(s.cookies.keys())}")
          except Exception as e:
              print(f"[grilla inicial] ERROR {e}")

          time.sleep(1)

          for etiqueta, acta in [("sin_agente", acta_sin), ("con_agente", acta_con)]:
              for intento in range(3):
                  try:
                      # replicar el POST que hace frmGD (action=/MarcasConsultas/Resultado, method=post)
                      r = s.post(f"{BASE}/MarcasConsultas/Resultado",
                                 headers={"Referer": f"{BASE}/MarcasConsultas/Grilla"},
                                 data={"acta": acta}, timeout=30)
                      bloqueado = "Web Page Blocked" in r.text or "Attack ID" in r.text
                      print(f"[resultado-POST:{etiqueta}:{acta}] intento={intento} status={r.status_code} len={len(r.text)} bloqueado={bloqueado}")
                      with open(f"data/debug_html/sesion_resultado_POST_{etiqueta}_{acta}.html", "w", encoding="utf-8") as f:
                          f.write(r.text)
                      import re
                      paneles = re.findall(r'panel-title">\s*(?:<a[^>]*>)?\s*([^<\n]+)', r.text)
                      print(f"    paneles encontrados: {paneles}")
                      break
                  except Exception as e:
                      print(f"[resultado-POST:{etiqueta}:{acta}] intento={intento} ERROR {e}")
                      time.sleep(3)
              time.sleep(2)

          # 1.5) probar el flujo de GRILLA DIGITAL (form POST a /Home/GrillaDigital) para el acta sin agente
          try:
              r = s.post(f"{BASE}/Home/GrillaDigital",
                         headers={"Referer": f"{BASE}/MarcasConsultas/Resultado"},
                         data={"fname": f"1-{acta_sin}"}, timeout=30)
              bloqueado = "Web Page Blocked" in r.text or "Attack ID" in r.text
              print(f"[GrillaDigital POST] status={r.status_code} len={len(r.text)} bloqueado={bloqueado}")
              with open(f"data/debug_html/grilla_digital_{acta_sin}.html", "w", encoding="utf-8") as f:
                  f.write(r.text)
          except Exception as e:
              print(f"[GrillaDigital POST] ERROR {e}")

          # 1.6) listar los archivos de la Grilla Digital (para encontrar el "Formulario")
          try:
              r = s.post(f"{BASE}/Home/GrillaDigitales",
                         headers={"Referer": f"{BASE}/Home/GrillaDigital", "X-Requested-With": "XMLHttpRequest"},
                         data={"acta": acta_sin, "limit": 50, "offset": 0, "dir": "1"}, timeout=30)
              print(f"[GrillaDigitales POST] status={r.status_code} len={len(r.text)}")
              with open("data/debug_html/grilla_digitales_response.txt", "w", encoding="utf-8") as f:
                  f.write(r.text[:8000])
          except Exception as e:
              print(f"[GrillaDigitales POST] ERROR {e}")

          # 2) probar el endpoint JSON que usa la grilla de busqueda avanzada
          try:
              r = s.post(f"{BASE}/MarcasConsultas/GrillaMarcasPuntual",
                         headers={"Referer": f"{BASE}/MarcasConsultas/Grilla", "X-Requested-With": "XMLHttpRequest"},
                         data={"Acta": acta_sin, "limit": 10, "offset": 0}, timeout=30)
              print(f"[GrillaMarcasPuntual POST] status={r.status_code} len={len(r.text)}")
              with open("data/debug_html/grilla_marcas_puntual_response.txt", "w", encoding="utf-8") as f:
                  f.write(r.text[:5000])
          except Exception as e:
              print(f"[GrillaMarcasPuntual POST] ERROR {e}")
          PYEOF
          } > data/debug_html/log_sesion.txt 2>&1
          cat data/debug_html/log_sesion.txt

      - name: Subir dump a rama de debug
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -b "debug-html-${{ github.run_id }}"
          git add -f data/debug_html/
          git commit -m "debug: probar sesion/cookies y comparar acta con y sin agente" || echo "nada para commitear"
          git push origin "debug-html-${{ github.run_id }}"
