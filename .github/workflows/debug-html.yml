name: Debug — dump HTML de un expediente INPI

on:
  workflow_dispatch:
    inputs:
      acta:
        description: "Número de acta a inspeccionar"
        required: true
        default: "4616749"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Probar con requests plano (sin navegador) y con headers de navegador real
        run: |
          mkdir -p data/debug_html
          {
          python3 - "${{ inputs.acta }}" << 'PYEOF'
          import sys, requests

          acta = sys.argv[1]
          BASE = "https://portaltramites.inpi.gob.ar"

          pruebas = {
              "plain_no_headers": {},
              "browser_headers": {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "es-AR,es;q=0.9",
                  "Referer": f"{BASE}/MarcasConsultas",
              },
          }
          for nombre, headers in pruebas.items():
              try:
                  r = requests.get(f"{BASE}/MarcasConsultas/Resultado?acta={acta}", headers=headers, timeout=20)
                  bloqueado = "Web Page Blocked" in r.text or "Attack ID" in r.text
                  print(f"[requests:{nombre}] status={r.status_code} len={len(r.text)} bloqueado={bloqueado}")
                  with open(f"data/debug_html/requests_{nombre}_{acta}.html", "w", encoding="utf-8") as f:
                      f.write(r.text)
              except Exception as e:
                  print(f"[requests:{nombre}] ERROR {e}")

          # también probar la página de listado, que sabemos que sí funciona hoy
          try:
              r = requests.get(f"{BASE}/Boletines?Tipo_Item=3", timeout=20)
              bloqueado = "Web Page Blocked" in r.text or "Attack ID" in r.text
              print(f"[requests:listado_boletines] status={r.status_code} len={len(r.text)} bloqueado={bloqueado}")
          except Exception as e:
              print(f"[requests:listado_boletines] ERROR {e}")

          # probar /MarcasConsultas/Grilla (donde el script original busca CARACTER)
          try:
              r = requests.get(f"{BASE}/MarcasConsultas/Grilla?acta={acta}", headers=pruebas["browser_headers"], timeout=20)
              bloqueado = "Web Page Blocked" in r.text or "Attack ID" in r.text
              print(f"[requests:grilla] status={r.status_code} len={len(r.text)} bloqueado={bloqueado}")
              with open(f"data/debug_html/requests_grilla_{acta}.html", "w", encoding="utf-8") as f:
                  f.write(r.text)
          except Exception as e:
              print(f"[requests:grilla] ERROR {e}")

          # el .js de la página de Resultado, para ver si carga algo por AJAX
          try:
              r = requests.get(f"{BASE}/Scripts/MarcasConsultas/Resultado.js", headers=pruebas["browser_headers"], timeout=20)
              print(f"[requests:resultado.js] status={r.status_code} len={len(r.text)}")
              with open("data/debug_html/resultado_js.txt", "w", encoding="utf-8") as f:
                  f.write(r.text)
          except Exception as e:
              print(f"[requests:resultado.js] ERROR {e}")

          # comparar con un acta que SI tiene agente (matricula 1881), para ver el bloque GESTION
          acta_con_agente = "4565634"
          try:
              r = requests.get(f"{BASE}/MarcasConsultas/Resultado?acta={acta_con_agente}", headers=pruebas["browser_headers"], timeout=20)
              print(f"[requests:resultado_con_agente] status={r.status_code} len={len(r.text)}")
              with open(f"data/debug_html/requests_resultado_{acta_con_agente}.html", "w", encoding="utf-8") as f:
                  f.write(r.text)
          except Exception as e:
              print(f"[requests:resultado_con_agente] ERROR {e}")
          PYEOF
          } > data/debug_html/log_requests.txt 2>&1
          cat data/debug_html/log_requests.txt

      - name: Subir dump a rama de debug
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -b "debug-html-${{ github.run_id }}"
          git add -f data/debug_html/
          git commit -m "debug: dump HTML acta ${{ inputs.acta }}" || echo "nada para commitear"
          git push origin "debug-html-${{ github.run_id }}"
