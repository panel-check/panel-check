name: "Oposiciones y vistas"

on:
  schedule:
    # Todos los días a las 01:00 UTC (22:00 ART), después del escaneo del turno A.
    # Revisa a cada lead a los 10, 23 y 33 días de su publicación y vuelve a mirar
    # los que tienen oposición (ver revisar_oposiciones.py). El mail de aviso
    # sale a las 07:30 ART (avisos_manana.yml).
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Minutos máximos de esta corrida (default 30)"
        required: false
        default: "30"
      limit:
        description: "Tope de actas a revisar en esta corrida (dejar vacío = todas)"
        required: false
        default: ""

permissions:
  contents: read

# Un solo carril contra INPI: dos procesos que consultan INPI nunca corren a la
# vez (INPI pidió una sola tanda, máx. 100 conexiones). Si hay uno corriendo, el
# siguiente espera su turno. GitHub guarda UNA sola corrida en espera por grupo.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar Grilla Digital de los leads en sus hitos de 10, 23 y 33 días
        run: |
          cd scripts
          args="--max-minutes ${{ inputs.max_minutes || '30' }}"
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          python3 revisar_oposiciones.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
