name: "Oposiciones y vistas"

on:
  schedule:
    # Todos los días a las 10:00 UTC (07:00 ART) — no depende de cuándo sale
    # cada boletín, revisa lo que ya cumplió el plazo sin importar el día.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Revisar leads con publicación de al menos N días (default 33)"
        required: false
        default: ""
      limit:
        description: "Tope de actas a revisar en esta corrida (dejar vacío = todas)"
        required: false
        default: ""
      parcial:
        description: "Revisión anticipada: mira los leads con el plazo de oposición todavía abierto (menos de 'dias' días). No los da por revisados."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar Grilla Digital de leads (>= 33 días; con "parcial", los de plazo abierto)
        run: |
          cd scripts
          args=""
          if [ -n "${{ inputs.dias }}" ]; then args="$args --dias ${{ inputs.dias }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then args="$args --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.parcial }}" = "true" ]; then args="$args --parcial"; fi
          python3 revisar_oposiciones.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

      - name: Avisar por mail los leads con oposición/vista nueva (Resend)
        # Corre aunque el paso anterior haya fallado a mitad de camino: avisa
        # lo que sí alcanzó a detectar.
        # En una corrida parcial manual no se manda: el aviso sale en la corrida
        # diaria de las 7 hs con todo lo pendiente.
        if: (success() || failure()) && inputs.parcial != true
        run: |
          cd scripts
          python3 notificar_oposiciones.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PYTHONUNBUFFERED: "1"
