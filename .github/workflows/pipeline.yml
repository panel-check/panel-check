name: Pipeline INPI Marcas Nuevas

on:
  schedule:
    # Lunes, miércoles, viernes y sábado a las 09:00 UTC (06:00 ART) — 4 veces por semana
    - cron: "0 9 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      boletin:
        description: "Número de boletín a procesar manualmente (dejar vacío para autodetectar el último)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Listar boletines nuevos (o usar el número forzado manualmente)
        id: listar
        run: |
          mkdir -p data
          if [ -n "${{ inputs.boletin }}" ]; then
            numero="${{ inputs.boletin }}"
            echo "[{\"numero\": \"$numero\", \"fecha\": null, \"pdf_url\": \"https://portaltramites.inpi.gob.ar/Uploads/Boletines/${numero}_3_.pdf\", \"comentario\": \"forzado manualmente\"}]" > data/boletines.json
            echo "Boletín forzado manualmente: $numero"
          else
            python3 scripts/listar_boletines.py --out data/boletines.json
          fi
          cat data/boletines.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Extraer texto de los PDFs (Apify)
        run: |
          python3 scripts/extraer_pdf_apify.py --urls-file data/boletines.json --out-dir data/textos
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Parsear boletines
        run: |
          python3 scripts/parse_boletin.py --text-dir data/textos --out-dir data/csv

      - name: Diagnóstico — muestra de texto y filas parseadas
        run: |
          for t in data/textos/*_text.txt; do
            echo "=== $t: $(wc -c < "$t") caracteres ==="
            head -c 1500 "$t"
            echo
          done
          for c in data/csv/*.csv; do
            echo "=== $c: $(wc -l < "$c") líneas ==="
            head -5 "$c"
          done

      - name: Completar Mixtas/Figurativas
        run: |
          for f in data/csv/*.csv; do
            numero=$(basename "$f" .csv)
            python3 scripts/completar_mixtas.py --in "$f" --out "data/csv/${numero}_completo.csv"
          done

      - name: Validar leads reales (Playwright) — solo boletín más reciente, prueba
        run: |
          ultimo=$(ls -t data/csv/*_completo.csv | head -1)
          python3 scripts/validar_leads.py --in "$ultimo" --out "${ultimo%.csv}_leads.csv" --limit 30

      - name: Cargar a la base (Railway)
        run: |
          for f in data/csv/*_completo_leads.csv; do
            numero=$(basename "$f" | sed 's/_completo_leads.csv//')
            python3 scripts/cargar_db.py --in "$f" --boletin "$numero"
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Subir resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-boletines
          path: data/
          retention-days: 30
          if-no-files-found: ignore

      - name: Subir datos intermedios a una rama de debug (siempre, para poder inspeccionar)
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -b "debug-run-${{ github.run_id }}"
          git add -f data/ 2>/dev/null || true
          git commit -m "debug: datos intermedios de la corrida ${{ github.run_id }}" || echo "nada para commitear"
          git push origin "debug-run-${{ github.run_id }}" || echo "no se pudo pushear la rama de debug"
