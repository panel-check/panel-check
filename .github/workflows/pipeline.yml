name: Pipeline INPI Marcas Nuevas

on:
  schedule:
    # Lunes, miércoles, viernes y sábado a las 09:00 UTC (06:00 ART) — 4 veces por semana
    - cron: "0 9 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      boletin:
        description: "Número de boletín a procesar manualmente (dejar vacío para autodetectar el último)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Listar boletines nuevos (o usar el número forzado manualmente)
        id: listar
        run: |
          mkdir -p data
          if [ -n "${{ inputs.boletin }}" ]; then
            numero="${{ inputs.boletin }}"
            echo "[{\"numero\": \"$numero\", \"fecha\": null, \"pdf_url\": \"https://portaltramites.inpi.gob.ar/Uploads/Boletines/${numero}_3_.pdf\", \"comentario\": \"forzado manualmente\"}]" > data/boletines.json
            echo "Boletín forzado manualmente: $numero (se reprocesa aunque ya esté importado -- es lo que pide un número a mano)"
            echo "saltar=false" >> "$GITHUB_OUTPUT"
          else
            # listar_boletines.py devuelve TODO el historial de "MARCAS NUEVAS" visible en el
            # listado, no solo el último.
            python3 scripts/listar_boletines.py --out data/boletines_todos.json
            # Elegimos el de número más alto que TODAVÍA no esté importado --
            # no directamente "el más alto", porque si ese ya está cargado no
            # hay que quedarse de brazos cruzados: puede haber uno anterior
            # que se haya salteado (falla puntual, corrida vieja, etc.) y
            # conviene detectarlo igual. Agregado el 30/09/2026 a pedido del
            # usuario -- antes, si el más nuevo ya estaba importado, el
            # pipeline no buscaba ningún otro.
            elegido=$(python3 scripts/elegir_boletin_pendiente.py data/boletines_todos.json)
            if [ "$elegido" = "NINGUNO" ]; then
              echo "Todos los boletines de la lista ya están importados -- no hay ninguno nuevo, se salta el resto del pipeline."
              echo "saltar=true" >> "$GITHUB_OUTPUT"
            else
              echo "$elegido" | python3 -c "import json,sys; json.dump([json.loads(sys.stdin.read())], open('data/boletines.json','w'), ensure_ascii=False, indent=2)"
              echo "saltar=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          cat data/boletines.json
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}

      - name: Extraer texto de los PDFs (Apify)
        if: steps.listar.outputs.saltar != 'true'
        run: |
          python3 scripts/extraer_pdf_apify.py --urls-file data/boletines.json --out-dir data/textos
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Parsear boletines
        if: steps.listar.outputs.saltar != 'true'
        run: |
          python3 scripts/parse_boletin.py --text-dir data/textos --out-dir data/csv

      - name: Diagnóstico — tamaños de archivos generados (sin contenido)
        # Antes volcaba a los logs las primeras líneas de cada CSV (titular,
        # CUIT, email de terceros) y un extracto del texto crudo del PDF del
        # boletín (que también trae esos mismos datos). Se sacó el
        # 29/09/2026: en un repo público esos logs quedan visibles para
        # cualquiera. Para inspeccionar el contenido real sigue estando el
        # artifact "resultados-boletines" (paso de más abajo), que no es
        # público — solo lo puede bajar quien tiene acceso al repo.
        if: always() && steps.listar.outputs.saltar != 'true'
        run: |
          shopt -s nullglob
          if [ -f data/textos/_debug_apify_response.json ]; then
            echo "=== respuesta cruda de Apify: $(wc -c < data/textos/_debug_apify_response.json) bytes ==="
          fi
          for t in data/textos/*_text.txt; do
            echo "=== $t: $(wc -c < "$t") caracteres ==="
          done
          for c in data/csv/*.csv; do
            echo "=== $c: $(wc -l < "$c") líneas ==="
          done
          echo "diagnóstico completo (no falla el job)"

      - name: Completar Mixtas/Figurativas
        if: steps.listar.outputs.saltar != 'true'
        run: |
          shopt -s nullglob
          archivos=(data/csv/*.csv)
          if [ ${#archivos[@]} -eq 0 ]; then
            echo "No hay CSVs para completar (revisar el paso de extracción/parseo)."
            exit 1
          fi
          for f in "${archivos[@]}"; do
            numero=$(basename "$f" .csv)
            python3 scripts/completar_mixtas.py --in "$f" --out "data/csv/${numero}_completo.csv"
          done

      - name: Validar leads reales (requests, sin navegador) — todas las candidatas del boletín
        if: steps.listar.outputs.saltar != 'true'
        run: |
          ultimo=$(ls -t data/csv/*_completo.csv | head -1)
          python3 scripts/validar_leads.py --in "$ultimo" --out "${ultimo%.csv}_leads.csv"

      - name: Cargar a la base (Railway)
        if: steps.listar.outputs.saltar != 'true'
        run: |
          mkdir -p data
          {
            echo "DATABASE_URL configurada: $([ -n "$DATABASE_URL" ] && echo si || echo no)"
            echo "Host en DATABASE_URL: $(python3 -c "import os,urllib.parse as u; p=u.urlparse(os.environ.get('DATABASE_URL','')); print(p.hostname, p.port)" 2>&1)"
            for f in data/csv/*_completo_leads.csv; do
              numero=$(basename "$f" | sed 's/_completo_leads.csv//')
              python3 scripts/cargar_db.py --in "$f" --boletin "$numero"
            done
          } > >(tee data/debug_carga_db.log) 2> >(tee -a data/debug_carga_db.log >&2)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}

      - name: Subir resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-boletines
          path: data/
          retention-days: 30
          if-no-files-found: ignore
          # (antes también subíamos data/ a una rama "debug-run-<id>" nueva en
          # cada corrida, además del artifact de arriba. Se sacó el 29/09/2026:
          # esas ramas quedaban para siempre con CSV de titulares/CUIT/emails
          # de terceros -- un riesgo serio de filtración si el repo se hace
          # público en algún momento, y redundante con este artifact, que ya
          # cumple la misma función de "poder inspeccionar" con vencimiento a
          # los 30 días. Se borraron las ~29 ramas debug-run-*/debug-html-*
          # que habían quedado acumuladas.
