name: Pipeline INPI Marcas Nuevas

on:
  schedule:
    # Lunes, miércoles, viernes y sábado a las 09:00 UTC (06:00 ART) — 4 veces por semana
    - cron: "0 9 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      boletin:
        description: "Número de boletín a procesar manualmente (dejar vacío para autodetectar el último)"
        required: false
        default: ""

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Listar boletines nuevos
        id: listar
        run: |
          python3 scripts/listar_boletines.py --out data/boletines.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Extraer texto de los PDFs (Apify)
        run: |
          python3 scripts/extraer_pdf_apify.py --urls-file data/boletines.json --out-dir data/textos
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Parsear boletines
        run: |
          python3 scripts/parse_boletin.py --text-dir data/textos --out-dir data/csv

      - name: Completar Mixtas/Figurativas
        run: |
          for f in data/csv/*.csv; do
            numero=$(basename "$f" .csv)
            python3 scripts/completar_mixtas.py --in "$f" --out "data/csv/${numero}_completo.csv"
          done

      - name: Validar leads reales (Playwright) — solo boletín más reciente, prueba
        run: |
          ultimo=$(ls -t data/csv/*_completo.csv | head -1)
          python3 scripts/validar_leads.py --in "$ultimo" --out "${ultimo%.csv}_leads.csv" --limit 30

      - name: Cargar a la base (Railway)
        run: |
          for f in data/csv/*_completo_leads.csv; do
            numero=$(basename "$f" | sed 's/_completo_leads.csv//')
            python3 scripts/cargar_db.py --in "$f" --boletin "$numero"
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Subir resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: resultados-boletines
          path: data/csv/
          retention-days: 30
