name: "Seguimiento de la cartera"

on:
  # Sin horario de GitHub (27/10/2026): GitHub dispara los `schedule:` con 3 a 6 horas de atraso o los saltea.
  # Lo lanza el panel a su hora exacta (panel/programador.py, cron UTC «35 1 * * *») con este mismo workflow_dispatch,
  # esperando turno si el carril de INPI está ocupado. Se puede lanzar a mano igual.
    # Una vez por día, 01:35 UTC (22:35 ART), después de "Oposiciones".
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Corta la corrida pasado este tiempo (minutos)"
        required: false
        default: "15"
      todas:
        description: "Revisar TODA la cartera, sin mirar cuándo se consultó cada marca (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar en INPI los expedientes de la cartera
        run: |
          cd scripts
          args="--max-minutes ${{ inputs.max_minutes || '15' }}"
          if [ "${{ inputs.todas }}" = "true" ]; then args="$args --todas"; fi
          python3 revisar_cartera.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
