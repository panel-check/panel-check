name: DIAG form busqueda avanzada (descartable)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Inspeccionar campos del formulario
        run: cd scripts && python3 -c "
import re
from validar_leads import crear_sesion, BASE
s = crear_sesion()
r = s.get(f'{BASE}/marcasconsultas/busqueda/?Cod_Funcion=NQA0ADE', timeout=30)
print(f'::notice::status={r.status_code}')
idx = r.text.find('NroActa')
print(f'::notice::contexto: ...{r.text[max(0,idx-400):idx+200]}...')
"
        env:
          PYTHONUNBUFFERED: "1"
      - name: Probar busqueda por NroResolucion=3136523
        run: cd scripts && python3 -c "
from validar_leads import crear_sesion, BASE, _get_con_reintentos
s = crear_sesion()
s.get(f'{BASE}/marcasconsultas/busqueda/?Cod_Funcion=NQA0ADE', timeout=30)
for campo in ['NroResolucion', 'NroActa']:
    payload = {
        'Tipo_Resolucion': '', 'Clase': '', 'TipoBusquedaDenominacion': '1',
        'Denominacion': '', 'Titular': '', 'TipoBusquedaTitular': '0',
        'Fecha_IngresoDesde': '', 'Fecha_IngresoHasta': '',
        'Fecha_ResolucionDesde': '', 'Fecha_ResolucionHasta': '',
        'vigentes': False, 'limit': 20, 'offset': 0,
        campo: '3136523',
    }
    try:
        rr = _get_con_reintentos(lambda: s.post(
            f'{BASE}/MarcasConsultas/GrillaMarcasAvanzada', json=payload,
            headers={'Referer': f'{BASE}/marcasconsultas/busqueda/?Cod_Funcion=NQA0ADE', 'X-Requested-With': 'XMLHttpRequest'},
            timeout=30))
        data = rr.json()
        print(f'::notice::{campo}=3136523 -> total={data.get(\"total\")} rows={data.get(\"rows\")}')
    except Exception as e:
        print(f'::notice::error {campo}: {e}')
"
        env:
          PYTHONUNBUFFERED: "1"
