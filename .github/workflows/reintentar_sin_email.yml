name: "Completar datos faltantes - Sin email"

on:
  schedule:
    # Una vez por noche, 08:10 UTC (05:10 ART, turno B), con tope de 60 min. No
    # corre la madrugada del martes al miércoles (UTC miércoles): ahí el carril
    # es de los boletines. Cada intento fallido de una acta duplica la espera
    # hasta el próximo (1, 2, 4... máx. 48 h): ver reintentos_n en la base.
    - cron: "10 8 * * 0,1,2,4,5,6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Tope de leads a reintentar en esta corrida (dejar vacío = todos)"
        required: false
        default: "300"
      max_minutes:
        description: "Minutos máximos de esta corrida (default 60)"
        required: false
        default: "60"

permissions:
  contents: read

# Un solo carril contra INPI: dos procesos que consultan INPI nunca corren a la
# vez (INPI pidió una sola tanda, máx. 100 conexiones). Si hay uno corriendo, el
# siguiente espera su turno. GitHub guarda UNA sola corrida en espera por grupo.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  reintentar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Reintentar email de leads confirmados sin email
        run: |
          cd scripts
          LIMIT="${{ inputs.limit }}"
          args=""
          if [ -n "$LIMIT" ]; then args="--limit $LIMIT"; else args="--limit 300"; fi
          args="$args --max-minutes ${{ inputs.max_minutes || '60' }}"
          python3 reintentar_sin_email.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
