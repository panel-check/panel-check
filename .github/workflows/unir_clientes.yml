name: Unir dos clientes duplicados

on:
  workflow_dispatch:
    inputs:
      buscar:
        description: "Para ver los ids: texto del nombre a buscar (no une nada; muestra id, tag, cantidad de marcas y actas, sin nombres)"
        required: false
        default: ""
      origen:
        description: "Id del cliente que se borra (sus marcas, novedades, alertas, formularios y poderes pasan al destino)"
        required: false
        default: ""
      destino:
        description: "Id del cliente que se queda con todo"
        required: false
        default: ""
      acta_control:
        description: "Un acta que el cliente de origen debe tener (control de seguridad; recomendado)"
        required: false
        default: ""
      simular:
        description: "Solo contar lo que se movería, sin escribir (true/false)"
        required: false
        default: "true"
      forzar:
        description: "Seguir aunque los dos clientes tengan CUIT distinto (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  unir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Unir los clientes
        run: |
          cd scripts
          if [ -n "$BUSCAR" ]; then
            python3 unir_clientes.py --buscar "$BUSCAR"
            exit 0
          fi
          args=(--origen "$ORIGEN" --destino "$DESTINO" --acta-control "$ACTA_CONTROL")
          if [ "$SIMULAR" = "true" ]; then args+=(--simular); fi
          if [ "$FORZAR" = "true" ]; then args+=(--forzar); fi
          python3 unir_clientes.py "${args[@]}"
        env:
          BUSCAR: ${{ inputs.buscar }}
          ORIGEN: ${{ inputs.origen }}
          DESTINO: ${{ inputs.destino }}
          ACTA_CONTROL: ${{ inputs.acta_control }}
          SIMULAR: ${{ inputs.simular }}
          FORZAR: ${{ inputs.forzar }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
