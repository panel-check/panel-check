name: "Feriados"

on:
  # Sin horario de GitHub (27/10/2026): GitHub dispara los `schedule:` con 3 a 6 horas de atraso o los saltea.
  # Lo lanza el panel a su hora exacta (panel/programador.py, cron UTC «15 9 * * *») con este mismo workflow_dispatch,
  # esperando turno si el carril de INPI está ocupado. Se puede lanzar a mano igual.
    # Todos los días a las 09:15 UTC (06:15 ART), antes de los avisos de la mañana (07:30 ART).
    # Baja los feriados nacionales de argentina.gob.ar y actualiza la tabla `feriados`: el Gobierno
    # cambia la lista durante el año (feriados trasladados, días no laborables nuevos), y de eso
    # dependen los vencimientos de las vistas de 10 días hábiles. Si cambió algo que afecta los días
    # hábiles, recalcula los vencimientos de las vistas guardadas (sin consultar a INPI).
    # No consulta INPI, por eso no usa el carril de INPI.
  workflow_dispatch:
    inputs:
      anios:
        description: "Años a sincronizar, separados por coma (vacío = el actual y el siguiente)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: feriados
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Si la página cambió de formato o no responde, la corrida queda roja y la tabla no se toca.
      - name: Bajar los feriados y recalcular los vencimientos si cambiaron
        run: |
          cd scripts
          args=""
          if [ -n "${{ inputs.anios }}" ]; then args="--anios ${{ inputs.anios }}"; fi
          python3 feriados.py $args
