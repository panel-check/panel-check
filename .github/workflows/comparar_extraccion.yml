name: Comparar extracción Apify vs local (diagnóstico)

on:
  workflow_dispatch:
    inputs:
      boletin:
        description: "Número de boletín a comparar"
        required: true
        default: "11116"

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comparar con pdfplumber
        continue-on-error: true
        run: cd scripts && python3 comparar_extraccion.py --numero "${{ inputs.boletin }}" --motor pdfplumber
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PYTHONUNBUFFERED: "1"

      - name: Comparar con pypdf
        continue-on-error: true
        run: cd scripts && python3 comparar_extraccion.py --numero "${{ inputs.boletin }}" --motor pypdf
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PYTHONUNBUFFERED: "1"
