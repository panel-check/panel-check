name: "Completar datos faltantes - Sin verificar"

on:
  schedule:
    # Una vez por noche, 02:05 UTC (23:05 ART, turno A), con tope de 60 min. No
    # corre la noche del martes (UTC miércoles): ahí el turno A se recorta para
    # dejar libre el carril a las 00:05 ART. Cada intento fallido de una acta
    # duplica la espera hasta el próximo (1, 2, 4... máx. 48 h): ver
    # reintentos_n en la base.
    - cron: "5 2 * * 0,1,2,4,5,6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Tope de actas a reintentar en esta corrida (dejar vacío = todas)"
        required: false
        default: "400"
      max_minutes:
        description: "Minutos máximos de esta corrida (default 60)"
        required: false
        default: "60"

permissions:
  contents: read

# Un solo carril contra INPI: dos procesos que consultan INPI nunca corren a la
# vez (INPI pidió una sola tanda, máx. 100 conexiones). Si hay uno corriendo, el
# siguiente espera su turno. GitHub guarda UNA sola corrida en espera por grupo.
concurrency:
  group: inpi-lane
  cancel-in-progress: false

jobs:
  reintentar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Alarma de bloqueo masivo de INPI (scripts/monitor_bloqueo.py)
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Reintentar marcas con es_lead sin verificar
        run: |
          cd scripts
          # inputs.limit solo existe en corridas manuales (workflow_dispatch);
          # una corrida por horario (schedule) no tiene ese contexto, así que
          # cae acá en el default de 200 igual. Subido de 50 a 200 el
          # 29/09/2026 junto con bajar la frecuencia a cada 2hs: un lote más
          # grande no cuesta más tiempo cuando hay poco pendiente (el caso de
          # casi todos los días), pero evita que un pico grande de "sin
          # verificar" (ej. 1000 marcas de golpe) tarde 40 horas en
          # resolverse por quedar atado a lotes chicos — con 200 por corrida
          # se resuelve en ~5 corridas (~10hs en el peor caso), parecido a la
          # velocidad de cuando corría cada 30 min. "todas de una" queda
          # solo para cuando se dispara a mano y se borra el campo limit a
          # propósito.
          LIMIT="${{ inputs.limit }}"
          args=""
          if [ -n "$LIMIT" ]; then args="--limit $LIMIT"; else args="--limit 400"; fi
          args="$args --max-minutes ${{ inputs.max_minutes || '60' }}"
          python3 reintentar_sin_verificar.py $args
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
