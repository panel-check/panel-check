name: "Vigilancia marcaria"

on:
  # Se dispara sola apenas termina "Solicitudes nuevas del día" (escanear_actas.yml),
  # en vez de tener un horario propio (decidido el 15/10/2026). Como compara() ya
  # mira cualquier solicitud nueva todavía no comparada —boletines incluidos—, esto
  # alcanza también para los miércoles: los boletines se importan a mano durante la
  # mañana, y para cuando el escaneo (18:00 ART) termina y dispara esta corrida, ya
  # están cargados. No consulta INPI (solo compara contra la base), por eso no usa
  # el carril de INPI. Los mails salen a las 07:30 ART (avisos_manana.yml).
  workflow_run:
    workflows: ["Solicitudes nuevas del día (escaneo de actas)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# No se pisan dos corridas (la comparación escribe alertas; el mail marca avisos).
concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    # Si lo disparó el escaneo (workflow_run), solo seguir cuando terminó bien:
    # si falló o se canceló no hay solicitudes nuevas confiables para comparar.
    # Un disparo manual (workflow_dispatch) no tiene esa condición.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comparar solicitudes nuevas con la cartera
        run: |
          cd scripts
          python3 vigilancia.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
