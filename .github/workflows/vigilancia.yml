name: "Vigilancia marcaria"

on:
  schedule:
    # 3 veces por día (UTC): 03:20, 09:20 y 15:20 = 00:20, 06:20 y 12:20 ART, después
    # de cada turno de escaneo. No consulta INPI (solo compara contra la base), por
    # eso no usa el carril de INPI. Los mails salen a las 07:30 ART (avisos_manana.yml).
    - cron: "20 3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

# No se pisan dos corridas (la comparación escribe alertas; el mail marca avisos).
concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      NOTIFICAR_A: ${{ secrets.NOTIFICAR_A }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comparar solicitudes nuevas con la cartera
        run: |
          cd scripts
          python3 vigilancia.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"
