name: Validar contenido real de PDF de oposición (diagnóstico puntual)

on:
  workflow_dispatch:
    inputs:
      acta:
        description: "Acta a inspeccionar (vacío = elige automáticamente una con tuvo_oposicion=true)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Elegir acta
        id: elegir
        run: |
          cd scripts
          args=""
          if [ -n "${{ inputs.acta }}" ]; then args="--acta ${{ inputs.acta }}"; fi
          salida=$(python3 validar_pdf_oposicion.py --modo elegir $args)
          echo "$salida"
          acta=$(echo "$salida" | grep -oP 'ACTA_ELEGIDA=\K\d+' | head -1)
          echo "acta=$acta" >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_PUBLIC_URL }}
          PYTHONUNBUFFERED: "1"

      - name: Sección OPOSICIONES / VISTAS de la página del expediente
        run: |
          cd scripts
          python3 validar_pdf_oposicion.py --acta "${{ steps.elegir.outputs.acta }}" --modo seccion
        env:
          PYTHONUNBUFFERED: "1"

      - name: Listado de archivos de la oposición en Grilla Digital
        run: |
          cd scripts
          python3 validar_pdf_oposicion.py --acta "${{ steps.elegir.outputs.acta }}" --modo archivos
        env:
          PYTHONUNBUFFERED: "1"

      - name: Leer PDF "Formulario" de la oposición
        run: |
          cd scripts
          python3 validar_pdf_oposicion.py --acta "${{ steps.elegir.outputs.acta }}" --modo pdf --pdf-indice Formulario
        env:
          PYTHONUNBUFFERED: "1"

      - name: Leer PDF "Recibo de Ingreso" de la oposición
        run: |
          cd scripts
          python3 validar_pdf_oposicion.py --acta "${{ steps.elegir.outputs.acta }}" --modo pdf --pdf-indice "Recibo de Ingreso"
        env:
          PYTHONUNBUFFERED: "1"
