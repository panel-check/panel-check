name: Probar formularios con base

# Prueba de punta a punta de los formularios (envío y link para corregir) contra una base
# Postgres descartable del propio runner: nunca toca la base de Railway. Datos inventados.
on:
  workflow_dispatch:
  push:
    branches: [claude/formulario-link-correccion]

jobs:
  probar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prueba
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r panel/requirements.txt httpx
      - name: Pruebas
        env:
          TEST_DATABASE_URL: postgresql://postgres:prueba@localhost:5432/postgres
        working-directory: scripts
        run: python -m unittest -v test_formulario_correccion_db test_formularios
